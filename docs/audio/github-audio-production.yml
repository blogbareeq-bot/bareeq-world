# Canonical production audio workflow. Copy to .github/workflows/audio-production.yml
# only after offline safety tests pass. This file is the source of truth for mode
# checks in scripts/test-audio-production-safety.mjs.
name: Bareeq audio production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run never calls a provider. generate-candidate never publishes. validate-candidate never publishes. publish-approved requires listening tied to the file fingerprint.
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - generate-candidate
          - validate-candidate
          - publish-approved
      article:
        description: Required except dry-run.
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: bareeq-audio-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BAREEQ_CLOUD_TTS_ACTIVATE: '0'
      BAREEQ_GEMINI_FREE_ROLLOUT: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Offline safety tests
        run: |
          node scripts/test-audio-lifecycle.mjs
          node scripts/test-audio-production-safety.mjs
          node scripts/test-speech-script-quality-gate.mjs
          node scripts/check-speech-scripts.mjs

      - name: Restore candidate cache
        uses: actions/cache/restore@v4
        with:
          path: audio-candidates
          key: bareeq-audio-candidate-${{ inputs.article || 'none' }}-${{ hashFiles('scripts/audio-constants.mjs', 'scripts/audio-split.mjs', 'scripts/speech-scripts/**') }}
          restore-keys: |
            bareeq-audio-candidate-${{ inputs.article || 'none' }}-

      - name: Dry-run
        if: inputs.mode == 'dry-run'
        run: |
          node scripts/audio-inventory.mjs
          node scripts/audio-production.mjs --mode=dry-run
          echo 'Dry-run complete. No TTS/ASR request was sent. generate-candidate does not publish.'

      - name: Generate candidate
        id: generate
        if: inputs.mode == 'generate-candidate'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BAREEQ_AUDIO_PRODUCTION_LOCK: '1'
        run: |
          set +e
          node scripts/audio-production.mjs --mode=generate-candidate --article=${{ inputs.article }}
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "75" ]; then
            echo 'Quota pause HTTP 429. Completed fingerprint parts were saved. This step is not a success.'
            exit 75
          fi
          exit "$status"

      - name: Validate candidate
        id: validate
        if: inputs.mode == 'validate-candidate'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo 'validate-candidate: merge full.mp3, technical QA, ASR gemini-3.5-transcribe, ASR gemini-3.6-flash, 0/0/0, listening pack. Does not publish.'
          node scripts/audio-production.mjs --mode=validate-candidate --article=${{ inputs.article }}

      - name: Publish approved
        if: inputs.mode == 'publish-approved'
        run: |
          echo 'publish-approved refuses without human listening evidence bound to the candidate file SHA-256.'
          node scripts/audio-production.mjs --mode=publish-approved --article=${{ inputs.article }}

      - name: Save candidate cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: audio-candidates
          key: bareeq-audio-candidate-${{ inputs.article || 'none' }}-${{ hashFiles('scripts/audio-constants.mjs', 'scripts/audio-split.mjs', 'scripts/speech-scripts/**') }}-${{ github.run_id }}

      - name: Upload candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-candidate-${{ inputs.article || 'dry-run' }}-${{ github.run_id }}
          path: |
            audio-candidates/
            docs/audio/DRY-RUN.json
          if-no-files-found: warn
