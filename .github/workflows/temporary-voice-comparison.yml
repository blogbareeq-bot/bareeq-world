name: Temporary Bareeq voice comparison

# Manual-only diagnostic. Do not consume the production Gemini quota on every
# audio branch push; production/correction workflows own that quota.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate remaining comparison samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p voice-samples
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { synthesizeGeminiGenerateContentPart } from './scripts/audio-gemini-tts.mjs';

          const text = 'قد نختصر المشهد بقولنا إن الأسعار ارتفعت، لكن هذا الاختصار لا يكفي. فارتفاع سعر البن بعد موسم سيئ لا يساوي تضخمًا في الاقتصاد كله، وبقاء الأسعار مرتفعة لا يعني أن التضخم ما زال يتسارع. لفهم الأخبار الاقتصادية بوعي، نحتاج إلى فصل ثلاثة أشياء: مستوى الأسعار، ومُعَدَّلَ تَغَيُّرِهِ، والقوة الشرائية للنقود.';
          const voices = ['Gacrux', 'Sulafat'];
          const failures = [];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function generateVoice(voice) {
            for (let attempt = 1; attempt <= 5; attempt += 1) {
              try {
                console.log(`Generating ${voice}, attempt ${attempt}...`);
                const result = await synthesizeGeminiGenerateContentPart({
                  apiKey: process.env.GEMINI_API_KEY,
                  part: { text },
                  context: { articleTitle: 'التضخم ببساطة: لماذا ترتفع الأسعار؟' },
                  voice,
                });
                fs.writeFileSync(`voice-samples/${voice}.mp3`, result.audio);
                console.log(`Generated ${voice}: ${result.audio.length} bytes`);
                return true;
              } catch (error) {
                const quota = error?.code === 'BAREEQ_QUOTA' || error?.httpStatus === 429;
                const overloaded = error?.httpStatus === 503 || /high demand|UNAVAILABLE/i.test(error?.message || '');
                console.error(`Attempt ${attempt} failed for ${voice}: ${error.message}`);
                if ((!quota && !overloaded) || attempt === 5) {
                  failures.push({ voice, message: error.message, exitCode: error.exitCode || null });
                  return false;
                }
                const delay = quota ? 65000 : 30000;
                console.log(`Transient provider limit for ${voice}; waiting ${delay / 1000}s before retry.`);
                await sleep(delay);
              }
            }
            return false;
          }

          for (const voice of voices) await generateVoice(voice);

          fs.writeFileSync('voice-samples/manifest.json', JSON.stringify({ text, voices, failures }, null, 2));
          if (failures.length) process.exitCode = 1;
          NODE

      - name: Upload voice samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bareeq-voice-comparison-${{ github.run_id }}
          path: voice-samples/
          if-no-files-found: error
