name: Verify Gemini pilot transcript via curl transport

on:
  push:
    branches:
      - audio/fahed-v4220
    paths:
      - .github/workflows/verify-gemini-pilot-curl.yml
      - scripts/gemini-curl-fetch-shim.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemini-pilot-curl-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify curl transport and exact transcript contract
        run: |
          curl --version
          node --check scripts/gemini-curl-fetch-shim.mjs
          node --check scripts/verify-gemini-audio-transcript.mjs
          node scripts/test-arabic-transcript-match.mjs
          node scripts/test-gemini-audio-transcript-contract.mjs
          node scripts/check-speech-scripts.mjs

      - name: Require encrypted Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY repository secret is unavailable."
            exit 2
          fi

      - name: Transcribe exact pilot twice through curl and require zero errors
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BAREEQ_ASR_MIN_INTERVAL_MS: "2000"
          BAREEQ_GEMINI_CURL_MAX_SECONDS: "480"
        run: node --import ./scripts/gemini-curl-fetch-shim.mjs scripts/verify-gemini-audio-transcript.mjs --pilot

      - name: Record the user's listening approval after automated verification
        env:
          BAREEQ_GEMINI_LISTENING_REVIEW: I_LISTENED_TO_THE_EXACT_CLIP_AND_APPROVE_FULL_SYNTHESIS
        run: node scripts/approve-gemini-test-clip.mjs --article=how-touchscreens-work --reviewed-by='عبدالعزيز'

      - name: Recheck the synthesis gate
        run: node scripts/check-speech-scripts.mjs

      - name: Preserve transcript report for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-pilot-curl-report-${{ github.run_id }}
          path: scripts/speech-transcript-evidence/how-touchscreens-work-gemini-pilot-v1.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit approved Gemini pilot evidence
        run: |
          git config user.name 'bareeq-audio-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/speech-test-clips/how-touchscreens-work.json scripts/speech-test-evidence/how-touchscreens-work-gemini-pilot-v1.json scripts/speech-transcript-evidence/how-touchscreens-work-gemini-pilot-v1.json
          git diff --cached --quiet && { echo 'Gemini pilot approval is already current.'; exit 0; }
          git commit -m 'audio: approve Gemini pilot via curl transcript verification'
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
