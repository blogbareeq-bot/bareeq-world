name: Verify native Fahed pilot with Gemini 3.6

on:
  push:
    branches: [audio/fahed-v4220]
    paths: [.github/workflows/verify-fahed-native-pilot-36.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/fahed-v4220
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Generate native reviewed Fahed pilot
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
        run: node scripts/generate-fahed-test-clip.mjs --article=how-touchscreens-work
      - name: Verify exact native Fahed transcript with Gemini 3.6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';import {compareArabicTranscripts} from './scripts/arabic-transcript-match.mjs';
          const audio=await readFile('scripts/speech-test-evidence/how-touchscreens-work-fahed-v1.mp3');const meta=JSON.parse(await readFile('scripts/speech-test-evidence/how-touchscreens-work-fahed-v1.json','utf8'));const script=JSON.parse(await readFile('scripts/speech-scripts/how-touchscreens-work.json','utf8'));const map=new Map(script.segments.map(x=>[x.segmentId,x]));const expected=meta.selectedSegmentIds.map(id=>map.get(id)?.spokenText||'').join('\n\n');const prompt='Produce a strictly verbatim Arabic transcript from the attached audio only. Write every audible lexical word exactly once and in order. Never add conjunctions or repair grammar. Diacritics and punctuation are optional. Return transcript only.';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));let r,body='';for(let a=0;a<8;a++){r=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{method:'POST',headers:{'x-goog-api-key':process.env.GEMINI_API_KEY,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({model:'gemini-3.6-flash',input:[{type:'text',text:prompt},{type:'audio',data:audio.toString('base64'),mime_type:'audio/mp3'}],response_format:{type:'text',mime_type:'application/json',schema:{type:'object',properties:{transcript:{type:'string'}},required:['transcript']}},store:false})});body=await r.text();if(r.ok)break;if(r.status!==429)throw new Error(`ASR36 ${r.status}: ${body.slice(0,900)}`);const sec=Number(body.match(/retry in ([0-9.]+)s/i)?.[1]||45);console.log(`ASR36_WAIT=${Math.ceil(sec)+2}s`);await sleep((Math.ceil(sec)+2)*1000);}if(!r?.ok)throw new Error(`ASR36 retries exhausted: ${body.slice(0,900)}`);const p=JSON.parse(body);const text=typeof p.output_text==='string'?p.output_text:(p.steps||p.outputs||[]).flatMap(x=>x.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');const transcript=JSON.parse(text.trim()).transcript.trim();const c=compareArabicTranscripts(expected,transcript);console.log(`FAHED_NATIVE_36 expected=${c.expectedWordCount} actual=${c.actualWordCount} errors=${c.wordErrorCount}`);console.log('FAHED_NATIVE_36_DIFF='+JSON.stringify(c.operations));console.log('FAHED_NATIVE_36_TRANSCRIPT='+transcript);if(!c.exact)throw new Error('Native Fahed pilot is not exact');console.log('FAHED_NATIVE_36_EXACT=PASS');
          NODE
