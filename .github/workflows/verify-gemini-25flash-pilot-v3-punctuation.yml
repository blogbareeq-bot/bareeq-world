name: Verify Gemini 2.5 Flash pilot v3 with punctuation-only disambiguation

on:
  push:
    branches: [audio/fahed-v4220]
    paths: [.github/workflows/verify-gemini-25flash-pilot-v3-punctuation.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Lock original lexical contract
        run: |
          node scripts/test-arabic-transcript-match.mjs
          node scripts/check-speech-scripts.mjs
          node scripts/verify-cross-model-pilot-evidence.mjs
      - name: Generate v3 with punctuation-only grammatical disambiguation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY"
          cp scripts/generate-gemini-pronunciation-sample.mjs scripts/.generate-25flash-v3.mjs
          node - <<'NODE'
          const fs=require('node:fs');const p='scripts/.generate-25flash-v3.mjs';let s=fs.readFileSync(p,'utf8');
          const once=(a,b,l)=>{const n=s.split(a).length-1;if(n!==1)throw new Error(`${l}: ${n}`);s=s.replace(a,b)};
          once("const MODEL = 'gemini-3.1-flash-tts-preview';","const MODEL = 'gemini-2.5-flash-preview-tts';",'model');
          once("? `${ARTICLE_ID}-gemini-pilot-v1`","? `${ARTICLE_ID}-gemini-25flash-pilot-v3`",'basename');
          once('const MAX_RETRIES = 5;','const MAX_RETRIES = 1;','retry');
          once("const transcript = selectedSegments.map((item) => item.spokenText).join('\\n\\n');", "const originalTranscript = selectedSegments.map((item) => item.spokenText).join('\\n\\n');\nconst transcript = originalTranscript.replace('مَا نُسَمِّيهِ عَادَةً «الشَّاشَة» لَيْسَ طَبَقَةً وَاحِدَة.', 'مَا نُسَمِّيهِ عَادَةً، «الشَّاشَة»، لَيْسَ طَبَقَةً وَاحِدَة.');\nif (transcript === originalTranscript) throw new Error('Punctuation-only disambiguation target was not found.');", 'punctuation-only transcript');
          fs.writeFileSync(p,s);
          NODE
          node --check scripts/.generate-25flash-v3.mjs
          node scripts/.generate-25flash-v3.mjs --pilot
          rm -f scripts/.generate-25flash-v3.mjs
      - name: Prove punctuation changed no lexical token
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';import {compareArabicTranscripts} from './scripts/arabic-transcript-match.mjs';
          const meta=JSON.parse(await readFile('scripts/speech-test-evidence/how-touchscreens-work-gemini-25flash-pilot-v3.json','utf8'));const script=JSON.parse(await readFile('scripts/speech-scripts/how-touchscreens-work.json','utf8'));const map=new Map(script.segments.map(x=>[x.segmentId,x]));const original=meta.selectedSegmentIds.map(id=>map.get(id).spokenText).join('\n\n');const punctuated=original.replace('مَا نُسَمِّيهِ عَادَةً «الشَّاشَة» لَيْسَ طَبَقَةً وَاحِدَة.','مَا نُسَمِّيهِ عَادَةً، «الشَّاشَة»، لَيْسَ طَبَقَةً وَاحِدَة.');const c=compareArabicTranscripts(original,punctuated);if(!c.exact||c.expectedWordCount!==160)throw new Error('Punctuation patch changed lexical content');console.log('PUNCTUATION_ONLY_LEXICAL_EQUIVALENCE=PASS 160/160');
          NODE
      - name: Require two independent exact ASR passes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';import {readFile,writeFile} from 'node:fs/promises';import {compareArabicTranscripts,ARABIC_TRANSCRIPT_COMPARISON_PROFILE} from './scripts/arabic-transcript-match.mjs';const sha=v=>createHash('sha256').update(v).digest('hex');
          const base='how-touchscreens-work-gemini-25flash-pilot-v3';const meta=JSON.parse(await readFile(`scripts/speech-test-evidence/${base}.json`,'utf8'));const audio=await readFile(`scripts/speech-test-evidence/${base}.mp3`);const script=JSON.parse(await readFile('scripts/speech-scripts/how-touchscreens-work.json','utf8'));if(meta.model!=='gemini-2.5-flash-preview-tts'||meta.sha256!==sha(audio))throw new Error('v3 identity mismatch');const map=new Map(script.segments.map(x=>[x.segmentId,x]));const expected=meta.selectedSegmentIds.map(id=>map.get(id).spokenText).join('\n\n');const generatedExpected=expected.replace('مَا نُسَمِّيهِ عَادَةً «الشَّاشَة» لَيْسَ طَبَقَةً وَاحِدَة.','مَا نُسَمِّيهِ عَادَةً، «الشَّاشَة»، لَيْسَ طَبَقَةً وَاحِدَة.');if(sha(generatedExpected)!==meta.transcriptHash)throw new Error('v3 metadata transcript hash mismatch');if(!compareArabicTranscripts(expected,generatedExpected).exact)throw new Error('v3 generated transcript is not lexically identical to source script');
          const prompts=['استمع إلى التسجيل المرفق وحوّل الكلام المسموع إلى نص عربي حرفي كامل. اكتب كل كلمة تسمعها مرة واحدة وبالترتيب نفسه، ولا تصحح المتحدث أو تضف شيئًا. التسجيل وحده هو المصدر. لا حاجة إلى التشكيل أو الترقيم. أعد transcript فقط وفق JSON.','Produce a verbatim Arabic transcript of this audio using the recording as the only source. Include every audible word once and in order. Do not infer, repair, paraphrase, summarize, or add commentary. Diacritics and punctuation are optional. Return only transcript in the JSON schema.'];const extract=p=>{if(typeof p?.output_text==='string')return p.output_text;if(typeof p?.outputText==='string')return p.outputText;const o=[];for(const c of [p?.steps,p?.outputs].filter(Array.isArray))for(const i of c)for(const b of (Array.isArray(i?.content)?i.content:[]))if(b?.type==='text'&&typeof b.text==='string')o.push(b.text);return o.join('')};const passes=[];
          for(let i=0;i<2;i++){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{method:'POST',headers:{'x-goog-api-key':process.env.GEMINI_API_KEY,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({model:'gemini-3.5-flash',input:[{type:'text',text:prompts[i]},{type:'audio',data:audio.toString('base64'),mime_type:'audio/mp3'}],response_format:{type:'text',mime_type:'application/json',schema:{type:'object',properties:{transcript:{type:'string'}},required:['transcript']}},store:false})});const body=await r.text();if(!r.ok)throw new Error(`ASR pass ${i+1} HTTP ${r.status}: ${body.slice(0,700)}`);const tr=JSON.parse(extract(JSON.parse(body)).trim()).transcript?.trim();const c=compareArabicTranscripts(expected,tr);console.log(`3.5 pass ${i+1}: expected=${c.expectedWordCount} actual=${c.actualWordCount} errors=${c.wordErrorCount} ${JSON.stringify(c.operations.slice(0,5))}`);passes.push({pass:i+1,model:'gemini-3.5-flash',promptSha256:sha(prompts[i]),transcript:tr,transcriptSha256:sha(tr),normalizedTranscript:c.actualNormalized,exact:c.exact,expectedWordCount:c.expectedWordCount,actualWordCount:c.actualWordCount,wordErrorCount:c.wordErrorCount,substitutions:c.substitutions,deletions:c.deletions,insertions:c.insertions,differences:c.operations.slice(0,50)});}
          const passed=passes.length===2&&passes.every(p=>p.exact&&p.expectedWordCount===160&&p.wordErrorCount===0&&p.substitutions===0&&p.deletions===0&&p.insertions===0);const report={schema:'bareeq.two-pass-tts-pilot-verification.v1',status:passed?'passed':'failed',articleId:'how-touchscreens-work',ttsProvider:'Google Gemini API',ttsModel:'gemini-2.5-flash-preview-tts',ttsVoice:'Sadaltager',audioFile:`scripts/speech-test-evidence/${base}.mp3`,audioSha256:sha(audio),audioBytes:audio.length,expectedTranscriptSha256:sha(expected),expectedWordCount:160,independentPasses:2,transcriptionModel:'gemini-3.5-flash',wordErrorCountAcrossAllPasses:passes.reduce((s,p)=>s+p.wordErrorCount,0),substitutions:passes.reduce((s,p)=>s+p.substitutions,0),deletions:passes.reduce((s,p)=>s+p.deletions,0),insertions:passes.reduce((s,p)=>s+p.insertions,0),expectedTextDisclosure:'ASR received audio and generic instructions only; expected text was used only after each response for exact comparison.',comparisonProfile:ARABIC_TRANSCRIPT_COMPARISON_PROFILE,passes,verifiedAt:new Date().toISOString()};await writeFile('scripts/speech-transcript-evidence/how-touchscreens-work-gemini-25flash-pilot-v3-two-pass.json',JSON.stringify(report,null,2)+'\n');if(!passed)throw new Error('v3 rejected: both independent ASR passes were not exact');console.log('GEMINI_25FLASH_V3_TWO_PASS_ZERO_ERROR=PASS');
          NODE
      - name: Upload v3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-25flash-v3-${{ github.run_id }}
          path: |
            scripts/speech-test-evidence/how-touchscreens-work-gemini-25flash-pilot-v3.mp3
            scripts/speech-test-evidence/how-touchscreens-work-gemini-25flash-pilot-v3.json
            scripts/speech-transcript-evidence/how-touchscreens-work-gemini-25flash-pilot-v3-two-pass.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit only zero-error v3 evidence
        if: success()
        run: |
          git config user.name 'bareeq-audio-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f scripts/speech-test-evidence/how-touchscreens-work-gemini-25flash-pilot-v3.mp3
          git add scripts/speech-test-evidence/how-touchscreens-work-gemini-25flash-pilot-v3.json scripts/speech-transcript-evidence/how-touchscreens-work-gemini-25flash-pilot-v3-two-pass.json
          git commit -m 'audio: approve Gemini 2.5 Flash pilot v3 at zero errors'
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
