name: Bareeq OpenRouter progressive fallback

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/audio-openrouter-progressive-fallback.yml'
      - 'scripts/audio-progressive-openrouter-fallback.mjs'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: bareeq-openrouter-progressive-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  repair-one-part:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BAREEQ_AUDIO_CAMPAIGN_ID: sadaltager-openrouter-20260901-v1
      BAREEQ_STATUS_FILE: docs/audio/PROGRESSIVE-STATUS.json
      BAREEQ_PARTIAL_MARKER: docs/audio/PUBLISHED-SADALTAGER-PARTIAL-20260903.json
      BAREEQ_FINAL_MARKER: docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json
      BAREEQ_OPENROUTER_MAX_PARTS: '1'

    steps:
      - name: Resolve branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.event.pull_request.head.ref }}"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi
          echo "BRANCH=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "BRANCH=${BRANCH}"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.BRANCH }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate fallback code
        run: |
          node --check scripts/audio-progressive-openrouter-fallback.mjs
          node --check scripts/audio-progressive-publish-router.mjs

      - name: Verify OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "${OPENROUTER_API_KEY}"
          echo 'OPENROUTER_CREDENTIAL=present'

      - name: Restore newest progressive checkpoint
        id: checkpoint
        uses: actions/cache/restore@v4
        with:
          path: audio-candidates
          key: bareeq-audio-progressive-pr21-openrouter-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bareeq-audio-progressive-pr21-openrouter-
            bareeq-audio-progressive-pr21-
            bareeq-audio-progressive-

      - name: Require preserved checkpoint
        run: |
          MATCHED='${{ steps.checkpoint.outputs.cache-matched-key }}'
          test -n "${MATCHED}"
          echo "BAREEQ_CHECKPOINT_SOURCE=cache:${MATCHED}" >> "$GITHUB_ENV"
          echo "CHECKPOINT_SOURCE=cache:${MATCHED}"

      - name: Repair one remaining part through OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/audio-progressive-openrouter-fallback.mjs

      - name: Publish any newly exact article
        run: node scripts/audio-progressive-publish-router.mjs

      - name: Refresh progressive status
        run: node scripts/audio-progressive-openrouter-fallback.mjs --refresh-status

      - name: Save newest checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: audio-candidates
          key: bareeq-audio-progressive-pr21-openrouter-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload fallback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bareeq-openrouter-fallback-${{ github.run_id }}
          path: |
            audio-candidates/
            docs/audio/PROGRESSIVE-STATUS.json
            docs/audio/PUBLISHED-SADALTAGER-PARTIAL-20260903.json
            docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json
            public/audio/manifest.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Commit newly publishable audio and status
        env:
          PR_BRANCH: ${{ steps.branch.outputs.BRANCH }}
        run: |
          set -euo pipefail
          COUNT=$(node -p "JSON.parse(require('fs').readFileSync(process.env.BAREEQ_STATUS_FILE,'utf8')).publishedCount")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/audio
          git add "${BAREEQ_STATUS_FILE}"
          test ! -f "${BAREEQ_PARTIAL_MARKER}" || git add "${BAREEQ_PARTIAL_MARKER}"
          test ! -f "${BAREEQ_FINAL_MARKER}" || git add "${BAREEQ_FINAL_MARKER}"
          if git diff --cached --quiet; then
            echo "OPENROUTER_FALLBACK_TREE=already-current count=${COUNT}"
          else
            git commit -m "audio: OpenRouter fallback publish ${COUNT}/15 exact"
            git push origin "HEAD:refs/heads/${PR_BRANCH}"
          fi
