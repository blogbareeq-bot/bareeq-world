name: Generate passport article audio

on:
  push:
    branches:
      - arena/01a02d6f-bareeq-world
    paths:
      - .github/workflows/generate-passport-audio.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a02d6f-bareeq-world
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify secret and article state
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY repository secret is unavailable."
            exit 2
          fi
          grep -q '^draft: true$' src/content/posts/why-some-passports-are-stronger.md
          grep -q 'ويحسن هنا التمييز بين هذا التصريح وe-Visa' src/content/posts/why-some-passports-are-stronger.md
          grep -q 'يأتي الجواز السعودي في منتصف الخمسينيات عالميًا' src/content/posts/why-some-passports-are-stronger.md
          echo "Secret is available and final article text is locked."

      - name: Generate only passport article with Gemini Sadaltager
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BAREEQ_TTS_PROVIDER: gemini
          BAREEQ_TTS_INCLUDE_IDS: why-some-passports-are-stronger
          BAREEQ_TTS_MAX_MISSING_ARTICLES_PER_BUILD: "1"
        run: |
          sed -i '0,/^draft: true$/s//draft: false/' src/content/posts/why-some-passports-are-stronger.md
          node scripts/generate-audio.mjs

      - name: Validate generated audio
        run: |
          test -f public/audio/articles/34e34b6f4633d928/manifest.json
          count=$(find public/audio/articles/34e34b6f4633d928 -maxdepth 1 -type f -name '*.mp3' | wc -l | tr -d ' ')
          if [ "$count" -ne 11 ]; then
            echo "::error::Expected 11 MP3 files, found $count."
            exit 1
          fi
          node --input-type=module -e "import fs from 'node:fs'; const p='public/audio/articles/34e34b6f4633d928/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); if(m.articleId!=='why-some-passports-are-stronger') throw new Error('articleId mismatch'); if(m.provider!=='Google Gemini API') throw new Error('provider mismatch: '+m.provider); if(m.model!=='gemini-3.1-flash-tts-preview') throw new Error('model mismatch: '+m.model); if(m.defaultVoice!=='sadaltager') throw new Error('voice mismatch: '+m.defaultVoice); if(!Array.isArray(m.parts)||m.parts.length!==11) throw new Error('parts mismatch'); console.log('Manifest validated: 11 parts, Gemini, Sadaltager.');"

      - name: Restore article locally and commit audio only
        run: |
          git checkout -- src/content/posts/why-some-passports-are-stronger.md
          grep -q '^draft: true$' src/content/posts/why-some-passports-are-stronger.md
          git config user.name 'bareeq-audio-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/audio/articles/34e34b6f4633d928/
          if git diff --cached --quiet; then
            echo "::error::No generated audio files were produced."
            exit 1
          fi
          git commit -m 'feat: add Sadaltager audio for passport article'
          git push origin HEAD:arena/01a02d6f-bareeq-world
