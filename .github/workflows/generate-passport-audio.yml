name: Generate passport article audio

on:
  push:
    branches:
      - arena/01a02d6f-bareeq-world
    paths:
      - .github/workflows/generate-passport-audio.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a02d6f-bareeq-world
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify final editorial lock and refresh bodyHash docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          article = Path('src/content/posts/why-some-passports-are-stronger.md')
          text = article.read_text(encoding='utf-8')

          old_evisa = 'ويحسن هنا التمييز بين هذا التصريح والتأشيرة الإلكترونية e-Visa؛ فالأخيرة تأشيرة إلكترونية تتطلب موافقة حكومية قبل المغادرة، ولهذا تعدها'
          new_evisa = 'ويحسن هنا التمييز بين هذا التصريح وe-Visa؛ فالأخيرة تتطلب موافقة حكومية قبل المغادرة، ولهذا تعدها'
          old_saudi = 'وماذا عن الجواز السعودي؟ يحتل المرتبة الرابعة والخمسين عالميًا في أحدث بيانات المؤشر المتاحة عند إعداد هذا المقال في أغسطس 2026، بوصول ميسر إلى نحو تسعين وجهة.'
          new_saudi = 'وماذا عن الجواز السعودي؟ في أحدث بيانات هينلي المتاحة عند إعداد هذا المقال في أغسطس 2026، يأتي الجواز السعودي في منتصف الخمسينيات عالميًا، مع وصول ميسر إلى نحو تسعين وجهة.'

          if old_evisa in text:
              text = text.replace(old_evisa, new_evisa, 1)
          if old_saudi in text:
              text = text.replace(old_saudi, new_saudi, 1)
          if new_evisa not in text or new_saudi not in text:
              raise SystemExit('Final editorial sentences are not in the expected state.')
          article.write_text(text, encoding='utf-8')

          m = re.match(r'^---\s*\n[\s\S]*?\n---\s*\n?([\s\S]*)$', text)
          if not m:
              raise SystemExit('Could not parse article frontmatter/body.')
          body = m.group(1).replace('\r\n', '\n').strip()
          body_hash = hashlib.sha256(body.encode('utf-8')).hexdigest()
          expected = '2b2999dba95bff5e6bfb8ff16d2848fa3b677ffe8f595a5b6166ca15ebf7d4c1'
          if body_hash != expected:
              raise SystemExit(f'Unexpected bodyHash {body_hash}; expected {expected}.')

          checklist = Path('docs/editorial/publish-checklist-why-some-passports-are-stronger.md')
          c = checklist.read_text(encoding='utf-8')
          for previous in [
              'bbcd9107509e3a5a4bf259e4261b520221c5b45f4878deb1a68048f4358f11cb',
              '391e0327e0e3b3aea8a159649910e9d053a67d1610bebeb91fce9bb7bd550790',
          ]:
              c = c.replace(previous, body_hash)
          c = c.replace('السعودية: المرتبة 54 في أحدث البيانات المتاحة عند إعداد المقال، مع صياغة «نحو تسعين وجهة» لتجنب تثبيت رقم متغير بين واجهات هينلي الشهرية.',
                        'السعودية: صيغت النتيجة على أنها «في منتصف الخمسينيات عالميًا» و«نحو تسعين وجهة» لأن واجهات هينلي الحالية لا تعرض المرتبة/العدد باتساق كامل؛ راجع الصفحة الحية قبل النشر الفعلي.')
          checklist.write_text(c, encoding='utf-8')

          patch = Path('docs/editorial/publish-day-why-some-passports-final-fixes.patch')
          p = patch.read_text(encoding='utf-8')
          p = p.replace('bbcd9107509e3a5a4bf259e4261b520221c5b45f4878deb1a68048f4358f11cb', body_hash)
          patch.write_text(p, encoding='utf-8')

          print(f'Final article bodyHash: {body_hash}')
          PY

      - name: Commit final text lock if needed
        shell: bash
        run: |
          git config user.name 'bareeq-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/content/posts/why-some-passports-are-stronger.md \
                  docs/editorial/publish-checklist-why-some-passports-are-stronger.md \
                  docs/editorial/publish-day-why-some-passports-final-fixes.patch
          if ! git diff --cached --quiet; then
            git commit -m 'fix: finalize passport article before audio'
            git push origin HEAD:arena/01a02d6f-bareeq-world
          fi

      - name: Generate targeted Sadaltager audio
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_ACCESS_TOKEN: ${{ secrets.GOOGLE_CLOUD_ACCESS_TOKEN }}
          GOOGLE_CLOUD_PROJECT: bareeq-tts
        run: |
          provider=''
          if [ -n "$GEMINI_API_KEY" ]; then
            provider='gemini'
            echo 'Using Google Gemini API Sadaltager.'
          elif [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ -n "$GOOGLE_CLOUD_ACCESS_TOKEN" ]; then
            provider='google-cloud'
            echo 'Using Google Cloud Text-to-Speech Gemini 2.5 Flash + Sadaltager.'
          else
            echo '::error::No Gemini or Google Cloud TTS credential is configured in GitHub secrets.'
            exit 2
          fi

          python - <<'PY'
          from pathlib import Path
          p = Path('src/content/posts/why-some-passports-are-stronger.md')
          s = p.read_text(encoding='utf-8')
          if 'draft: true' not in s:
              raise SystemExit('Expected draft:true before targeted generation.')
          p.write_text(s.replace('draft: true', 'draft: false', 1), encoding='utf-8')
          PY

          set +e
          if [ "$provider" = 'gemini' ]; then
            BAREEQ_TTS_PROVIDER=gemini \
            BAREEQ_TTS_INCLUDE_IDS=why-some-passports-are-stronger \
            BAREEQ_TTS_MAX_MISSING_ARTICLES_PER_BUILD=1 \
            node scripts/generate-audio.mjs
            status=$?
          else
            BAREEQ_TTS_PROVIDER=google-cloud \
            BAREEQ_CLOUD_TTS_ACTIVATE=1 \
            BAREEQ_TTS_INCLUDE_IDS=why-some-passports-are-stronger \
            BAREEQ_TTS_MAX_MISSING_ARTICLES_PER_BUILD=1 \
            node scripts/generate-audio.mjs
            status=$?
          fi
          set -e

          python - <<'PY'
          from pathlib import Path
          p = Path('src/content/posts/why-some-passports-are-stronger.md')
          s = p.read_text(encoding='utf-8')
          if 'draft: false' in s:
              p.write_text(s.replace('draft: false', 'draft: true', 1), encoding='utf-8')
          PY

          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Validate generated manifest and MP3 assets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, stat } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import path from 'node:path';
          import { mp3DurationSeconds } from './scripts/mp3-duration.mjs';

          const id = 'why-some-passports-are-stronger';
          const key = '34e34b6f4633d928';
          const root = path.join('public', 'audio', 'articles', key);
          const manifest = JSON.parse(await readFile(path.join(root, 'manifest.json'), 'utf8'));
          if (manifest.articleId !== id) throw new Error('articleId mismatch');
          const geminiOk = manifest.provider === 'Google Gemini API'
            && manifest.model === 'gemini-3.1-flash-tts-preview'
            && manifest.language === 'ar';
          const cloudOk = manifest.provider === 'Google Cloud Text-to-Speech'
            && manifest.model === 'gemini-2.5-flash-tts'
            && manifest.language === 'ar-EG';
          if (!geminiOk && !cloudOk) throw new Error(`Unexpected provider/model/language: ${manifest.provider} / ${manifest.model} / ${manifest.language}`);
          if (manifest.defaultVoice !== 'sadaltager') throw new Error(`Unexpected voice: ${manifest.defaultVoice}`);
          if (!Array.isArray(manifest.parts) || !manifest.parts.length) throw new Error('No audio parts');

          let files = 0;
          const syncIds = new Set();
          for (const part of manifest.parts) {
            if (!Array.isArray(part.sync) || !part.sync.length) throw new Error('Missing sync entries');
            for (const entry of part.sync) {
              if (!entry?.id || syncIds.has(entry.id)) throw new Error(`Invalid or duplicate sync id: ${entry?.id}`);
              syncIds.add(entry.id);
            }
            const asset = part.audio?.sadaltager;
            if (!asset?.src) throw new Error('Missing Sadaltager MP3 asset');
            const local = path.join('public', asset.src.replace(/^\//, ''));
            const info = await stat(local);
            if (!info.isFile() || info.size !== asset.bytes || info.size < 100) throw new Error(`Size mismatch: ${asset.src}`);
            const bytes = await readFile(local);
            if (asset.sha256 && createHash('sha256').update(bytes).digest('hex') !== asset.sha256) throw new Error(`SHA mismatch: ${asset.src}`);
            const duration = mp3DurationSeconds(bytes);
            if (!(asset.durationSeconds > 0) || Math.abs(duration - asset.durationSeconds) > 0.1) throw new Error(`Duration mismatch: ${asset.src}`);
            files += 1;
          }
          console.log(`Validated ${manifest.parts.length} synchronized part(s), ${files} MP3 file(s), provider ${manifest.provider}.`);
          NODE

      - name: Ensure article stayed draft before release gate
        run: |
          grep -q '^draft: true$' src/content/posts/why-some-passports-are-stronger.md

      - name: Commit generated audio only
        shell: bash
        run: |
          git add public/audio/articles/34e34b6f4633d928/
          git diff --cached --quiet && { echo 'No new audio files to commit.'; exit 1; }
          git commit -m 'feat: add Sadaltager audio for passport article'
          git push origin HEAD:arena/01a02d6f-bareeq-world
