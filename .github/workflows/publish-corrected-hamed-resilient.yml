name: Resilient corrected Hamed full QA and publication

on:
  push:
    branches: [audio/fahed-v4220]
    paths: [.github/workflows/publish-corrected-hamed-resilient.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corrected-hamed-resilient-publication
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout audio branch
        uses: actions/checkout@v4
        with:
          ref: audio/fahed-v4220
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Require immutable zero-error pilot evidence
        run: |
          node scripts/test-arabic-transcript-match.mjs
          node - <<'NODE'
          const fs=require('fs');
          const p='scripts/speech-transcript-evidence/how-touchscreens-work-hamed-corrected-gemini36-independent-final.json';
          const r=JSON.parse(fs.readFileSync(p));
          if(r.status!=='passed'||r.audioSha256!=='78ed2a90885a629903426727c1aa22fd70770f073b638cdec9e8b01cd97cbe71'||r.expectedWordCount!==160||r.actualWordCount!==160||r.wordErrorCount!==0||r.substitutions!==0||r.deletions!==0||r.insertions!==0) throw new Error('Exact corrected Hamed pilot evidence missing');
          console.log('CORRECTED_HAMED_PILOT_ZERO_ERROR=PASS');
          NODE

      - name: Open synthesis gate only inside this runner
        run: |
          cp scripts/speech-test-clips/how-touchscreens-work.json /tmp/how-touchscreens-plan.json
          node - <<'NODE'
          const fs=require('fs'),p='scripts/speech-test-clips/how-touchscreens-work.json',x=JSON.parse(fs.readFileSync(p));
          x.testClipPassed=true;x.fullSynthesisAllowed=true;
          x.audioReview={status:'passed',reviewedBy:'Automated exact Gemini 3.6 ASR on immutable corrected Hamed pilot — user-authorized conditional publication',reviewedAt:new Date().toISOString(),evidence:{file:'scripts/speech-test-evidence/how-touchscreens-work-hamed-corrected-final-pilot-v1.mp3',sha256:'78ed2a90885a629903426727c1aa22fd70770f073b638cdec9e8b01cd97cbe71',provider:'Microsoft Azure AI Speech',model:'Neural TTS',voice:'ar-SA-HamedNeural',automatedTranscriptReport:'scripts/speech-transcript-evidence/how-touchscreens-work-hamed-corrected-gemini36-independent-final.json',transcriptionModel:'gemini-3.6-flash',wordErrorCount:0,substitutions:0,deletions:0,insertions:0,humanListening:false,approvalBasis:'User explicitly instructed continuation through publication after exact automated transcript validation.'}};
          fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n');
          NODE
          node scripts/check-speech-scripts.mjs

      - name: Prepare corrected Hamed-only generator
        run: |
          cp scripts/generate-audio.mjs scripts/.generate-hamed-resilient-full.mjs
          node - <<'NODE'
          const fs=require('fs'),p='scripts/.generate-hamed-resilient-full.mjs';let s=fs.readFileSync(p,'utf8');
          const old='const pieces = splitByBytes(segment.spokenText);';
          if((s.split(old).length-1)!==1) throw new Error('splitByBytes marker mismatch');
          const repl=`let correctedHamedText = segment.spokenText;\n    const hamedFixes = [\n      ['بِبَسَاطَة:', 'بِبَسَاطَةٍ:'],\n      ['أَقْطَابِ الشَّبَكَة.', 'أَقْطَابِ الشَّبَكَةِ.'],\n      ['عَلَى الشَّاشَة.', 'عَلَى الشَّاشَةِ.'],\n      ['عَادَةً «الشَّاشَة» لَيْسَ طَبَقَةً وَاحِدَة.', 'عَادَةً «الشَّاشَةَ» لَيْسَ طَبَقَةً وَاحِدَةً.'],\n      ['عَلَى الشَّاشَة،', 'عَلَى الشَّاشَةِ،'],\n      ['مِنَ الشَّبَكَة.', 'مِنَ الشَّبَكَةِ.'],\n      ['تَكْبِيرَ الصُّورَة،', 'تَكْبِيرَ الصُّورَةِ،'],\n      ['تَحْرِيكَ خَرِيطَة.', 'تَحْرِيكَ خَرِيطَةٍ.']\n    ];\n    for (const [from,to] of hamedFixes) correctedHamedText = correctedHamedText.split(from).join(to);\n    const pieces = splitByBytes(correctedHamedText);`;
          s=s.replace(old,repl);fs.writeFileSync(p,s);
          NODE
          node --check scripts/.generate-hamed-resilient-full.mjs

      - name: Prove one-article Hamed synthesis plan
        env:
          BAREEQ_TTS_PROVIDER: azure
          BAREEQ_TTS_INCLUDE_IDS: how-touchscreens-work
          BAREEQ_AZURE_HAMED_ONLY: '1'
        run: node scripts/.generate-hamed-resilient-full.mjs --plan

      - name: Generate complete corrected Hamed article
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
          BAREEQ_TTS_PROVIDER: azure
          BAREEQ_TTS_INCLUDE_IDS: how-touchscreens-work
          BAREEQ_AZURE_HAMED_ONLY: '1'
          BAREEQ_TTS_MAX_MISSING_ARTICLES_PER_BUILD: '1'
          BAREEQ_TTS_MAX_RETRIES: '4'
          AZURE_SPEECH_MIN_INTERVAL_MS: '1500'
        run: node scripts/.generate-hamed-resilient-full.mjs

      - name: Restore permanent gate state and remove temporary generator
        if: always()
        run: |
          test ! -f /tmp/how-touchscreens-plan.json || cp /tmp/how-touchscreens-plan.json scripts/speech-test-clips/how-touchscreens-work.json
          rm -f scripts/.generate-hamed-resilient-full.mjs

      - name: Verify every audio part twice with resilient Gemini 3.6 ASR
        id: qa
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {spawn} from 'node:child_process';
          import {mkdir,readFile,writeFile,rm} from 'node:fs/promises';
          import path from 'node:path';
          import ffmpegInstaller from '@ffmpeg-installer/ffmpeg';
          import {compareArabicTranscripts,ARABIC_TRANSCRIPT_COMPARISON_PROFILE} from './scripts/arabic-transcript-match.mjs';
          import {mp3DurationSeconds} from './scripts/mp3-duration.mjs';
          const A='how-touchscreens-work',K='de93f3d9f91c8b8b';
          const manifestFile=`public/audio/articles/${K}/manifest.json`;
          const scriptFile=`scripts/speech-scripts/${A}.json`;
          const fullAudioFile=`scripts/speech-test-evidence/${A}-hamed-corrected-full-v2.mp3`;
          const reportFile=`scripts/speech-transcript-evidence/${A}-hamed-corrected-full-v2.json`;
          const sha=v=>createHash('sha256').update(v).digest('hex');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const manifest=JSON.parse(await readFile(manifestFile,'utf8'));
          const script=JSON.parse(await readFile(scriptFile,'utf8'));
          if(manifest.provider!=='Microsoft Azure AI Speech'||manifest.model!=='Neural TTS'||manifest.defaultVoice!=='hamed'||manifest.voices?.[0]?.providerVoice!=='ar-SA-HamedNeural') throw new Error('Full corrected Hamed identity mismatch');
          const parts=[];let totalDuration=0;
          for(const [i,p] of manifest.parts.entries()){
            const a=p.audio?.hamed;
            if(!a?.src||!(a.bytes>100)||!(a.durationSeconds>0)||!/^[a-f0-9]{64}$/i.test(a.sha256||'')) throw new Error(`Bad Hamed part ${i+1}`);
            const file=path.join('public',a.src.replace(/^\//,''));
            const bytes=await readFile(file);const duration=mp3DurationSeconds(bytes);
            if(bytes.length!==a.bytes||sha(bytes)!==a.sha256||Math.abs(duration-a.durationSeconds)>.15) throw new Error(`Hamed part integrity mismatch ${i+1}`);
            parts.push({part:i+1,file,bytes,a});totalDuration+=duration;
          }
          if(parts.length!==5||!(totalDuration>300)) throw new Error(`Unexpected full Hamed shape parts=${parts.length} duration=${totalDuration}`);
          await mkdir(path.dirname(fullAudioFile),{recursive:true});
          const list='/tmp/hamed-resilient-concat.txt';
          const esc=v=>path.resolve(v).replace(/'/g,"'\\''");
          await writeFile(list,parts.map(x=>`file '${esc(x.file)}'`).join('\n')+'\n');
          await rm(fullAudioFile,{force:true});
          await new Promise((res,rej)=>{const c=spawn(ffmpegInstaller.path,['-hide_banner','-loglevel','error','-f','concat','-safe','0','-i',list,'-map_metadata','-1','-c','copy','-y',fullAudioFile],{stdio:['ignore','ignore','pipe']});const e=[];c.stderr.on('data',x=>e.push(x));c.once('error',rej);c.once('close',code=>code===0?res():rej(new Error(Buffer.concat(e).toString('utf8'))));});
          const fullAudio=await readFile(fullAudioFile);const fullDuration=mp3DurationSeconds(fullAudio);
          const expected=script.segments.map(x=>x.spokenText).join(' ');
          const prompts=[
            'استمع إلى هذا الجزء الصوتي فقط واكتب تفريغًا عربيًا حرفيًا لكل الكلمات المسموعة بالترتيب نفسه. لا تصحح القواعد، لا تستبدل المرادفات، لا تضف حروف عطف أو كلمات، ولا تعتمد على نص خارجي. أعد transcript فقط وفق JSON المطلوب.',
            'Produce a strictly verbatim Arabic transcript from this audio part only. Preserve each audible lexical word exactly once and in order. Do not infer grammar, repair wording, replace synonyms, add particles, omit words, or use external text. Return transcript only in the requested JSON schema.'
          ];
          function extract(p){if(typeof p?.output_text==='string')return p.output_text;if(typeof p?.outputText==='string')return p.outputText;const out=[];for(const c of[p?.steps,p?.outputs].filter(Array.isArray))for(const item of c)for(const b of(Array.isArray(item?.content)?item.content:[]))if(b?.type==='text'&&typeof b.text==='string')out.push(b.text);return out.join('');}
          async function transcribe(prompt,bytes,label){let last='';for(let attempt=1;attempt<=12;attempt++){
            const r=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{method:'POST',headers:{'x-goog-api-key':process.env.GEMINI_API_KEY,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({model:'gemini-3.6-flash',input:[{type:'text',text:prompt},{type:'audio',data:bytes.toString('base64'),mime_type:'audio/mp3'}],response_format:{type:'text',mime_type:'application/json',schema:{type:'object',properties:{transcript:{type:'string'}},required:['transcript']}},store:false})});
            last=await r.text();
            if(r.ok){const payload=JSON.parse(last);const raw=extract(payload).trim();const t=JSON.parse(raw).transcript?.trim();if(!t)throw new Error(`${label}: empty transcript`);return t;}
            const retryable=[429,500,502,503,504].includes(r.status);
            if(!retryable) throw new Error(`${label}: ASR ${r.status}: ${last.slice(0,900)}`);
            const hinted=Number(last.match(/retry in ([0-9.]+)s/i)?.[1]||0);
            const waitSec=hinted>0?Math.ceil(hinted)+3:Math.min(80,20+attempt*5);
            console.log(`${label}: retryable ASR ${r.status}; wait ${waitSec}s attempt ${attempt}/12`);
            await sleep(waitSec*1000);
          }throw new Error(`${label}: resilient ASR retries exhausted: ${last.slice(0,500)}`);}
          const passes=[];
          let technicalError=null;
          try{
            for(let pi=0;pi<2;pi++){
              const chunks=[];
              for(const part of parts){
                const transcript=await transcribe(prompts[pi],part.bytes,`PASS_${pi+1}_PART_${part.part}`);
                chunks.push({part:part.part,audioSha256:part.a.sha256,transcript,transcriptSha256:sha(transcript)});
                console.log(`PASS_${pi+1}_PART_${part.part}=DONE`);
                await sleep(12000);
              }
              const transcript=chunks.map(x=>x.transcript).join(' ');
              const c=compareArabicTranscripts(expected,transcript);
              console.log(`HAMED_FULL_PASS_${pi+1} expected=${c.expectedWordCount} actual=${c.actualWordCount} errors=${c.wordErrorCount}`);
              console.log(`HAMED_FULL_DIFF_${pi+1}=${JSON.stringify(c.operations)}`);
              passes.push({pass:pi+1,provider:'Google Gemini API',model:'gemini-3.6-flash',promptSha256:sha(prompts[pi]),transcript,transcriptSha256:sha(transcript),exact:c.exact,expectedWordCount:c.expectedWordCount,actualWordCount:c.actualWordCount,wordErrorCount:c.wordErrorCount,substitutions:c.substitutions,deletions:c.deletions,insertions:c.insertions,differences:c.operations,chunks});
              if(!c.exact) break;
              await sleep(15000);
            }
          }catch(error){technicalError=String(error?.stack||error);console.error(technicalError);}
          const passed=!technicalError&&passes.length===2&&passes.every(p=>p.exact&&p.wordErrorCount===0&&p.substitutions===0&&p.deletions===0&&p.insertions===0);
          const report={schema:'bareeq.hamed-corrected-whole-article-two-pass-v2',status:passed?'passed':technicalError?'technical-failure':'failed',articleId:A,ttsProvider:'Microsoft Azure AI Speech',ttsModel:'Neural TTS',ttsVoice:'ar-SA-HamedNeural',verificationMode:'all-five-audio-parts-two-independent-prompts',audioFile:fullAudioFile,audioSha256:sha(fullAudio),audioBytes:fullAudio.length,durationSeconds:Number(fullDuration.toFixed(3)),partCount:parts.length,expectedTranscriptSha256:sha(expected),expectedWordCount:passes[0]?.expectedWordCount??null,independentPassesCompleted:passes.length,transcriptionModel:'gemini-3.6-flash',wordErrorCountAcrossAllPasses:passes.reduce((n,p)=>n+p.wordErrorCount,0),substitutions:passes.reduce((n,p)=>n+p.substitutions,0),deletions:passes.reduce((n,p)=>n+p.deletions,0),insertions:passes.reduce((n,p)=>n+p.insertions,0),technicalError,expectedTextDisclosure:'ASR received only each immutable audio part plus generic transcription instructions; expected text was used only after responses.',comparisonProfile:ARABIC_TRANSCRIPT_COMPARISON_PROFILE,passes,verifiedAt:new Date().toISOString()};
          await writeFile(reportFile,JSON.stringify(report,null,2)+'\n');
          manifest.automatedTranscriptReview={status:passed?'passed':report.status,scope:'complete-article-all-parts',verificationMode:report.verificationMode,reportFile,reportSha256:sha(await readFile(reportFile)),transcriptionProvider:'Google Gemini API',transcriptionModel:'gemini-3.6-flash',transcriptionPasses:passes.length,expectedWordCount:report.expectedWordCount,wordErrorCountAcrossAllPasses:report.wordErrorCountAcrossAllPasses,substitutions:report.substitutions,deletions:report.deletions,insertions:report.insertions,fullAudioSha256:report.audioSha256,reviewedAt:report.verifiedAt};
          manifest.verifiedStaticAudio=passed;
          await writeFile(manifestFile,JSON.stringify(manifest,null,2)+'\n');
          if(!passed) process.exitCode=2;
          else console.log(`HAMED_COMPLETE_ARTICLE_TWO_PASS_ZERO_ERROR=PASS words=${report.expectedWordCount}`);
          NODE

      - name: Persist generated candidate and QA evidence even if ASR fails
        if: always()
        run: |
          git config user.name 'bareeq-audio-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f public/audio/articles/de93f3d9f91c8b8b/
          test ! -f scripts/speech-test-evidence/how-touchscreens-work-hamed-corrected-full-v2.mp3 || git add -f scripts/speech-test-evidence/how-touchscreens-work-hamed-corrected-full-v2.mp3
          test ! -f scripts/speech-transcript-evidence/how-touchscreens-work-hamed-corrected-full-v2.json || git add -f scripts/speech-transcript-evidence/how-touchscreens-work-hamed-corrected-full-v2.json
          if ! git diff --cached --quiet; then
            git commit -m 'audio: persist corrected Hamed full candidate and resilient QA evidence'
            git pull --rebase origin audio/fahed-v4220
            git push origin HEAD:audio/fahed-v4220
          fi

      - name: Enforce exact complete-article two-pass gate
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='scripts/speech-transcript-evidence/how-touchscreens-work-hamed-corrected-full-v2.json';
          if(!fs.existsSync(p)) throw new Error('Full QA report missing');
          const r=JSON.parse(fs.readFileSync(p));
          if(r.status!=='passed'||r.partCount!==5||r.independentPassesCompleted!==2||r.wordErrorCountAcrossAllPasses!==0||r.substitutions!==0||r.deletions!==0||r.insertions!==0) throw new Error(`Full exact gate rejected: ${r.status}`);
          const m=JSON.parse(fs.readFileSync('public/audio/articles/de93f3d9f91c8b8b/manifest.json'));
          if(m.verifiedStaticAudio!==true||m.automatedTranscriptReview?.status!=='passed'||m.automatedTranscriptReview?.transcriptionPasses!==2) throw new Error('Sealed static manifest missing');
          console.log(`HAMED_FULL_EXACT_GATE=PASS words=${r.expectedWordCount} sha=${r.audioSha256}`);
          fs.writeFileSync('/tmp/full-sha.txt',r.audioSha256+'\n');
          NODE

      - name: Stage clean candidate over current main
        run: |
          rm -rf /tmp/bareeq-hamed-release
          mkdir -p /tmp/bareeq-hamed-release
          cp -a public/audio/articles/de93f3d9f91c8b8b /tmp/bareeq-hamed-release/audio
          cp scripts/speech-transcript-evidence/how-touchscreens-work-hamed-corrected-full-v2.json /tmp/bareeq-hamed-release/report.json
          FULL_AUDIO_SHA=$(cat /tmp/full-sha.txt)
          echo "FULL_AUDIO_SHA=$FULL_AUDIO_SHA" >> "$GITHUB_ENV"
          git fetch origin main
          git checkout -B bareeq-publish-main origin/main
          rm -rf public/audio/articles/de93f3d9f91c8b8b
          mkdir -p public/audio/articles scripts/speech-transcript-evidence
          cp -a /tmp/bareeq-hamed-release/audio public/audio/articles/de93f3d9f91c8b8b
          cp /tmp/bareeq-hamed-release/report.json scripts/speech-transcript-evidence/how-touchscreens-work-hamed-corrected-full-v2.json

      - name: Prove production build preserves the exact verified Hamed recording
        env:
          BAREEQ_GEMINI_FREE_ROLLOUT: '0'
          BAREEQ_CLOUD_TTS_ACTIVATE: '0'
        run: |
          npm ci
          npm run build
          node - <<'NODE'
          const fs=require('fs');
          for(const p of ['public/audio/articles/de93f3d9f91c8b8b/manifest.json','dist/audio/articles/de93f3d9f91c8b8b/manifest.json']){
            const m=JSON.parse(fs.readFileSync(p));const q=m.automatedTranscriptReview;
            if(m.provider!=='Microsoft Azure AI Speech'||m.model!=='Neural TTS'||m.defaultVoice!=='hamed'||m.voices?.[0]?.providerVoice!=='ar-SA-HamedNeural') throw new Error(`${p}: Hamed identity changed during production build`);
            if(m.verifiedStaticAudio!==true||q?.status!=='passed'||q?.scope!=='complete-article-all-parts'||q?.transcriptionPasses!==2||q?.wordErrorCountAcrossAllPasses!==0||q?.substitutions!==0||q?.deletions!==0||q?.insertions!==0||q?.fullAudioSha256!==process.env.FULL_AUDIO_SHA) throw new Error(`${p}: exact QA seal was not preserved`);
          }
          console.log('PRODUCTION_BUILD_PRESERVED_EXACT_HAMED=PASS');
          NODE

      - name: Publish only the tested production delta to main
        run: |
          git config user.name 'bareeq-audio-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f public/audio/articles/de93f3d9f91c8b8b/
          git add scripts/speech-transcript-evidence/how-touchscreens-work-hamed-corrected-full-v2.json
          git diff --cached --quiet && { echo '::error::No tested Hamed publication delta'; exit 3; }
          git commit -m 'audio: publish exact verified Hamed touchscreen article'
          git push origin HEAD:main
          echo "PUBLISHED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record publication identity
        run: |
          echo "PUBLISHED_MAIN_SHA=$PUBLISHED_MAIN_SHA"
          echo "FULL_AUDIO_SHA=$FULL_AUDIO_SHA"
