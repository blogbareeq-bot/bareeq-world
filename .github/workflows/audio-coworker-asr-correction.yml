name: Bareeq coworker ASR correction (superseded)

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/audio-coworker-asr-correction.yml'

permissions:
  contents: read

concurrency:
  group: bareeq-coworker-asr-correction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stop-legacy-resynthesis:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Legacy resynthesis recovery is superseded by checkpoint-only audio-final-recovery.yml.'
