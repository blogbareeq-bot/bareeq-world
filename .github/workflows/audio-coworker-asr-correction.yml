name: Bareeq coworker ASR correction

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: bareeq-coworker-asr-correction-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  correct-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BAREEQ_AUDIO_CAMPAIGN_ID: sadaltager-openrouter-20260901-v1
      BAREEQ_AUDIO_PUBLISHED_MARKER: docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect already-published campaign tree
        id: campaign
        run: |
          if [ -f "${BAREEQ_AUDIO_PUBLISHED_MARKER}" ]; then
            echo 'published=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'published=no' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.campaign.outputs.published != 'yes'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: steps.campaign.outputs.published != 'yes'
        run: npm ci

      - name: Offline safety gates
        if: steps.campaign.outputs.published != 'yes'
        run: |
          node scripts/test-audio-lifecycle.mjs
          node scripts/test-audio-production-safety.mjs
          node scripts/test-audio-production-integration.mjs
          node scripts/test-speech-script-quality-gate.mjs
          node scripts/check-speech-scripts.mjs
          node scripts/test-audio-engine-final.mjs
          node scripts/test-audio-transition-normalization.mjs
          node scripts/test-audio-dual-asr-adjudicate.mjs
          node scripts/test-gemini-generate-content-tts.mjs
          node --check scripts/audio-openrouter-targeted-regenerate.mjs

      - name: Verify provider credentials
        if: steps.campaign.outputs.published != 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "${GEMINI_API_KEY}"
          echo 'GEMINI_PROVIDER_CREDENTIALS=present'

      - name: Restore latest Sadaltager checkpoint
        if: steps.campaign.outputs.published != 'yes'
        uses: actions/cache/restore@v4
        with:
          path: audio-candidates
          key: bareeq-audio-openrouter-sadaltager-v1-fd324708b4e4f0da2119e4490945aa9a98700d6e7b71e140c9d84a87716959da-${{ github.run_id }}-${{ github.run_attempt }}-coworker-fix
          restore-keys: |
            bareeq-audio-openrouter-sadaltager-v1-fd324708b4e4f0da2119e4490945aa9a98700d6e7b71e140c9d84a87716959da-

      - name: Bind current failed coworker ASR evidence
        if: steps.campaign.outputs.published != 'yes'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const campaign = process.env.BAREEQ_AUDIO_CAMPAIGN_ID;
          const state = JSON.parse(fs.readFileSync(path.join('audio-candidates','_campaigns',campaign,'state.json'),'utf8'));
          const articles = Object.entries(state.articles || {});
          if (state.generationComplete !== true || articles.length !== 15 || articles.some(([,v]) => v.generation?.status !== 'generated')) {
            throw new Error('checkpoint is not generation-complete 15/15');
          }
          const articleId = 'ai-as-coworker-future-of-human-work';
          const fp = state.articles[articleId].generation.fingerprint;
          const reportPath = path.join('audio-candidates', articleId, fp, 'reports', 'asr-adjudication.json');
          if (!fs.existsSync(reportPath)) throw new Error('missing failed dual-ASR adjudication evidence');
          const report = JSON.parse(fs.readFileSync(reportPath,'utf8'));
          const c = report.consensus || {};
          if (c.substitutions !== 4 || c.deletions !== 1 || c.insertions !== 0 || c.unresolved !== 2) {
            throw new Error(`unexpected coworker ASR state S=${c.substitutions} D=${c.deletions} I=${c.insertions} U=${c.unresolved}`);
          }
          const expected = [
            { type: 'substitution', expected: 'أنثروبك', actual: 'أنثروبيك' },
            { type: 'substitution', expected: 'كلود', actual: 'كلاود' },
            { type: 'deletion', expected: '5', actual: null },
            { type: 'substitution', expected: '172', actual: '5172' },
            { type: 'substitution', expected: 'استخدموا', actual: 'استخدم' },
          ];
          const diffs = report.substantiveDifferences || [];
          for (const wanted of expected) {
            if (!diffs.some((d) => d.type === wanted.type && d.expected === wanted.expected && d.actual === wanted.actual)) {
              throw new Error(`expected confirmed ASR evidence not found: ${wanted.type} ${wanted.expected}->${wanted.actual}`);
            }
          }
          const unresolved = report.unresolved || [];
          if (unresolved.length !== 2 || unresolved.some((item) => item.expected !== 'موزعا')) {
            throw new Error('expected the two remaining unresolved موزعا readings');
          }
          console.log('COWORKER_FAILED_ASR_EVIDENCE=BOUND S=4 D=1 I=0 U=2 generation=15/15');
          NODE

      - name: Regenerate only confirmed pronunciation parts 1 4 5 8
        if: steps.campaign.outputs.published != 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BAREEQ_TARGETED_TTS_TRANSPORT: developer-interactions
          BAREEQ_AUDIO_PRODUCTION_LOCK: '1'
          BAREEQ_FORCE_TTS_PARTS: '1,4,5,8'
          BAREEQ_TTS_CORRECTION_HINTS_JSON: >-
            {"1":"Keep the reviewed Arabic letters exact; pronounce «أَنْثْرُوبِكْ» and «كْلُودْ» exactly without adding letters.","4":"Pronounce «مُوَزَّعًا» fully and clearly as written.","5":"Pronounce the plural verb «اِسْتَخْدَمُوا» fully, including its final واو الجماعة, exactly as written.","8":"Pronounce «مُوَزَّعًا» fully and clearly as written."}
        run: |
          node scripts/audio-openrouter-targeted-regenerate.mjs --article=ai-as-coworker-future-of-human-work
          echo 'TARGETED_REGENERATION=PASS parts=1,4,5,8 model=gemini-3.1-flash-tts-preview voice=Sadaltager transport=developer-interactions'

      - name: Verify generation remains 15/15 without extra TTS calls
        if: steps.campaign.outputs.published != 'yes'
        run: |
          node scripts/audio-openrouter-campaign.mjs --mode=generate
          echo 'GENERATION_REVERIFY=PASS articles=15'

      - name: Validate all candidates with technical QA and independent dual ASR
        if: steps.campaign.outputs.published != 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/audio-openrouter-campaign.mjs --mode=validate

      - name: Require exact publication gates
        if: steps.campaign.outputs.published != 'yes'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const state = JSON.parse(fs.readFileSync(path.join('audio-candidates','_campaigns',process.env.BAREEQ_AUDIO_CAMPAIGN_ID,'state.json'),'utf8'));
          const entries = Object.entries(state.articles || {});
          if (entries.length !== 15) throw new Error('not 15 articles');
          for (const [articleId,item] of entries) {
            const fp = item.generation?.fingerprint;
            if (!/^[a-f0-9]{64}$/.test(fp || '')) throw new Error(`bad fingerprint ${articleId}`);
            const base = path.join('audio-candidates', articleId, fp, 'reports');
            const asr = JSON.parse(fs.readFileSync(path.join(base,'asr-adjudication.json'),'utf8'));
            const tech = JSON.parse(fs.readFileSync(path.join(base,'technical-qa.json'),'utf8'));
            const sync = JSON.parse(fs.readFileSync(path.join(base,'sync.json'),'utf8'));
            if (!asr.passed || asr.consensus?.substitutions !== 0 || asr.consensus?.deletions !== 0 || asr.consensus?.insertions !== 0 || asr.consensus?.unresolved !== 0) throw new Error(`ASR gate failed ${articleId}`);
            if (!tech.passed || !sync.passed) throw new Error(`technical/sync gate failed ${articleId}`);
            if (asr.fingerprint !== fp || tech.fingerprint !== fp || sync.fingerprint !== fp) throw new Error(`fingerprint bind failed ${articleId}`);
            if (!asr.fullSha256 || asr.fullSha256 !== tech.fullSha256 || asr.fullSha256 !== sync.fullSha256) throw new Error(`digest bind failed ${articleId}`);
          }
          console.log('EXACT_PUBLICATION_GATES=PASS articles=15 dualASR=0/0/0/0 technical=PASS sync=PASS binds=PASS');
          NODE

      - name: Publish validated candidates into PR tree
        if: steps.campaign.outputs.published != 'yes'
        run: |
          node scripts/audio-openrouter-campaign.mjs --mode=publish
          test -f "${BAREEQ_AUDIO_PUBLISHED_MARKER}"
          echo 'OPENROUTER_PUBLICATION_TREE=PASS'

      - name: Commit validated audio tree to PR branch
        if: steps.campaign.outputs.published != 'yes'
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'bareeq-audio'
          git config user.email 'audio@bareeq.local'
          git add -f public/audio docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json docs/audio/PUBLICATION-POLICY-20260901.json
          git commit -m 'audio: publish validated Sadaltager corpus'
          git push origin "HEAD:${PR_BRANCH}"
          echo 'PUBLISHED_AUDIO_COMMIT=pushed'

      - name: Save corrected checkpoint
        if: always() && steps.campaign.outputs.published != 'yes'
        uses: actions/cache/save@v4
        with:
          path: audio-candidates
          key: bareeq-audio-openrouter-sadaltager-v1-fd324708b4e4f0da2119e4490945aa9a98700d6e7b71e140c9d84a87716959da-${{ github.run_id }}-${{ github.run_attempt }}-coworker-fixed

      - name: Upload corrected candidates
        if: always() && steps.campaign.outputs.published != 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: bareeq-coworker-asr-corrected-candidates
          path: audio-candidates/
          if-no-files-found: error
          retention-days: 90
