name: Bundle touchscreen Hamed fallback audio

on:
  push:
    branches:
      - audio/how-touchscreens-hamed-bundle
    paths:
      - .github/workflows/bundle-touchscreen-hamed-audio.yml
      - scripts/generate-audio.mjs
      - scripts/generate-edge-hamed-fallback.mjs
      - scripts/mp3-duration.mjs
      - scripts/speech-overrides.json
      - scripts/speech-review.json
      - src/content/posts/how-touchscreens-work.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundle-touchscreen-hamed-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout audio branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked site dependencies and Hamed fallback client
        run: |
          npm ci
          python -m pip install edge-tts==7.2.8

      - name: Export the locked touchscreen speech parts
        env:
          BAREEQ_TTS_PROVIDER: azure
          BAREEQ_AZURE_HAMED_ONLY: '1'
          BAREEQ_TTS_INCLUDE_IDS: how-touchscreens-work
        run: node scripts/generate-audio.mjs --parts-export=.touchscreen-parts.json

      - name: Generate and normalize complete Hamed audio
        run: node scripts/generate-edge-hamed-fallback.mjs .touchscreen-parts.json

      - name: Verify audio, pronunciation lock, and full production build
        env:
          BAREEQ_GEMINI_FREE_ROLLOUT: '0'
          BAREEQ_CLOUD_TTS_ACTIVATE: '0'
        run: |
          node scripts/check-touchscreen-audio.mjs
          node scripts/check-arabic-speech.mjs
          npm run audit:v4216
          npm run build

      - name: Commit the complete verified audio bundle
        run: |
          rm -f .touchscreen-parts.json
          git config user.name 'bareeq-audio-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f public/audio/articles/de93f3d9f91c8b8b/
          git diff --cached --quiet && { echo '::error::No verified touchscreen audio bundle to commit.'; exit 1; }
          git commit -m 'audio: bundle verified Hamed fallback for touchscreen article'
          git push origin HEAD:${{ github.ref_name }}
