name: Bareeq post-reset audio dispatcher

on:
  schedule:
    # Live Gemini 429 evidence on 2026-10-03 placed the Free Tier RPD reset
    # essentially at 00:00 UTC. Start as close to the observed reset as is
    # practical while leaving a one-minute safety margin for the provider.
    - cron: '1 0 * * *'
    # Fast backup in case GitHub delays or drops the first scheduled event.
    # The state gate below prevents duplicate spending once the strategy
    # allowance is exhausted or publication is complete.
    - cron: '11 0 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audio-post-reset-dispatch.yml'

permissions:
  contents: read
  actions: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'POST_RESET_DISPATCHER_YAML=PARSED'

  dispatch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: gate
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const statusFile = 'docs/audio/PROGRESSIVE-STATUS.json';
          const strategyFile = 'docs/audio/ENGINE-STRATEGY-STATE.json';
          const status = fs.existsSync(statusFile) ? JSON.parse(fs.readFileSync(statusFile, 'utf8')) : {};
          const strategy = fs.existsSync(strategyFile) ? JSON.parse(fs.readFileSync(strategyFile, 'utf8')) : {};
          const freezeFile = 'docs/audio/TTS-FREEZE.json';
          const freeze = fs.existsSync(freezeFile) ? JSON.parse(fs.readFileSync(freezeFile, 'utf8')) : { active: false };
          const exact = Number(status.exactCount) || 0;
          const successful = Number(strategy.successfulTtsSinceLastNewExact) || 0;
          const threshold = Number(strategy.threshold) || 0;
          const publicationComplete = status.publicationComplete === true || exact >= 15;
          const recoveryExhausted = threshold > 0 && successful >= threshold;
          const recovery = strategy.targetedRecovery;
          const today = new Date().toISOString().slice(0, 10);
          const recoveryBlocked = recovery && (Number(recovery.runs) >= Number(recovery.maxRuns)
            || recovery.lastAttemptDay === today);
          const preferredId = 'كيف-يعرف-الانترنت-ما-الذي-تبحث-عنه-قبل-ان-تكمل-الكتابه';
          const preferred = Array.isArray(status.rows)
            ? status.rows.find((row) => row.articleId === preferredId)
            : null;
          // At the current 7/15 checkpoint, spend the first post-reset request
          // on the one-error, short-segment candidate instead of the wider
          // fitness paragraph that already regressed in live testing.
          const targetArticle = exact === 7 && preferred && preferred.exact !== true ? preferredId : '';
          const shouldDispatch = freeze.active !== true && !publicationComplete && !recoveryExhausted && !recoveryBlocked;
          process.stdout.write(`should-dispatch=${shouldDispatch}\n`);
          process.stdout.write(`target-article=${targetArticle}\n`);
          console.error(`POST_RESET_GATE freeze=${freeze.active === true} exact=${exact} successful=${successful} threshold=${threshold} complete=${publicationComplete} recoveryExhausted=${recoveryExhausted} target=${targetArticle || 'auto'}`);
          NODE
      - name: Dispatch progressive repair immediately after quota reset
        if: steps.gate.outputs.should-dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ARTICLE: ${{ steps.gate.outputs.target-article }}
        run: |
          jq -n --arg ref main --arg target "${TARGET_ARTICLE}" \
            '{ref:$ref, inputs:{only_article:$target}}' > "$RUNNER_TEMP/audio-dispatch.json"
          gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/audio-partial-publish.yml/dispatches" \
            --input "$RUNNER_TEMP/audio-dispatch.json"
          echo "POST_RESET_AUDIO_DISPATCH=sent target=${TARGET_ARTICLE:-auto}"
      - name: Skip exhausted or completed recovery
        if: steps.gate.outputs.should-dispatch != 'true'
        run: echo 'POST_RESET_AUDIO_DISPATCH=skipped-no-recovery-needed'
