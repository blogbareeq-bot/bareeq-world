name: Bareeq post-reset audio dispatcher

on:
  schedule:
    # Live Gemini 429 evidence on 2026-10-03 reported roughly 20h25m until
    # reset at 03:34 UTC, placing the free-tier RPD reset near 00:00 UTC.
    # Run shortly after midnight UTC instead of the obsolete Pacific-reset
    # assumption used by the older coordinator schedule.
    - cron: '10 0 * * *'
    # Backup shortly after the same reset. It may dispatch again only while
    # the reviewed recovery window still has unused successful TTS calls and
    # no new exact article.
    - cron: '45 0 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audio-post-reset-dispatch.yml'

permissions:
  contents: read
  actions: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'POST_RESET_DISPATCHER_YAML=PARSED'

  dispatch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: gate
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const statusFile = 'docs/audio/PROGRESSIVE-STATUS.json';
          const strategyFile = 'docs/audio/ENGINE-STRATEGY-STATE.json';
          const status = fs.existsSync(statusFile) ? JSON.parse(fs.readFileSync(statusFile, 'utf8')) : {};
          const strategy = fs.existsSync(strategyFile) ? JSON.parse(fs.readFileSync(strategyFile, 'utf8')) : {};
          const recoveryBaselineExact = 7;
          const exact = Number(status.exactCount) || 0;
          const successful = Number(strategy.successfulTtsSinceLastNewExact) || 0;
          const threshold = Number(strategy.threshold) || 0;
          const targetReached = exact > recoveryBaselineExact;
          const recoveryExhausted = threshold > 0 && successful >= threshold;
          const shouldDispatch = !targetReached && !recoveryExhausted;
          process.stdout.write(`should-dispatch=${shouldDispatch}\n`);
          console.error(`POST_RESET_GATE exact=${exact} baseline=${recoveryBaselineExact} successful=${successful} threshold=${threshold} targetReached=${targetReached} recoveryExhausted=${recoveryExhausted}`);
          NODE
      - name: Dispatch progressive repair after quota reset
        if: steps.gate.outputs.should-dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/audio-partial-publish.yml/dispatches" \
            -f ref=main
          echo 'POST_RESET_AUDIO_DISPATCH=sent'
      - name: Skip exhausted or completed recovery
        if: steps.gate.outputs.should-dispatch != 'true'
        run: echo 'POST_RESET_AUDIO_DISPATCH=skipped-no-recovery-needed'
