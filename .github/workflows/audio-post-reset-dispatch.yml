name: Bareeq post-reset audio dispatcher

on:
  schedule:
    # Deliberately after the existing 08:20 UTC primary. This dispatcher is a
    # recovery path for days when an earlier push/manual run wrote status and
    # caused the legacy schedule gate to treat the day as already processed.
    - cron: '25 8 * * *'
    # Off-peak backup; it skips itself when the primary dispatcher already
    # launched a workflow_dispatch run that wrote today's status.
    - cron: '52 10 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audio-post-reset-dispatch.yml'

permissions:
  contents: read
  actions: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'POST_RESET_DISPATCHER_YAML=PARSED'

  dispatch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: gate
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const filename = 'docs/audio/PROGRESSIVE-STATUS.json';
          const status = fs.existsSync(filename) ? JSON.parse(fs.readFileSync(filename, 'utf8')) : {};
          const today = new Date().toISOString().slice(0, 10);
          const generatedToday = typeof status.generatedAt === 'string'
            && status.generatedAt.slice(0, 10) === today;
          const alreadyDispatchedToday = generatedToday && status.sourceEvent === 'workflow_dispatch';
          process.stdout.write(`should-dispatch=${!alreadyDispatchedToday}\n`);
          console.error(`POST_RESET_GATE date=${today} generatedToday=${generatedToday} sourceEvent=${status.sourceEvent || 'unknown'} alreadyDispatchedToday=${alreadyDispatchedToday}`);
          NODE
      - name: Dispatch progressive repair after quota reset
        if: steps.gate.outputs.should-dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/audio-partial-publish.yml/dispatches" \
            -f ref=main
          echo 'POST_RESET_AUDIO_DISPATCH=sent'
      - name: Skip duplicate backup dispatch
        if: steps.gate.outputs.should-dispatch != 'true'
        run: echo 'POST_RESET_AUDIO_DISPATCH=skipped-already-ran'
