name: Bareeq human evidence offline adjudication

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audio-human-evidence-adjudication.mjs'
      - 'scripts/test-audio-human-evidence-adjudication.mjs'
      - 'docs/audio/HUMAN-TRIAGE-FULL-RESULT-20261006.json'
      - 'docs/audio/HUMAN-TRIAGE-FINAL-FORCED-CHOICE-RESULT-20261006.json'
      - '.github/workflows/audio-human-evidence-adjudication.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Prove synthesis freeze and canonical state
        run: |
          set -euo pipefail
          node scripts/audio-tts-freeze-guard.mjs --expect-frozen
          node scripts/audio-state-consistency.mjs
          node scripts/audio-gate4-governance.mjs

      - name: Validate human evidence adjudicator
        run: |
          set -euo pipefail
          node --check scripts/audio-human-evidence-adjudication.mjs
          node scripts/test-audio-human-evidence-adjudication.mjs

      - name: Download immutable campaign evidence
        uses: actions/download-artifact@v4
        with:
          name: bareeq-progressive-validation-37284619084
          path: adjudication-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '37284619084'

      - name: Download blind triage internal mapping
        uses: actions/download-artifact@v4
        with:
          name: bareeq-human-triage-37449866365
          path: triage-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '37449866365'

      - name: Run binding offline adjudication
        run: |
          set -euo pipefail
          node scripts/audio-human-evidence-adjudication.mjs \
            --root=adjudication-input \
            --triage-root=triage-input \
            --out=human-adjudication-output
          cat human-adjudication-output/HUMAN-OFFLINE-ADJUDICATION.md
          echo 'HUMAN_OFFLINE_ADJUDICATION_PROVIDER_CALLS=0'

      - name: Assert zero-provider safety and identity
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const r=JSON.parse(await readFile('human-adjudication-output/HUMAN-OFFLINE-ADJUDICATION.json','utf8'));
          if(r.activePending!==7) throw new Error(`expected 7 active pending, got ${r.activePending}`);
          if(r.ttsCalls!==0 || r.newAsrCalls!==0 || r.providerCalls!==0) throw new Error('provider-call invariant failed');
          for(const row of r.rows){
            if(!row.fingerprint || !row.fullSha256 || row.technicalQaBound!==true) throw new Error(`identity/QA binding missing for ${row.articleId}`);
            if(row.exactAfterHumanEvidence){
              const c=row.finalConsensus;
              if(Number(c.substitutions)||Number(c.deletions)||Number(c.insertions)||Number(c.unresolved)) throw new Error(`non-zero Exact result for ${row.articleId}`);
            }
          }
          console.log(`HUMAN_OFFLINE_CONTRACT=PASS newlyExact=${r.newlyExactWithoutTts} projected=${r.projectedExactTotal}/15 provider=0`);
          NODE

      - name: Prove production audio unchanged
        run: |
          set -euo pipefail
          git diff --exit-code -- public/audio
          echo 'HUMAN_OFFLINE_PRODUCTION_AUDIO=UNCHANGED'

      - uses: actions/upload-artifact@v4
        with:
          name: bareeq-human-offline-adjudication-${{ github.run_id }}
          path: human-adjudication-output/
          if-no-files-found: error
          retention-days: 90
