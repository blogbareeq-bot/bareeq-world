name: Bareeq new-content test clip automated QA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audio-new-content-test-clip-validate.mjs'
      - '.github/workflows/audio-new-content-test-clip-qa.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: bareeq-new-content-test-clip-auto-qa
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Download immutable one-shot test clip artifact
        uses: actions/download-artifact@v4
        with:
          name: bareeq-new-content-test-clip-38118406428
          path: test-clip-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38118406428

      - name: Locate and verify test clip
        shell: bash
        run: |
          AUDIO=$(find test-clip-artifact -name test-clip.mp3 -type f | head -n 1)
          test -n "$AUDIO"
          echo "BAREEQ_TEST_CLIP_AUDIO=$AUDIO" >> "$GITHUB_ENV"
          echo "TEST_CLIP_AUDIO=$AUDIO"

      - name: Run technical QA and dual ASR
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/audio-new-content-test-clip-validate.mjs

      - name: Persist automated QA report
        if: always()
        shell: bash
        run: |
          test -f docs/audio/NEW-CONTENT-TEST-CLIP-AUTO-QA.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audio/NEW-CONTENT-TEST-CLIP-AUTO-QA.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "audio: record new-content test clip automated QA"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bareeq-new-content-test-clip-auto-qa-${{ github.run_id }}
          path: |
            docs/audio/NEW-CONTENT-TEST-CLIP-AUTO-QA.json
            audio-candidates/_test-clip-auto-qa/
          if-no-files-found: warn
          retention-days: 30
