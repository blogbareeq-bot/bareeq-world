name: Generate full Gemini 2.5 Flash article with resumable exact QA

on:
  push:
    branches: [audio/fahed-v4220]
    paths: [.github/workflows/generate-gemini-25flash-full-checkpoint.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemini-25flash-full-how-touchscreens
  cancel-in-progress: false

jobs:
  generate-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Require approved zero-error pilot
        run: |
          node scripts/test-arabic-transcript-match.mjs
          node scripts/verify-gemini-25flash-v3-pilot.mjs

      - name: Prepare resumable Gemini 2.5 Flash runtime
        run: |
          node scripts/prepare-gemini-25flash-full-runtime.mjs
          node --check scripts/generate-audio.mjs
          node scripts/check-speech-scripts.mjs

      - name: Prove generation plan is bounded
        env:
          BAREEQ_TTS_PROVIDER: gemini
          BAREEQ_TTS_INCLUDE_IDS: how-touchscreens-work
          GEMINI_TTS_MAX_REQUEST_BYTES: '5500'
        run: node scripts/generate-audio.mjs --plan

      - name: Require Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY" || { echo '::error::GEMINI_API_KEY unavailable'; exit 2; }

      - name: Generate or resume complete Sadaltager article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BAREEQ_TTS_PROVIDER: gemini
          BAREEQ_TTS_INCLUDE_IDS: how-touchscreens-work
          BAREEQ_TTS_MAX_MISSING_ARTICLES_PER_BUILD: '1'
          BAREEQ_GEMINI_MAX_REQUESTS_PER_BUILD: '20'
          BAREEQ_GEMINI_SYNTHESIS_BUDGET_MS: '1200000'
          BAREEQ_TTS_MAX_RETRIES: '1'
          GEMINI_TTS_MIN_INTERVAL_MS: '9000'
          GEMINI_TTS_MAX_REQUEST_BYTES: '5500'
        run: node scripts/generate-audio.mjs

      - name: Preserve candidate or checkpoint
        run: |
          git checkout -- scripts/generate-audio.mjs
          if node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const m=JSON.parse(await readFile('public/audio/articles/de93f3d9f91c8b8b/manifest.json','utf8'));
          if(m.provider!=='Google Gemini API'||m.model!=='gemini-2.5-flash-preview-tts'||m.defaultVoice!=='sadaltager') process.exit(1);
          if(!Array.isArray(m.parts)||!m.parts.length||!m.parts.every(p=>p.audio?.sadaltager?.src)) process.exit(1);
          console.log(`FULL_SYNTHESIS_COMPLETE parts=${m.parts.length}`);
          NODE
          then
            git config user.name 'bareeq-audio-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add scripts/speech-test-clips/how-touchscreens-work.json public/audio/articles/de93f3d9f91c8b8b/
            if ! git diff --cached --quiet; then
              git commit -m 'audio: stage complete Gemini 2.5 Flash touchscreen candidate'
              git pull --rebase origin ${{ github.ref_name }}
              git push origin HEAD:${{ github.ref_name }}
            fi
          else
            echo '::warning::Full article incomplete; preserving checkpoint only.'
            git checkout -- scripts/speech-test-clips/how-touchscreens-work.json
            git config user.name 'bareeq-audio-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add -f scripts/gemini-checkpoints/ || true
            if ! git diff --cached --quiet; then
              git commit -m 'audio: checkpoint Gemini 2.5 Flash touchscreen synthesis'
              git pull --rebase origin ${{ github.ref_name }}
              git push origin HEAD:${{ github.ref_name }}
            fi
            exit 78
          fi

      - name: Require two exact whole-article transcripts and seal manifest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/verify-and-seal-gemini-25flash-full.mjs

      - name: Build publication candidate
        run: |
          ASTRO_TELEMETRY_DISABLED=1 npx astro build
          node scripts/check-audio-dist.mjs
          node scripts/check-dist.mjs

      - name: Commit zero-error publication candidate
        run: |
          git config user.name 'bareeq-audio-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/audio/articles/de93f3d9f91c8b8b/ scripts/speech-test-clips/how-touchscreens-work.json scripts/speech-test-evidence/how-touchscreens-work-gemini-25flash-full-v1.mp3 scripts/speech-transcript-evidence/how-touchscreens-work-gemini-25flash-full-v1.json
          git commit -m 'audio: approve full Gemini 2.5 Flash touchscreen audio at zero errors'
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload complete QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-25flash-full-zero-error-${{ github.run_id }}
          path: |
            scripts/speech-test-evidence/how-touchscreens-work-gemini-25flash-full-v1.mp3
            scripts/speech-transcript-evidence/how-touchscreens-work-gemini-25flash-full-v1.json
            public/audio/articles/de93f3d9f91c8b8b/manifest.json
          if-no-files-found: ignore
          retention-days: 30
