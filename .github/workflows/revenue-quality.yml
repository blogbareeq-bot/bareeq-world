name: Bareeq Revenue Quality

on:
  pull_request:
    paths:
      - 'src/config/monetization.ts'
      - 'src/components/BareeqRecommendation.astro'
      - 'src/pages/posts/[id].astro'
      - 'src/pages/picks.astro'
      - 'src/pages/products/**'
      - 'src/content/posts/do-you-need-vpn.md'
      - 'public/media/do-you-need-vpn.svg'
      - 'public/scripts/monetization.js'
      - 'scripts/check-revenue.mjs'
      - '.github/workflows/revenue-quality.yml'
      - 'src/pages/sitemap.xml.ts'
      - 'src/components/Footer.astro'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bareeq-revenue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Revenue safety and Astro build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Revenue deterministic checks
        run: |
          node --check public/scripts/monetization.js
          node scripts/check-revenue.mjs

      - name: Astro typecheck
        run: npx astro check

      - name: Generate image derivatives
        run: node scripts/generate-images.mjs

      - name: Astro production build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npx astro build
