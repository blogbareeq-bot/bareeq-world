name: Bareeq final dual-ASR publish

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/audio-openrouter-dual-asr-final.yml'
      - '.github/workflows/audio-partial-publish.yml'
      - 'scripts/audio-progressive-validate.mjs'

permissions:
  contents: read

concurrency:
  group: bareeq-final-dual-asr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  progressive-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm progressive publication plan owns execution
        run: |
          echo 'ALL_OR_NOTHING_LOOP=disabled'
          echo 'PROGRESSIVE_PLAN=validate-independent-articles,publish-exact-immediately,repair-only-failures,repeat-until-15/15'
          echo 'No TTS or ASR provider calls are made by this guard workflow.'
