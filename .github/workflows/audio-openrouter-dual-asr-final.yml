name: Bareeq final dual-ASR publish

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/audio-openrouter-dual-asr-final.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: bareeq-final-dual-asr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BAREEQ_AUDIO_CAMPAIGN_ID: sadaltager-openrouter-20260901-v1
      BAREEQ_AUDIO_PUBLISHED_MARKER: docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json
      BAREEQ_CORRECTED_CACHE_KEY: bareeq-audio-final-validation-33687747861-2
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply narrow lam-numeric adjudication repair
        run: node scripts/audio-final-runtime-repair.mjs

      - name: Offline safety gates
        run: |
          node scripts/test-audio-lifecycle.mjs
          node scripts/test-audio-production-safety.mjs
          node scripts/test-audio-production-integration.mjs
          node scripts/test-speech-script-quality-gate.mjs
          node scripts/check-speech-scripts.mjs
          node scripts/test-audio-engine-final.mjs
          node scripts/test-audio-transition-normalization.mjs
          node scripts/test-audio-dual-asr-adjudicate.mjs
          node --check scripts/audio-openrouter-campaign.mjs
          node --check scripts/audio-validate-consensus.mjs

      - name: Verify direct Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "${GEMINI_API_KEY}"
          echo 'GEMINI_CREDENTIAL=present'

      - name: Restore latest corrected checkpoint
        uses: actions/cache/restore@v4
        with:
          path: audio-candidates
          key: ${{ env.BAREEQ_CORRECTED_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Require generation complete 15/15 and preserved exact coworker
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const state = JSON.parse(fs.readFileSync(path.join('audio-candidates','_campaigns',process.env.BAREEQ_AUDIO_CAMPAIGN_ID,'state.json'),'utf8'));
          const entries = Object.entries(state.articles || {});
          if (state.generationComplete !== true || entries.length !== 15 || entries.some(([,v]) => v.generation?.status !== 'generated')) throw new Error('checkpoint is not generation-complete 15/15');
          const coworker = state.articles['ai-as-coworker-future-of-human-work'];
          const c = coworker?.validation?.consensus || {};
          const exact = ['substitutions','deletions','insertions','unresolved'].every((key) => Number(c[key]) === 0);
          if (coworker?.validation?.status !== 'validated' || !exact) throw new Error('checkpoint lost coworker exact dual-ASR evidence');
          console.log('CHECKPOINT=BOUND generation=15/15 coworker=0/0/0/0 prior_repairs=preserved');
          NODE

      - name: Regenerate only inflation part 5 for confirmed shared lexical error
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BAREEQ_AUDIO_PRODUCTION_LOCK: '1'
          BAREEQ_TTS_CORRECTION_HINTS_JSON: >-
            {"5":"At the phrase containing «وتباطؤه», pronounce exactly the written word «وتباطؤه» with hamza on واو, not «وتباطئه». Preserve every written lexical token exactly."}
        run: |
          set -euo pipefail
          part=5
          success=0
          for transport in developer-interactions developer-generate-content; do
            for attempt in 1 2 3; do
              echo "TARGETED_TTS article=altadakhom-explained-simply part=${part} transport=${transport} attempt=${attempt}"
              if BAREEQ_FORCE_TTS_PARTS="${part}" BAREEQ_TARGETED_TTS_TRANSPORT="${transport}" node scripts/audio-openrouter-targeted-regenerate.mjs --article=altadakhom-explained-simply; then
                success=1
                break 2
              fi
              sleep $((attempt * 20))
            done
          done
          if [ "${success}" -ne 1 ]; then
            echo "TARGETED_TTS_EXHAUSTED part=${part}" >&2
            exit 75
          fi
          node scripts/audio-openrouter-campaign.mjs --mode=generate
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const articleId = 'altadakhom-explained-simply';
          const state = JSON.parse(fs.readFileSync(path.join('audio-candidates','_campaigns',process.env.BAREEQ_AUDIO_CAMPAIGN_ID,'state.json'),'utf8'));
          const fp = state.articles[articleId].generation.fingerprint;
          const checkpoint = JSON.parse(fs.readFileSync(path.join('audio-candidates',articleId,fp,'checkpoint.json'),'utf8'));
          const rec = checkpoint.completedParts?.['4'];
          if (rec?.targetedRegeneration !== true || rec?.correctionHintApplied !== true) throw new Error('targeted correction missing for part 5');
          console.log('TARGETED_INFLATION_REGENERATION=PASS parts=5 model=gemini-3.1-flash-tts-preview voice=Sadaltager corpus_regenerated=no');
          NODE

      - name: Validate remaining articles with fresh independent Gemini pair
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/audio-openrouter-campaign.mjs --mode=validate

      - name: Require exact publication gates
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const state = JSON.parse(fs.readFileSync(path.join('audio-candidates','_campaigns',process.env.BAREEQ_AUDIO_CAMPAIGN_ID,'state.json'),'utf8'));
          const entries = Object.entries(state.articles || {});
          if (state.validationComplete !== true || entries.length !== 15) throw new Error('validation is not complete 15/15');
          for (const [articleId,item] of entries) {
            const fp = item.generation?.fingerprint;
            if (item.validation?.status !== 'validated' || item.validation?.fingerprint !== fp) throw new Error(`not validated: ${articleId}`);
            const base = path.join('audio-candidates', articleId, fp, 'reports');
            const asr = JSON.parse(fs.readFileSync(path.join(base,'asr-adjudication.json'),'utf8'));
            const tech = JSON.parse(fs.readFileSync(path.join(base,'technical-qa.json'),'utf8'));
            const sync = JSON.parse(fs.readFileSync(path.join(base,'sync.json'),'utf8'));
            const c = asr.consensus || {};
            if (!asr.passed || c.substitutions !== 0 || c.deletions !== 0 || c.insertions !== 0 || c.unresolved !== 0) throw new Error(`ASR gate failed ${articleId}`);
            if (!tech.passed || !sync.passed) throw new Error(`technical/sync gate failed ${articleId}`);
            if (asr.fingerprint !== fp || tech.fingerprint !== fp || sync.fingerprint !== fp) throw new Error(`fingerprint bind failed ${articleId}`);
            if (!asr.fullSha256 || asr.fullSha256 !== tech.fullSha256 || asr.fullSha256 !== sync.fullSha256) throw new Error(`digest bind failed ${articleId}`);
          }
          console.log('EXACT_PUBLICATION_GATES=PASS articles=15 dualASR=0/0/0/0 technical=PASS sync=PASS binds=PASS');
          NODE

      - name: Publish validated candidates into PR tree
        run: |
          node scripts/audio-openrouter-campaign.mjs --mode=publish
          test -f "${BAREEQ_AUDIO_PUBLISHED_MARKER}"
          echo 'PUBLISH_TO_PR_TREE=PASS'

      - name: Commit validated audio tree to PR branch
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'bareeq-audio'
          git config user.email 'audio@bareeq.local'
          git add -f public/audio docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json docs/audio/PUBLICATION-POLICY-20260901.json scripts/audio-dual-asr-adjudicate.mjs
          git commit -m 'audio: publish validated Sadaltager corpus via exact dual ASR'
          git push origin "HEAD:${PR_BRANCH}"
          echo 'PUBLISHED_AUDIO_COMMIT=pushed'

      - name: Save final checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: audio-candidates
          key: bareeq-audio-final-validation-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bareeq-final-validation-${{ github.run_id }}
          path: audio-candidates/
          if-no-files-found: error
          retention-days: 90
