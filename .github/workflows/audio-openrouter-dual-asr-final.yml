name: Bareeq final dual-ASR publish

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/audio-openrouter-dual-asr-final.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: bareeq-final-dual-asr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BAREEQ_AUDIO_CAMPAIGN_ID: sadaltager-openrouter-20260901-v1
      BAREEQ_AUDIO_PUBLISHED_MARKER: docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json
      BAREEQ_SOURCE_RUN_ID: '33862681147'
      BAREEQ_SOURCE_ARTIFACT: bareeq-final-validation-33862681147
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect already-final publish
        id: final_guard
        run: |
          if test -f "${BAREEQ_AUDIO_PUBLISHED_MARKER}"; then
            echo 'already_final=true' >> "$GITHUB_OUTPUT"
            echo 'FINAL_MARKER_ALREADY_PRESENT=yes; expensive work skipped'
          else
            echo 'already_final=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.final_guard.outputs.already_final != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: steps.final_guard.outputs.already_final != 'true'
        run: npm ci

      - name: Apply narrow lam-numeric adjudication repair
        if: steps.final_guard.outputs.already_final != 'true'
        run: node scripts/audio-final-runtime-repair.mjs

      - name: Offline safety gates
        if: steps.final_guard.outputs.already_final != 'true'
        run: |
          node scripts/test-audio-lifecycle.mjs
          node scripts/test-audio-production-safety.mjs
          node scripts/test-audio-production-integration.mjs
          node scripts/test-speech-script-quality-gate.mjs
          node scripts/check-speech-scripts.mjs
          node scripts/test-audio-engine-final.mjs
          node scripts/test-audio-transition-normalization.mjs
          node scripts/test-audio-dual-asr-adjudicate.mjs
          node --check scripts/audio-openrouter-campaign.mjs
          node --check scripts/audio-validate-consensus.mjs
          node --check scripts/audio-touchscreen-targeted-regenerate.mjs

      - name: Verify Gemini credential
        if: steps.final_guard.outputs.already_final != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "${GEMINI_API_KEY}"
          echo 'GEMINI_CREDENTIAL=present'

      - name: Restore run 50 preserved checkpoint artifact
        if: steps.final_guard.outputs.already_final != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BAREEQ_SOURCE_ARTIFACT }}
          path: audio-candidates
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BAREEQ_SOURCE_RUN_ID }}

      - name: Verify restored checkpoint artifact
        if: steps.final_guard.outputs.already_final != 'true'
        run: |
          set -euo pipefail
          test -f "audio-candidates/_campaigns/${BAREEQ_AUDIO_CAMPAIGN_ID}/state.json"
          echo "RUN50_ARTIFACT_RESTORE=PASS run=${BAREEQ_SOURCE_RUN_ID} artifact=${BAREEQ_SOURCE_ARTIFACT}"

      - name: Require generation complete 15/15 and preserved exact validations
        if: steps.final_guard.outputs.already_final != 'true'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const state = JSON.parse(fs.readFileSync(path.join('audio-candidates','_campaigns',process.env.BAREEQ_AUDIO_CAMPAIGN_ID,'state.json'),'utf8'));
          const entries = Object.entries(state.articles || {});
          if (state.generationComplete !== true || entries.length !== 15 || entries.some(([,v]) => v.generation?.status !== 'generated')) throw new Error('checkpoint is not generation-complete 15/15');
          const preserved = ['ai-agents-future-now','ai-as-coworker-future-of-human-work','altadakhom-explained-simply'];
          for (const articleId of preserved) {
            const item = state.articles[articleId];
            const c = item?.validation?.consensus || {};
            const exact = ['substitutions','deletions','insertions','unresolved'].every((key) => Number(c[key]) === 0);
            if (item?.validation?.status !== 'validated' || !exact) throw new Error(`checkpoint lost preserved exact validation: ${articleId}`);
          }
          console.log('CHECKPOINT=BOUND generation=15/15 preserved_exact=3/15 run50=restored');
          NODE

      - name: Regenerate only run-50 touchscreen mismatch parts
        if: steps.final_guard.outputs.already_final != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BAREEQ_AUDIO_PRODUCTION_LOCK: '1'
          BAREEQ_TTS_CORRECTION_HINTS_JSON: >-
            {"1":"Read the reviewed Arabic transcript verbatim, at a slightly slower clear pace. Fresh dual-ASR confirms exactly two lexical errors in this segment. First, say «الشَّاشَة» singular exactly as written, with the final ta marbuta sound; never pluralize it to «الشَّاشَات». Second, pronounce «مَلَاءَمَة» as ma-laa-a-ma, with a distinct hamza after the long alif; never say «مُلَائِمَة» or «ملائمة». Preserve «دَارَة», «لِلْمَس», «تَعْنِي», «كَثِيرًا», and «الْيَوْم» exactly. Do not add, omit, pluralize, paraphrase, or replace any token.","2":"Read the reviewed Arabic transcript verbatim, at a slightly slower clear pace. Fresh dual-ASR confirms two lexical errors plus one ambiguous display-name rendering. Say «اللَّمْسَة» with an unmistakable final t sound, never «اللَّمْس». Say «إِنَّهُ» beginning with kasra and a clearly doubled noon, never «أَنَّهُ». Say «أُولِيد» as four audible Arabic syllabic sounds beginning with a clear hamza; do not pronounce the English acronym OLED. Keep «إِل سِي دِي» as three distinct Arabic spoken units, and preserve «بِالْأَرْض» exactly. Do not add, omit, paraphrase, or replace any token.","3":"Read the reviewed Arabic transcript verbatim, at a slightly slower clear pace. Fresh dual-ASR confirms four lexical/rendering errors in this segment. Say «اللَّمْسَة» with a clearly audible final t sound, never «اللَّمْس». Say «مُتَقَابِلَة» exactly, never «مُتَقَاطِعَة». Say the coordinates as the Arabic spoken words «إِكْس وَوَاي»: articulate «إِكْس» as i-k-s with an audible initial hamza/kasra, then say «وَوَاي» as wa-waay; do not use the English letter symbols X or Y. Preserve «مَوْضِع» and «الْمَوْضِع» with ض. Do not add, omit, paraphrase, or replace any token.","4":"Read the reviewed Arabic transcript verbatim. Pronounce «وَحْدَهُ» with masculine final hu, never وحدها. Preserve every written token and ending.","5":"Read the reviewed Arabic transcript verbatim. Pronounce «يُشَوِّشُهَا» slowly and exactly, with the doubled shin and final ha. Preserve every written token.","6":"Read the reviewed Arabic transcript verbatim, at a slightly slower clear pace. Fresh dual-ASR confirms exactly two lexical errors in this segment. Say «تَنْجَح» exactly as written, never replace it with «تَظْهَر» or any other verb. Say «يَحْتَجُّ» exactly as yah-taj-ju, with no long alif and a clearly doubled final ج; never say «يَحْتَاج». Preserve «لِلْمَس», «الضَّغْط», «إِنَّهُ», «تُرْسِلُهَا», and «مِنْهُ» exactly. Do not insert «فِي الْمَرَّة», repeat a phrase, add, omit, paraphrase, or replace any token."}
        run: |
          set -euo pipefail
          # Run 50 fresh dual-ASR maps all remaining substantive errors to parts 1,2,3,6.
          # Preserve parts 4 and 5 byte-for-byte and preserve every other article.
          for part in 1 2 3 6; do
            success=0
            transports="developer-interactions developer-generate-content"
            if [ -n "${OPENROUTER_API_KEY:-}" ]; then
              transports="${transports} openrouter-speech"
            fi
            for transport in ${transports}; do
              attempts=8
              for attempt in $(seq 1 "${attempts}"); do
                echo "TARGETED_TTS article=how-touchscreens-work part=${part} transport=${transport} attempt=${attempt}"
                if BAREEQ_FORCE_TTS_PARTS="${part}" BAREEQ_TARGETED_TTS_TRANSPORT="${transport}" node scripts/audio-touchscreen-targeted-regenerate.mjs --article=how-touchscreens-work; then
                  success=1
                  break 2
                fi
                sleep 45
              done
            done
            if [ "${success}" -ne 1 ]; then
              echo "TARGETED_TTS_EXHAUSTED article=how-touchscreens-work part=${part}" >&2
              exit 75
            fi
          done
          node scripts/audio-openrouter-campaign.mjs --mode=generate
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const articleId = 'how-touchscreens-work';
          const state = JSON.parse(fs.readFileSync(path.join('audio-candidates','_campaigns',process.env.BAREEQ_AUDIO_CAMPAIGN_ID,'state.json'),'utf8'));
          const fp = state.articles[articleId].generation.fingerprint;
          const checkpoint = JSON.parse(fs.readFileSync(path.join('audio-candidates',articleId,fp,'checkpoint.json'),'utf8'));
          for (const index of [0,1,2,3,4,5]) {
            const rec = checkpoint.completedParts?.[String(index)];
            if (rec?.targetedRegeneration !== true || rec?.correctionHintApplied !== true) throw new Error(`targeted touchscreen correction missing for part ${index + 1}`);
          }
          console.log('TARGETED_TOUCHSCREEN_REGENERATION=PASS refreshed_parts=1,2,3,6 preserved_parts=4,5 corpus_regenerated=no');
          NODE

      - name: Validate remaining articles with fresh independent Gemini pair
        if: steps.final_guard.outputs.already_final != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/audio-openrouter-campaign.mjs --mode=validate

      - name: Require exact publication gates
        if: steps.final_guard.outputs.already_final != 'true'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const state = JSON.parse(fs.readFileSync(path.join('audio-candidates','_campaigns',process.env.BAREEQ_AUDIO_CAMPAIGN_ID,'state.json'),'utf8'));
          const entries = Object.entries(state.articles || {});
          if (state.validationComplete !== true || entries.length !== 15) throw new Error('validation is not complete 15/15');
          for (const [articleId,item] of entries) {
            const fp = item.generation?.fingerprint;
            if (item.validation?.status !== 'validated' || item.validation?.fingerprint !== fp) throw new Error(`not validated: ${articleId}`);
            const base = path.join('audio-candidates', articleId, fp, 'reports');
            const asr = JSON.parse(fs.readFileSync(path.join(base,'asr-adjudication.json'),'utf8'));
            const tech = JSON.parse(fs.readFileSync(path.join(base,'technical-qa.json'),'utf8'));
            const sync = JSON.parse(fs.readFileSync(path.join(base,'sync.json'),'utf8'));
            const c = asr.consensus || {};
            if (!asr.passed || c.substitutions !== 0 || c.deletions !== 0 || c.insertions !== 0 || c.unresolved !== 0) throw new Error(`ASR gate failed ${articleId}`);
            if (!tech.passed || !sync.passed) throw new Error(`technical/sync gate failed ${articleId}`);
            if (asr.fingerprint !== fp || tech.fingerprint !== fp || sync.fingerprint !== fp) throw new Error(`fingerprint bind failed ${articleId}`);
            if (!asr.fullSha256 || asr.fullSha256 !== tech.fullSha256 || asr.fullSha256 !== sync.fullSha256) throw new Error(`digest bind failed ${articleId}`);
          }
          console.log('EXACT_PUBLICATION_GATES=PASS articles=15 dualASR=0/0/0/0 technical=PASS sync=PASS binds=PASS');
          NODE

      - name: Publish validated candidates into PR tree
        if: steps.final_guard.outputs.already_final != 'true'
        run: |
          node scripts/audio-openrouter-campaign.mjs --mode=publish
          test -f "${BAREEQ_AUDIO_PUBLISHED_MARKER}"
          echo 'PUBLISH_TO_PR_TREE=PASS'

      - name: Commit validated audio tree to PR branch
        if: steps.final_guard.outputs.already_final != 'true'
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'bareeq-audio'
          git config user.email 'audio@bareeq.local'
          git add -f public/audio docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json docs/audio/PUBLICATION-POLICY-20260901.json scripts/audio-dual-asr-adjudicate.mjs
          git commit -m 'audio: publish validated Sadaltager corpus via exact dual ASR'
          git push origin "HEAD:${PR_BRANCH}"
          echo 'PUBLISHED_AUDIO_COMMIT=pushed'

      - name: Save final checkpoint
        if: ${{ always() && steps.final_guard.outputs.already_final != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: audio-candidates
          key: bareeq-audio-final-validation-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload final evidence
        if: ${{ always() && steps.final_guard.outputs.already_final != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: bareeq-final-validation-${{ github.run_id }}
          path: audio-candidates/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
