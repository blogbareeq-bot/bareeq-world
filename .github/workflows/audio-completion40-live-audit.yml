name: Bareeq completion40 production audio audit
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/audio-completion40-live-audit.yml', 'scripts/audio-published-build-guard.mjs', 'scripts/test-audio-published-build-guard.mjs', 'scripts/run-v4211-audio.mjs']
  push:
    branches: [main]
    paths: ['.github/workflows/audio-completion40-live-audit.yml', 'scripts/audio-published-build-guard.mjs', 'scripts/test-audio-published-build-guard.mjs', 'scripts/run-v4211-audio.mjs']
permissions:
  contents: read
  checks: read
jobs:
  build-protection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify build protection on the actual published corpus
        run: |
          node scripts/test-audio-published-build-guard.mjs
          node --input-type=module <<'NODE'
          import {snapshotPublishedAudio} from './scripts/audio-published-build-guard.mjs';import {writeFile} from 'node:fs/promises';await writeFile('published-before-build.json',JSON.stringify(await snapshotPublishedAudio()));
          NODE
          npm run build
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';import {createHash} from 'node:crypto';import {assertPublishedAudioUnchanged} from './scripts/audio-published-build-guard.mjs';
          const before=JSON.parse(await readFile('published-before-build.json'));await assertPublishedAudioUnchanged(before);
          for(const a of before.articles)for(const [file,sha] of Object.entries(a.files)){const b=await readFile('dist/audio/articles/'+a.audioKey+'/'+file);if(createHash('sha256').update(b).digest('hex')!==sha)throw new Error('Built output changed a protected audio file '+a.articleId+'/'+file);}
          console.log('PUBLISHED_AUDIO_DIST=PASS exact='+before.articles.length+' every protected source file copied unchanged');
          NODE
  live-audit:
    if: github.event_name == 'push'
    needs: build-protection
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Wait for this main commit to deploy through Cloudflare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          for(let i=0;i<32;i++){const j=JSON.parse(execFileSync('gh',['api',`repos/${process.env.GITHUB_REPOSITORY}/commits/${process.env.GITHUB_SHA}/check-runs`],{encoding:'utf8'})),cf=j.check_runs.find(x=>x.name==='Cloudflare Pages');if(cf?.conclusion==='success'){console.log('NATIVE_CLOUDFLARE_MAIN=PASS '+process.env.GITHUB_SHA);process.exit(0);}if(cf?.conclusion==='failure')throw new Error('Native Cloudflare deployment failed');await new Promise(r=>setTimeout(r,15000));}throw new Error('Cloudflare main deployment timed out');
          NODE
      - name: Verify live production manifests and all new audio parts
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';import {createHash} from 'node:crypto';
          const r=JSON.parse(await readFile('docs/audio/COMPLETION40-PUBLICATION-20261011.json')),sha=x=>createHash('sha256').update(x).digest('hex');
          const manifests=[],parts=[],origins=['https://bareeqworld.com','https://bareeq-world.pages.dev'];
          for(const origin of origins){
            for(let i=0;i<r.liveIdentity.length;i+=4)await Promise.all(r.liveIdentity.slice(i,i+4).map(async a=>{
              let result={origin,path:a.path,articleId:a.articleId};
              try{const response=await fetch(origin+a.path+'?audit='+process.env.GITHUB_RUN_ID,{signal:AbortSignal.timeout(12000)});result.httpStatus=response.status;result.contentType=response.headers.get('content-type');const text=await response.text();try{const m=JSON.parse(text);result.fingerprint=m.candidateFingerprint||m.fingerprint;result.fullSha256=m.fullSha256;result.passed=response.ok&&result.fingerprint===a.fingerprint&&result.fullSha256===a.fullSha256;if(!result.passed)result.expected=a;}catch{result.passed=false;result.bodyPrefix=text.slice(0,160);}}catch(e){result.passed=false;result.error=e.message;}manifests.push(result);console.log(JSON.stringify(result));
            }));
          }
          const newSources=new Set(r.published.flatMap(a=>a.parts).map(p=>p.src)),assets=[];for(const a of r.liveIdentity){const m=JSON.parse(await readFile('public'+a.path));assets.push(...m.parts.map(p=>({...p.audio[m.defaultVoice],articleId:a.articleId})));}
          for(let i=0;i<assets.length;i+=4)await Promise.all(assets.slice(i,i+4).map(async p=>{
            let result={origin:origins[0],src:p.src,expectedSha256:p.sha256};try{const response=await fetch(origins[0]+p.src+'?audit='+process.env.GITHUB_RUN_ID,{signal:AbortSignal.timeout(15000)}),b=Buffer.from(await response.arrayBuffer());result.httpStatus=response.status;result.sha256=sha(b);result.bytes=b.length;result.passed=response.ok&&result.sha256===p.sha256&&result.bytes===p.bytes;}catch(e){result.passed=false;result.error=e.message;}parts.push(result);console.log(JSON.stringify(result));
          }));
          const report={schema:'bareeq.audio-completion40-production-audit.v1',verifiedAt:new Date().toISOString(),sourcePublicationCommit:'0f78ebcd5380da8acccbe6d0876009694fbda26e',auditCommit:process.env.GITHUB_SHA,sourceSubmissionSha256:r.sourceSubmissionSha256,publishedExact:13,auditRunId:process.env.GITHUB_RUN_ID,newPartsVerified:parts.filter(x=>x.passed&&newSources.has(x.src)).length,allPublishedPartsVerified:parts.filter(x=>x.passed).length,productionManifestsVerified:manifests.filter(x=>x.origin===origins[0]&&x.passed).length,passed:parts.every(x=>x.passed)&&manifests.filter(x=>x.origin===origins[0]).every(x=>x.passed),manifests,parts,ttsCalls:0,newAsrCalls:0};
          await writeFile('completion40-production-audit.json',JSON.stringify(report,null,2)+'\n');if(!report.passed)throw new Error('Live audio audit failed; see structured endpoint evidence');console.log('COMPLETION40_PRODUCTION_AUDIT=PASS exact=13/15 manifests=13 newParts=26 allParts='+report.allPublishedPartsVerified);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bareeq-completion40-production-audit-${{ github.run_id }}
          path: completion40-production-audit.json
          retention-days: 90
          if-no-files-found: warn
