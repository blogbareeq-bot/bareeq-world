name: Analyze exactness per immutable Hamed part
on:
  push:
    branches: [audio/fahed-v4220]
    paths: [.github/workflows/analyze-hamed-part-exactness.yml]
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/fahed-v4220
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Compare saved ASR chunks against their exact part text
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {compareArabicTranscripts} from './scripts/arabic-transcript-match.mjs';
          const A='how-touchscreens-work',K='de93f3d9f91c8b8b';
          const script=JSON.parse(await readFile(`scripts/speech-scripts/${A}.json`,'utf8'));
          const manifest=JSON.parse(await readFile(`public/audio/articles/${K}/manifest.json`,'utf8'));
          const first=JSON.parse(await readFile(`scripts/speech-transcript-evidence/${A}-hamed-corrected-full-v2.json`,'utf8'));
          const second=JSON.parse(await readFile(`scripts/speech-transcript-evidence/${A}-hamed-corrected-full-v2-recheck.json`,'utf8'));
          const byId=new Map(script.segments.map(s=>[s.segmentId,s.spokenText]));
          for(let i=0;i<manifest.parts.length;i++){
            const expected=manifest.parts[i].sync.map(e=>{const t=byId.get(e.id);if(!t)throw new Error(`missing ${e.id}`);return t;}).join(' ');
            const c1=compareArabicTranscripts(expected,first.passes[0].chunks[i].transcript);
            const c2=compareArabicTranscripts(expected,second.chunks[i].transcript);
            console.log(JSON.stringify({part:i+1,audioSha256:manifest.parts[i].audio.hamed.sha256,expectedWords:c1.expectedWordCount,pass1:{errors:c1.wordErrorCount,substitutions:c1.substitutions,deletions:c1.deletions,insertions:c1.insertions,diffs:c1.operations},pass2:{errors:c2.wordErrorCount,substitutions:c2.substitutions,deletions:c2.deletions,insertions:c2.insertions,diffs:c2.operations}}));
          }
          NODE
