name: Gemini Transcribe QA — three distinct articles

on:
  push:
    branches:
      - qa/gemini-transcribe-poc-20260828
    paths:
      - .github/workflows/gemini-transcribe-three.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - id: select
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/gemini-transcribe-three
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import path from 'node:path';

          const excluded = new Set([
            'عادات-ثقافيه-مدهشه-من-حول-العالم-حين-يكون-الاختلاف-اثراء',
          ]);
          const files = (await readdir('scripts/speech-scripts')).filter((name) => name.endsWith('.json'));
          const candidates = [];

          for (const filename of files) {
            const articleId = filename.slice(0, -5);
            if (excluded.has(articleId)) continue;
            const articleFile = path.join('src', 'content', 'posts', `${articleId}.md`);
            let article;
            try { article = await readFile(articleFile, 'utf8'); } catch { continue; }
            const category = article.match(/^category:\s*["']?(.+?)["']?\s*$/m)?.[1]?.trim() ?? 'غير مصنف';
            const hash = createHash('sha256').update(articleId).digest('hex').slice(0, 16);
            const manifestUrl = `https://bareeqworld.com/audio/articles/${hash}/manifest.json`;
            try {
              const response = await fetch(manifestUrl, { signal: AbortSignal.timeout(12000) });
              if (!response.ok) continue;
              const manifest = await response.json();
              if (!/Gemini/i.test(String(manifest.provider ?? ''))) continue;
              const defaultVoice = String(manifest.defaultVoice ?? '').toLowerCase();
              let partIndex = manifest.parts?.findIndex((part) => part?.audio?.[defaultVoice]?.src) ?? -1;
              let voice = defaultVoice;
              if (partIndex < 0) {
                partIndex = manifest.parts?.findIndex((part) => part?.audio && Object.values(part.audio).some((entry) => entry?.src)) ?? -1;
                if (partIndex >= 0) voice = Object.entries(manifest.parts[partIndex].audio).find(([, entry]) => entry?.src)?.[0] ?? defaultVoice;
              }
              if (partIndex < 0 || !voice) continue;
              const audio = manifest.parts[partIndex].audio[voice];
              candidates.push({
                articleId,
                hash,
                title: manifest.title ?? articleId,
                category,
                provider: manifest.provider,
                ttsModel: manifest.model,
                voice,
                partIndex,
                durationSeconds: audio.durationSeconds ?? null,
                audioSrc: audio.src,
              });
            } catch {
              // Skip inaccessible/non-live candidates.
            }
          }

          candidates.sort((a, b) => (a.durationSeconds ?? 1e9) - (b.durationSeconds ?? 1e9));
          const selected = [];
          const usedCategories = new Set();
          for (const item of candidates) {
            if (selected.length >= 3) break;
            if (!usedCategories.has(item.category)) {
              selected.push(item);
              usedCategories.add(item.category);
            }
          }
          for (const item of candidates) {
            if (selected.length >= 3) break;
            if (!selected.some((x) => x.articleId === item.articleId)) selected.push(item);
          }
          if (selected.length < 3) {
            console.error('Gemini live candidates found:', JSON.stringify(candidates, null, 2));
            throw new Error(`Need 3 live Gemini articles excluding the previous sample; found ${selected.length}.`);
          }
          await writeFile('qa/gemini-transcribe-three/candidates.json', JSON.stringify(candidates, null, 2));
          await writeFile('qa/gemini-transcribe-three/selected.json', JSON.stringify(selected, null, 2));
          console.log('Selected articles:');
          for (const item of selected) console.log(`- ${item.title} | ${item.category} | ${item.ttsModel} | ${item.voice} | ${item.durationSeconds}s`);
          process.stdout.write(`MATRIX_JSON=${JSON.stringify({ include: selected })}\n`);
          NODE
          matrix=$(node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('qa/gemini-transcribe-three/selected.json','utf8')); process.stdout.write(JSON.stringify({include:s}))")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: gemini-transcribe-three-selection
          path: qa/gemini-transcribe-three/
          retention-days: 7

  transcribe:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      ARTICLE_ID: ${{ matrix.articleId }}
      AUDIO_HASH: ${{ matrix.hash }}
      EXPECTED_VOICE: ${{ matrix.voice }}
      EXPECTED_PART_INDEX: ${{ matrix.partIndex }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: test -n "$GEMINI_API_KEY"

      - name: Prepare exact expected speech and live sample
        shell: bash
        run: |
          set -euo pipefail
          root="qa/gemini-transcribe-three/${AUDIO_HASH}"
          mkdir -p "$root"
          curl -fsSL "https://bareeqworld.com/audio/articles/${AUDIO_HASH}/manifest.json" -o "$root/manifest.json"
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { extractArticleSpeechModel, normalizeArabicForComparison } from './scripts/speech-script-core.mjs';
          const id = process.env.ARTICLE_ID;
          const hash = process.env.AUDIO_HASH;
          const root = `qa/gemini-transcribe-three/${hash}`;
          const articleFile = `src/content/posts/${id}.md`;
          const scriptFile = `scripts/speech-scripts/${id}.json`;
          const article = await readFile(articleFile, 'utf8');
          const script = JSON.parse(await readFile(scriptFile, 'utf8'));
          const manifest = JSON.parse(await readFile(`${root}/manifest.json`, 'utf8'));
          if (!/Gemini/i.test(String(manifest.provider ?? ''))) throw new Error(`Live provider changed: ${manifest.provider}`);
          const voice = process.env.EXPECTED_VOICE;
          const partIndex = Number(process.env.EXPECTED_PART_INDEX);
          const part = manifest.parts?.[partIndex];
          const audio = part?.audio?.[voice];
          if (!audio?.src) throw new Error(`Expected live audio missing for voice=${voice}, part=${partIndex + 1}`);
          const model = extractArticleSpeechModel({ articleId: id, source: article, filename: articleFile });
          const runtimeToSegment = new Map(model.segments.filter((s) => s.runtimeId).map((s) => [s.runtimeId, s.segmentId]));
          const byId = new Map((script.segments ?? []).map((s) => [s.segmentId, s]));
          const titleRecord = (script.segments ?? []).find((s) => s.type === 'title');
          const expected = [titleRecord?.spokenText?.trim() || manifest.title || model.title];
          const missing = [];
          for (const sync of part.sync ?? []) {
            const segmentId = runtimeToSegment.get(sync.id);
            const record = segmentId ? byId.get(segmentId) : null;
            if (record?.spokenText) expected.push(record.spokenText.trim());
            else missing.push({ runtimeId: sync.id, segmentId: segmentId ?? null });
          }
          if (missing.length) throw new Error(`Current speech script no longer maps to ${missing.length} live sync block(s): ${JSON.stringify(missing)}`);
          const text = expected.join('\n');
          const meta = {
            articleId: id,
            hash,
            title: manifest.title,
            category: article.match(/^category:\s*["']?(.+?)["']?\s*$/m)?.[1]?.trim() ?? 'غير مصنف',
            provider: manifest.provider,
            ttsModel: manifest.model,
            voice,
            partIndex,
            durationSeconds: audio.durationSeconds ?? null,
            audioSrc: audio.src,
            syncBlocks: part.sync?.length ?? 0,
            expectedCharacters: text.length,
          };
          await writeFile(`${root}/meta.json`, JSON.stringify(meta, null, 2));
          await writeFile(`${root}/expected.txt`, text + '\n');
          await writeFile(`${root}/expected-normalized.txt`, normalizeArabicForComparison(text) + '\n');
          console.log(JSON.stringify(meta, null, 2));
          NODE
          src=$(node -p "JSON.parse(require('fs').readFileSync('$root/meta.json','utf8')).audioSrc")
          curl -fsSL "https://bareeqworld.com${src}" -o "$root/sample.mp3"
          test -s "$root/sample.mp3"

      - name: Install Gemini SDK
        run: python -m pip install --quiet --disable-pip-version-check --upgrade google-genai

      - name: First transcription — unbiased verbatim
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          python <<'PY'
          import os
          from pathlib import Path
          from google import genai
          root = Path('qa/gemini-transcribe-three') / os.environ['AUDIO_HASH']
          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          f = client.files.upload(file=str(root / 'sample.mp3'))
          r = client.interactions.create(
              model='gemini-3.5-transcribe',
              input=[{'type':'audio','uri':f.uri,'mime_type':f.mime_type}],
              generation_config={'transcription_config': {'language_codes': [], 'mode': {'type':'verbatim'}}},
          )
          text = (r.output_text or '').strip()
          if not text: raise RuntimeError('empty pass-1 transcript')
          (root / 'transcript-pass1.txt').write_text(text + '\n', encoding='utf-8')
          print('pass1 characters=', len(text))
          PY

      - name: Compare pass 1 and isolate disputed words
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { normalizeArabicForComparison } from './scripts/speech-script-core.mjs';
          const root = `qa/gemini-transcribe-three/${process.env.AUDIO_HASH}`;
          const E = normalizeArabicForComparison(await readFile(`${root}/expected.txt`, 'utf8')).split(/\s+/).filter(Boolean);
          const A = normalizeArabicForComparison(await readFile(`${root}/transcript-pass1.txt`, 'utf8')).split(/\s+/).filter(Boolean);
          function diff(E,A){
            const dp=Array.from({length:E.length+1},()=>new Uint32Array(A.length+1));
            for(let i=0;i<=E.length;i++)dp[i][0]=i; for(let j=0;j<=A.length;j++)dp[0][j]=j;
            for(let i=1;i<=E.length;i++)for(let j=1;j<=A.length;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(E[i-1]===A[j-1]?0:1));
            let i=E.length,j=A.length; const ops=[];
            while(i||j){
              if(i&&j&&E[i-1]===A[j-1]&&dp[i][j]===dp[i-1][j-1]){i--;j--;continue;}
              if(i&&j&&dp[i][j]===dp[i-1][j-1]+1){ops.push({type:'substitution',expected:E[i-1],actual:A[j-1]});i--;j--;continue;}
              if(i&&dp[i][j]===dp[i-1][j]+1){ops.push({type:'deletion',expected:E[i-1],actual:null});i--;continue;}
              ops.push({type:'insertion',expected:null,actual:A[j-1]});j--;
            }
            ops.reverse(); return {edits:dp[E.length][A.length],ops};
          }
          const {edits,ops}=diff(E,A); const wer=E.length?edits/E.length:1;
          const vocab=[...new Set(ops.map(o=>o.expected).filter(w=>w && /[\u0621-\u064A]/u.test(w) && w.length>=3))].slice(0,20);
          const result={pass:1,expectedTokens:E.length,transcriptTokens:A.length,editDistance:edits,wer:Number(wer.toFixed(6)),similarityPercent:Number(((1-Math.min(1,wer))*100).toFixed(2)),differences:ops};
          await writeFile(`${root}/result-pass1.json`, JSON.stringify(result,null,2)+'\n');
          await writeFile(`${root}/diff-vocab.json`, JSON.stringify(vocab,null,2)+'\n');
          console.log(`PASS1 WER=${(wer*100).toFixed(2)}% edits=${edits}`); console.log(JSON.stringify(ops));
          NODE

      - name: Second transcription — disputed-word verification
        if: ${{ always() }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          python <<'PY'
          import json, os
          from pathlib import Path
          from google import genai
          root = Path('qa/gemini-transcribe-three') / os.environ['AUDIO_HASH']
          vocab = json.loads((root / 'diff-vocab.json').read_text(encoding='utf-8'))
          if not vocab:
              print('No disputed expected words; pass 2 not needed.')
              raise SystemExit(0)
          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          f = client.files.upload(file=str(root / 'sample.mp3'))
          r = client.interactions.create(
              model='gemini-3.5-transcribe',
              input=[{'type':'audio','uri':f.uri,'mime_type':f.mime_type}],
              generation_config={'transcription_config': {'language_codes': [], 'custom_vocabulary': vocab, 'mode': {'type':'verbatim'}}},
          )
          text=(r.output_text or '').strip()
          if not text: raise RuntimeError('empty pass-2 transcript')
          (root/'transcript-pass2.txt').write_text(text+'\n',encoding='utf-8')
          print('pass2 vocabulary=', vocab)
          print('pass2 characters=', len(text))
          PY

      - name: Final comparison and verdict
        if: ${{ always() }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { access, readFile, writeFile } from 'node:fs/promises';
          import { normalizeArabicForComparison } from './scripts/speech-script-core.mjs';
          const root=`qa/gemini-transcribe-three/${process.env.AUDIO_HASH}`;
          const meta=JSON.parse(await readFile(`${root}/meta.json`,'utf8'));
          const p1=JSON.parse(await readFile(`${root}/result-pass1.json`,'utf8'));
          let pass2Exists=true; try{await access(`${root}/transcript-pass2.txt`);}catch{pass2Exists=false;}
          function calc(text){
            const E=normalizeArabicForComparison(text.expected).split(/\s+/).filter(Boolean),A=normalizeArabicForComparison(text.actual).split(/\s+/).filter(Boolean);
            const dp=Array.from({length:E.length+1},()=>new Uint32Array(A.length+1)); for(let i=0;i<=E.length;i++)dp[i][0]=i;for(let j=0;j<=A.length;j++)dp[0][j]=j;
            for(let i=1;i<=E.length;i++)for(let j=1;j<=A.length;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(E[i-1]===A[j-1]?0:1));
            let i=E.length,j=A.length;const ops=[];while(i||j){if(i&&j&&E[i-1]===A[j-1]&&dp[i][j]===dp[i-1][j-1]){i--;j--;continue;}if(i&&j&&dp[i][j]===dp[i-1][j-1]+1){ops.push({type:'substitution',expected:E[i-1],actual:A[j-1]});i--;j--;continue;}if(i&&dp[i][j]===dp[i-1][j]+1){ops.push({type:'deletion',expected:E[i-1],actual:null});i--;continue;}ops.push({type:'insertion',expected:null,actual:A[j-1]});j--;}ops.reverse();const edits=dp[E.length][A.length],wer=E.length?edits/E.length:1;return{expectedTokens:E.length,transcriptTokens:A.length,editDistance:edits,wer:Number(wer.toFixed(6)),similarityPercent:Number(((1-Math.min(1,wer))*100).toFixed(2)),differences:ops};
          }
          let p2=null;
          if(pass2Exists){p2=calc({expected:await readFile(`${root}/expected.txt`,'utf8'),actual:await readFile(`${root}/transcript-pass2.txt`,'utf8')});await writeFile(`${root}/result-pass2.json`,JSON.stringify(p2,null,2)+'\n');}
          const final=p2??p1;
          let verdict;
          if(p1.editDistance===0) verdict='PASS_EXACT';
          else if(p2 && p2.editDistance===0) verdict='PASS_ASR_VARIANCE';
          else if(final.wer<=0.01) verdict='REVIEW_MINOR_PERSISTENT';
          else if(final.wer<=0.03) verdict='REVIEW_PERSISTENT';
          else verdict='FAIL_INVESTIGATE';
          const output={meta,pass1:p1,pass2:p2,final,verdict,persistentDifferences:final.differences};
          await writeFile(`${root}/final.json`,JSON.stringify(output,null,2)+'\n');
          const md=`# Gemini Transcribe QA — ${meta.title}\n\n- Category: ${meta.category}\n- TTS: ${meta.provider} / ${meta.ttsModel} / ${meta.voice}\n- Sample: part ${meta.partIndex+1}, ${meta.durationSeconds ?? 'unknown'} s\n- STT: gemini-3.5-transcribe / verbatim\n- Pass 1 WER: ${(p1.wer*100).toFixed(2)}%\n- Pass 2 WER: ${p2 ? (p2.wer*100).toFixed(2)+'%' : 'not needed'}\n- Final similarity: ${final.similarityPercent}%\n- Final edits: ${final.editDistance}\n- Verdict: **${verdict}**\n\n## Persistent differences\n\n\`\`\`json\n${JSON.stringify(final.differences,null,2)}\n\`\`\`\n`;
          await writeFile(`${root}/report.md`,md);
          console.log(`FINAL ${meta.title}: ${verdict}; WER=${(final.wer*100).toFixed(2)}%; similarity=${final.similarityPercent}%; edits=${final.editDistance}`);
          console.log(JSON.stringify(final.differences));
          NODE

      - name: Upload article QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-transcribe-three-${{ matrix.hash }}
          path: qa/gemini-transcribe-three/${{ matrix.hash }}/
          retention-days: 7
