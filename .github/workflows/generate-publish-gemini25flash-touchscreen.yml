name: Generate verify and publish touchscreen Gemini 2.5 Flash

on:
  push:
    branches: [audio/fahed-v4220]
    paths:
      - .github/workflows/generate-publish-gemini25flash-touchscreen.yml
      - scripts/gemini-checkpoints/**gemini-2.5-flash-preview-tts/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemini25flash-touchscreen-publish
  cancel-in-progress: false

jobs:
  generate-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: audio/fahed-v4220
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Lock approved v3 pilot and prepare runtime
        run: |
          node scripts/test-arabic-transcript-match.mjs
          node scripts/check-speech-scripts.mjs
          node --check scripts/prepare-gemini25flash-full-runtime.mjs
          node --check scripts/verify-and-seal-gemini25flash-full.mjs
          node scripts/prepare-gemini25flash-full-runtime.mjs
          node scripts/check-speech-scripts.mjs
          node --check scripts/generate-audio.mjs

      - name: Require Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY" || { echo '::error::GEMINI_API_KEY unavailable'; exit 2; }

      - name: Show reduced-request synthesis plan
        env:
          BAREEQ_TTS_PROVIDER: gemini
          BAREEQ_TTS_INCLUDE_IDS: how-touchscreens-work
          BAREEQ_TTS_MAX_MISSING_ARTICLES_PER_BUILD: '1'
          BAREEQ_GEMINI_MAX_REQUESTS_PER_BUILD: '12'
          GEMINI_TTS_MAX_REQUEST_BYTES: '5500'
        run: node scripts/generate-audio.mjs --plan

      - name: Generate or resume full 2.5 Flash Sadaltager article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BAREEQ_TTS_PROVIDER: gemini
          BAREEQ_TTS_INCLUDE_IDS: how-touchscreens-work
          BAREEQ_TTS_MAX_MISSING_ARTICLES_PER_BUILD: '1'
          BAREEQ_GEMINI_MAX_REQUESTS_PER_BUILD: '12'
          BAREEQ_GEMINI_SYNTHESIS_BUDGET_MS: '2400000'
          BAREEQ_TTS_MAX_RETRIES: '1'
          GEMINI_TTS_MIN_INTERVAL_MS: '9000'
          GEMINI_TTS_MAX_REQUEST_BYTES: '5500'
        run: node scripts/generate-audio.mjs

      - name: Preserve 2.5 Flash checkpoint if incomplete
        id: completeness
        run: |
          if node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const m=JSON.parse(await readFile('public/audio/articles/de93f3d9f91c8b8b/manifest.json','utf8'));
          if(m.articleId!=='how-touchscreens-work'||m.provider!=='Google Gemini API'||m.model!=='gemini-2.5-flash-preview-tts'||m.defaultVoice!=='sadaltager') process.exit(1);
          if(!Array.isArray(m.parts)||!m.parts.length||!m.parts.every(p=>p.audio?.sadaltager?.src)) process.exit(1);
          console.log(`FULL_SYNTHESIS_COMPLETE parts=${m.parts.length}`);
          NODE
          then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            git checkout -- scripts/generate-audio.mjs scripts/speech-test-clips/how-touchscreens-work.json
            git config user.name 'bareeq-audio-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add -f scripts/gemini-checkpoints/*gemini-2.5-flash-preview-tts/ 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m 'audio: checkpoint Gemini 2.5 Flash touchscreen synthesis'
              git pull --rebase origin audio/fahed-v4220
              git push origin HEAD:audio/fahed-v4220
            fi
            echo '::error::2.5 Flash article incomplete; checkpoint preserved.'
            exit 1
          fi

      - name: Require two independent exact full-article transcripts
        if: steps.completeness.outputs.complete == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/verify-and-seal-gemini25flash-full.mjs

      - name: Restore runtime-only working files
        if: always()
        run: git checkout -- scripts/generate-audio.mjs scripts/speech-test-clips/how-touchscreens-work.json || true

      - name: Validate sealed publication candidate
        if: steps.completeness.outputs.complete == 'true'
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const m=JSON.parse(await readFile('public/audio/articles/de93f3d9f91c8b8b/manifest.json','utf8')); const q=m.automatedTranscriptReview;
          if(m.provider!=='Google Gemini API'||m.model!=='gemini-2.5-flash-preview-tts'||m.defaultVoice!=='sadaltager') throw new Error('Candidate identity mismatch');
          if(q?.status!=='passed'||q?.scope!=='assembled-complete-article'||q?.transcriptionPasses!==2||q?.wordErrorCountAcrossAllPasses!==0||q?.substitutions!==0||q?.deletions!==0||q?.insertions!==0) throw new Error('Zero-error whole-article seal missing');
          console.log(`PUBLICATION_CANDIDATE_ZERO_ERROR=PASS words=${q.expectedWordCount}`);
          NODE

      - name: Commit immutable QA candidate on audio branch
        if: steps.completeness.outputs.complete == 'true'
        run: |
          git config user.name 'bareeq-audio-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/audio/articles/de93f3d9f91c8b8b/ scripts/speech-test-evidence/how-touchscreens-work-gemini25flash-full-v1.mp3 scripts/speech-transcript-evidence/how-touchscreens-work-gemini25flash-full-v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'audio: approve full Gemini 2.5 Flash touchscreen article at zero errors'
            git pull --rebase origin audio/fahed-v4220
            git push origin HEAD:audio/fahed-v4220
          fi

      - name: Stage verified release over current main
        if: steps.completeness.outputs.complete == 'true'
        run: |
          rm -rf /tmp/bareeq-25-release && mkdir -p /tmp/bareeq-25-release
          cp -a public/audio/articles/de93f3d9f91c8b8b /tmp/bareeq-25-release/audio
          git fetch origin main
          git checkout -B bareeq-publish-main origin/main
          rm -rf public/audio/articles/de93f3d9f91c8b8b
          mkdir -p public/audio/articles
          cp -a /tmp/bareeq-25-release/audio public/audio/articles/de93f3d9f91c8b8b
          node - <<'NODE'
          const fs=require('node:fs');const p='scripts/generate-audio.mjs';let s=fs.readFileSync(p,'utf8');
          const once=(a,b,l)=>{const n=s.split(a).length-1;if(n!==1)throw new Error(`${l}: expected 1 match, got ${n}`);s=s.replace(a,b)};
          once("const GEMINI_MODEL = 'gemini-3.1-flash-tts-preview';","const GEMINI_MODEL = 'gemini-2.5-flash-preview-tts';",'production Gemini model');
          once('spokenText: record?.spokenText ?? segment.sourceText,',"spokenText: (record?.spokenText ?? segment.sourceText).replace('مَا نُسَمِّيهِ عَادَةً «الشَّاشَة» لَيْسَ طَبَقَةً وَاحِدَة.', 'مَا نُسَمِّيهِ عَادَةً، «الشَّاشَة»، لَيْسَ طَبَقَةً وَاحِدَة.'),",'v3 punctuation-only production transform');
          fs.writeFileSync(p,s);
          NODE
          node --check scripts/generate-audio.mjs

      - name: Build current main with exact verified cache
        if: steps.completeness.outputs.complete == 'true'
        env:
          BAREEQ_TTS_PROVIDER: gemini
          BAREEQ_TTS_INCLUDE_IDS: how-touchscreens-work
          BAREEQ_TTS_MAX_MISSING_ARTICLES_PER_BUILD: '1'
          BAREEQ_GEMINI_MAX_REQUESTS_PER_BUILD: '12'
          GEMINI_TTS_MAX_REQUEST_BYTES: '5500'
          BAREEQ_GEMINI_FREE_ROLLOUT: '0'
          BAREEQ_CLOUD_TTS_ACTIVATE: '0'
        run: |
          npm run build
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          for(const file of ['public/audio/articles/de93f3d9f91c8b8b/manifest.json','dist/audio/articles/de93f3d9f91c8b8b/manifest.json']){
            const m=JSON.parse(await readFile(file,'utf8')); const q=m.automatedTranscriptReview;
            if(m.provider!=='Google Gemini API'||m.model!=='gemini-2.5-flash-preview-tts'||m.defaultVoice!=='sadaltager') throw new Error(`${file}: Gemini 2.5 Flash cache not preserved`);
            if(q?.status!=='passed'||q?.transcriptionPasses!==2||q?.wordErrorCountAcrossAllPasses!==0||q?.substitutions!==0||q?.deletions!==0||q?.insertions!==0) throw new Error(`${file}: zero-error seal missing`);
          }
          console.log('PRODUCTION_BUILD_PRESERVED_VERIFIED_GEMINI25=PASS');
          NODE

      - name: Push tested release to main
        if: steps.completeness.outputs.complete == 'true'
        run: |
          git config user.name 'bareeq-audio-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/generate-audio.mjs public/audio/articles/de93f3d9f91c8b8b/
          git diff --cached --quiet && { echo '::error::No release delta to publish'; exit 3; }
          git commit -m 'audio: publish zero-error Gemini 2.5 Flash Sadaltager touchscreen article'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "PUBLISHED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record published main SHA
        if: steps.completeness.outputs.complete == 'true'
        run: echo "PUBLISHED_MAIN_SHA=$PUBLISHED_MAIN_SHA"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini25flash-touchscreen-publication-${{ github.run_id }}
          path: |
            scripts/speech-test-evidence/how-touchscreens-work-gemini25flash-full-v1.mp3
            scripts/speech-transcript-evidence/how-touchscreens-work-gemini25flash-full-v1.json
            public/audio/articles/de93f3d9f91c8b8b/manifest.json
          if-no-files-found: ignore
          retention-days: 30
