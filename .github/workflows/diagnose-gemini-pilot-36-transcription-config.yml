name: Diagnose pilot word with Gemini 3.6 ASR config

on:
  push:
    branches:
      - audio/fahed-v4220
    paths:
      - .github/workflows/diagnose-gemini-pilot-36-transcription-config.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Extract disputed audio region without reference text
        run: |
          ffmpeg -hide_banner -loglevel error \
            -ss 70.862 -to 100.080 \
            -i scripts/speech-test-evidence/how-touchscreens-work-gemini-pilot-v1.mp3 \
            -map_metadata -1 -vn -ac 1 -ar 48000 -c:a libmp3lame -b:a 96k \
            /tmp/disputed-region.mp3
          sha256sum /tmp/disputed-region.mp3

      - name: Require encrypted Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY"

      - name: Run two audio-only deterministic ASR diagnostics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > /tmp/asr-diagnose.mjs <<'JS'
          import { readFile } from 'node:fs/promises';

          const key = process.env.GEMINI_API_KEY?.trim();
          if (!key) throw new Error('GEMINI_API_KEY missing');
          const audio = await readFile('/tmp/disputed-region.mp3');
          const prompt = `Transcribe the attached Arabic speech verbatim. Use the audio as the only source. Do not repair grammar, infer missing endings, summarize, paraphrase, or add commentary. Return only the spoken words in their original order.`;

          function extractText(payload) {
            if (typeof payload?.output_text === 'string') return payload.output_text;
            const texts = [];
            for (const step of (payload?.steps || [])) {
              for (const block of (step?.content || [])) {
                if (block?.type === 'text' && typeof block.text === 'string') texts.push(block.text);
              }
            }
            return texts.join('');
          }

          for (const seed of [11031, 22061]) {
            const response = await fetch('https://generativelanguage.googleapis.com/v1beta/interactions', {
              method: 'POST',
              headers: {
                'x-goog-api-key': key,
                'Api-Revision': '2026-05-20',
                'Content-Type': 'application/json',
                Accept: 'application/json',
              },
              body: JSON.stringify({
                model: 'gemini-3.6-flash',
                input: [
                  { type: 'text', text: prompt },
                  { type: 'audio', data: audio.toString('base64'), mime_type: 'audio/mp3' },
                ],
                generation_config: {
                  temperature: 0,
                  seed,
                  thinking_level: 'minimal',
                  transcription_config: {
                    language_codes: ['ar'],
                    timestamp_granularities: ['word'],
                  },
                },
                store: false,
              }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Gemini ASR diagnostic failed (${response.status}): ${body.slice(0, 800)}`);
            const payload = JSON.parse(body);
            console.log(`DIAGNOSTIC_${seed}_BEGIN`);
            console.log(extractText(payload).trim());
            console.log(`DIAGNOSTIC_${seed}_END`);
            const wordInfo = [];
            for (const step of (payload?.steps || [])) {
              for (const block of (step?.content || [])) {
                for (const annotation of (block?.annotations || [])) {
                  if (annotation?.type === 'word_info') wordInfo.push(annotation);
                }
              }
            }
            console.log(`WORD_INFO_${seed}=${JSON.stringify(wordInfo)}`);
          }
          JS
          node /tmp/asr-diagnose.mjs
