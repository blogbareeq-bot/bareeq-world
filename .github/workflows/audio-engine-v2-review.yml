name: Audio Engine 2.0 review

on:
  pull_request:
    paths:
      - 'scripts/audio-*.mjs'
      - 'scripts/audio-pronunciation-lexicon.json'
      - 'scripts/test-audio-*.mjs'
      - 'docs/audio/AUDIO-ENGINE-2-WORK-REVIEW.md'
      - '.github/workflows/audio-engine-v2-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BAREEQ_TTS_ENGINE: gemini
      BAREEQ_LOCAL_TTS_ENABLE: '0'
      BAREEQ_LOCAL_ASR_PREFLIGHT: '0'
      BAREEQ_SEGMENT_CACHE_ENABLE: '0'
      BAREEQ_AUDIO_ENGINE_V2_PUBLISH: '0'
      BAREEQ_CLOUD_TTS_ACTIVATE: '0'
      BAREEQ_GEMINI_FREE_ROLLOUT: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Dependency security patch rehearsal
        run: |
          npm install astro@7.2.8 sharp@0.35.4 --save-exact
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); console.log(JSON.stringify({metadata:r.metadata?.vulnerabilities||{}, vulnerabilities:r.vulnerabilities||{}}, null, 2))"
          rm -f npm-audit.json

      - name: Capture patched dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: audio-v2-patched-dependencies
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Syntax
        run: |
          node --check scripts/audio-engine-config.mjs
          node --check scripts/audio-arabic-normalizer.mjs
          node --check scripts/audio-local-transport.mjs
          node --check scripts/audio-engine-router.mjs
          node --check scripts/audio-segment-cache.mjs
          node --check scripts/audio-local-asr-preflight.mjs
          node --check scripts/audio-split.mjs
          node --check scripts/audio-checkpoint.mjs
          node --check scripts/audio-generate-candidate.mjs
          node --check scripts/audio-production.mjs
          node --check scripts/audio-validate.mjs
          node --check scripts/audio-manifest.mjs
          node --check scripts/audio-merge.mjs
          node --check scripts/audio-asr-transcribe.mjs
          node --check scripts/test-audio-engine-v2.mjs
          node --check scripts/test-audio-engine-v2-hardening.mjs
          node --check scripts/test-audio-production-safety.mjs
          node --check scripts/test-audio-production-integration.mjs
          node --check scripts/test-audio-engine-final.mjs

      - name: Audio Engine 2.0 offline contract
        run: |
          node scripts/test-audio-engine-v2.mjs
          node scripts/test-audio-engine-v2-hardening.mjs

      - name: Existing audio safety regression
        run: |
          node scripts/test-audio-lifecycle.mjs
          node scripts/test-audio-production-safety.mjs
          node scripts/test-audio-production-integration.mjs
          node scripts/test-audio-engine-final.mjs
          node scripts/test-audio-transition-normalization.mjs
          node scripts/test-audio-dual-asr-adjudicate.mjs
          node scripts/test-audio-segment-repair.mjs
          node scripts/test-audio-daily-progressive.mjs
          node scripts/test-audio-ui-v4210.mjs

      - name: Prove no provider activation
        run: |
          test "$BAREEQ_LOCAL_TTS_ENABLE" = "0"
          test "$BAREEQ_LOCAL_ASR_PREFLIGHT" = "0"
          test "$BAREEQ_SEGMENT_CACHE_ENABLE" = "0"
          test "$BAREEQ_AUDIO_ENGINE_V2_PUBLISH" = "0"
