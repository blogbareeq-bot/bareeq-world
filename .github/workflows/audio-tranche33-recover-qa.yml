name: Bareeq tranche33 saved audio QA recovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audio-tranche33-recover-qa.yml'
      - 'scripts/audio-tranche33-restore.mjs'
      - 'scripts/audio-tranche33-review-pack.mjs'
permissions:
  contents: read
  actions: read
jobs:
  recover-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Install and verify the local ASR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install faster-whisper==1.2.0 requests numpy
          python -c 'from faster_whisper import WhisperModel'
      - name: Prove completed tranche and frozen TTS before recovery
        run: |
          node scripts/audio-tts-threshold-amendment.mjs
          node scripts/test-audio-tts-freeze-integration.mjs
          node --input-type=module -e "import {readThresholdAmendment} from './scripts/audio-tts-threshold-amendment.mjs';const r=await readThresholdAmendment();if(r.remaining!==0||r.amendment.authorizationStatus!=='CONSUMED')throw new Error('Only exhausted saved execution may be recovered');"
      - uses: actions/download-artifact@v4
        with:
          name: bareeq-tranche33-execution-37622809292
          path: execution-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '37622809292'
      - uses: actions/download-artifact@v4
        with:
          name: bareeq-gate5-passports-37581607040
          path: retained-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '37581607040'
      - uses: actions/download-artifact@v4
        with:
          name: bareeq-passports-retained-splice-37605942739
          path: passports-splice
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '37605942739'
      - name: Restore counted micro clips and their untouched original parts
        run: node scripts/audio-tranche33-restore.mjs
      - name: Resume local splice QA without synthesis
        run: python scripts/audio-tranche33-splice.py
      - name: Fresh full-file QA and independent ASR without TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/audio-tranche33-validate.mjs
      - name: Build compact bound review package
        run: node scripts/audio-tranche33-review-pack.mjs
      - name: Prove no publication or accounting mutation
        if: always()
        run: git diff --exit-code -- public/audio docs/audio/ENGINE-STRATEGY-STATE.json docs/audio/TTS-FREEZE.json docs/audio/TTS-THRESHOLD-AMENDMENT-33.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bareeq-tranche33-review-${{ github.run_id }}
          path: tranche33-review/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bareeq-tranche33-qa-recovery-${{ github.run_id }}
          path: |
            tranche33-execution/
            audio-candidates/
          retention-days: 90
          if-no-files-found: warn
