name: OpenRouter TTS smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify OpenRouter credential
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo 'OPENROUTER_API_KEY_PRESENT=no'
            exit 78
          fi
          echo 'OPENROUTER_API_KEY_PRESENT=yes'

      - name: Generate Sadaltager smoke sample
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          http_code=$(curl --silent --show-error \
            --output /tmp/bareeq-smoke.pcm \
            --write-out '%{http_code}' \
            --request POST 'https://openrouter.ai/api/v1/audio/speech' \
            --header "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            --header 'Content-Type: application/json' \
            --header 'Accept: audio/pcm' \
            --header 'HTTP-Referer: https://bareeqworld.com' \
            --header 'X-Title: Bareeq' \
            --data '{"model":"google/gemini-3.1-flash-tts-preview","input":"بريق، نافذتك إلى المعرفة.","voice":"Sadaltager","response_format":"pcm"}')
          echo "OPENROUTER_HTTP_STATUS=${http_code}"
          if [ "${http_code}" != '200' ]; then
            echo 'OpenRouter smoke generation failed; response follows with credentials redacted by GitHub.'
            cat /tmp/bareeq-smoke.pcm
            exit 1
          fi
          bytes=$(wc -c < /tmp/bareeq-smoke.pcm)
          echo "OPENROUTER_PCM_BYTES=${bytes}"
          test "${bytes}" -gt 100
          remainder=$((bytes % 2))
          test "${remainder}" -eq 0
          echo 'OPENROUTER_SADALTAGER_SMOKE=PASS'
