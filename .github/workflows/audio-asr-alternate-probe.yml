name: Bareeq alternate ASR model probe

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BAREEQ_AUDIO_CAMPAIGN_ID: sadaltager-openrouter-20260901-v1
      BAREEQ_CACHE_PREFIX: bareeq-audio-openrouter-sadaltager-v1-fd324708b4e4f0da2119e4490945aa9a98700d6e7b71e140c9d84a87716959da-
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Restore candidate checkpoint
        uses: actions/cache/restore@v4
        with:
          path: audio-candidates
          key: bareeq-asr-probe-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.BAREEQ_CACHE_PREFIX }}
      - name: Probe alternate audio-capable models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { uploadAudioFile } from './scripts/audio-asr-transcribe.mjs';
          import { deleteUploadedFile } from './scripts/audio-files-api.mjs';
          const apiKey = process.env.GEMINI_API_KEY;
          if (!apiKey) throw new Error('GEMINI_API_KEY missing');
          const state = JSON.parse(await fs.readFile(path.join('audio-candidates','_campaigns',process.env.BAREEQ_AUDIO_CAMPAIGN_ID,'state.json'),'utf8'));
          const articleId = 'ai-as-coworker-future-of-human-work';
          const fp = state.articles[articleId].generation.fingerprint;
          const dir = path.join('audio-candidates', articleId, fp);
          const files = await fs.readdir(dir);
          const partName = files.filter((x) => x.endsWith('.mp3') && x !== 'full.mp3').sort()[0] || 'full.mp3';
          const bytes = await fs.readFile(path.join(dir, partName));
          console.log(`ASR_PROBE_AUDIO=${partName} bytes=${bytes.length}`);
          const uploaded = await uploadAudioFile({ apiKey, bytes, displayName: `bareeq-asr-probe-${Date.now()}.mp3` });
          const models = ['gemini-3.5-flash','gemini-3.5-flash-lite','gemini-2.5-flash'];
          try {
            for (const model of models) {
              const response = await fetch('https://generativelanguage.googleapis.com/v1beta/interactions', {
                method: 'POST',
                headers: {
                  'x-goog-api-key': apiKey,
                  'Api-Revision': '2026-05-20',
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                },
                body: JSON.stringify({
                  model,
                  input: [
                    { type: 'text', text: 'Transcribe this Arabic audio verbatim. Return only the spoken words.' },
                    { type: 'audio', uri: uploaded.uri, mime_type: uploaded.mimeType },
                  ],
                }),
              });
              const text = await response.text();
              let payload = null;
              try { payload = JSON.parse(text); } catch {}
              const output = payload?.output_text || '';
              const err = payload?.error?.message || '';
              console.log(`ASR_MODEL_PROBE model=${model} http=${response.status} outputChars=${output.length} error=${String(err).slice(0,180)}`);
            }
          } finally {
            if (uploaded?.name) await deleteUploadedFile({ apiKey, name: uploaded.name }).catch(() => null);
          }
          NODE
