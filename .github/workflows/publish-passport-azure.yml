name: Publish passport with temporary Azure Hamed audio

on:
  push:
    branches:
      - release/v4.21.5-rc
    paths:
      - .github/workflows/publish-passport-azure.yml

permissions:
  contents: write

concurrency:
  group: v4215-passport-azure-publish
  cancel-in-progress: false

jobs:
  generate-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout verified V4.21.5 release candidate
        uses: actions/checkout@v4
        with:
          ref: release/v4.21.5-rc
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Azure secret and locked draft
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ]; then
            echo "::error::AZURE_SPEECH_KEY repository secret is unavailable."
            exit 2
          fi
          node scripts/prepare-v4215.mjs
          grep -q '^draft: true$' src/content/posts/why-some-passports-are-stronger.md
          test ! -e public/audio/articles/34e34b6f4633d928/manifest.json
          echo "Azure secret available; locked V4.21.5 draft verified."

      - name: Publish article locally for targeted synthesis
        run: |
          sed -i '0,/^draft: true$/s//draft: false/' src/content/posts/why-some-passports-are-stronger.md
          grep -q '^draft: false$' src/content/posts/why-some-passports-are-stronger.md

      - name: Plan temporary Hamed generation without API use
        env:
          BAREEQ_TTS_PROVIDER: azure
          BAREEQ_AZURE_HAMED_ONLY: "1"
          BAREEQ_TTS_INCLUDE_IDS: why-some-passports-are-stronger
        run: node scripts/generate-audio.mjs --plan

      - name: Generate temporary Azure Hamed audio
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_MONTHLY_USED_CHARS: ${{ vars.AZURE_SPEECH_MONTHLY_USED_CHARS }}
          BAREEQ_TTS_PROVIDER: azure
          BAREEQ_AZURE_HAMED_ONLY: "1"
          BAREEQ_TTS_INCLUDE_IDS: why-some-passports-are-stronger
          BAREEQ_TTS_MAX_MISSING_ARTICLES_PER_BUILD: "1"
        run: node scripts/generate-audio.mjs

      - name: Validate Hamed manifest, MP3 files, and synchronization
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, stat } from 'node:fs/promises';
          import path from 'node:path';
          import { mp3DurationSeconds } from './scripts/mp3-duration.mjs';

          const root = 'public/audio/articles/34e34b6f4633d928';
          const manifest = JSON.parse(await readFile(path.join(root, 'manifest.json'), 'utf8'));
          if (manifest.articleId !== 'why-some-passports-are-stronger') throw new Error('articleId mismatch');
          if (manifest.provider !== 'Microsoft Azure AI Speech') throw new Error(`provider mismatch: ${manifest.provider}`);
          if (manifest.model !== 'Neural TTS' || manifest.language !== 'ar-SA') throw new Error('Azure model/language mismatch');
          if (manifest.defaultVoice !== 'hamed') throw new Error(`voice mismatch: ${manifest.defaultVoice}`);
          if (!Array.isArray(manifest.voices) || manifest.voices.length !== 1 || manifest.voices[0]?.providerVoice !== 'ar-SA-HamedNeural') {
            throw new Error('The temporary fallback must contain Hamed only.');
          }
          if (!Array.isArray(manifest.parts) || !manifest.parts.length) throw new Error('No audio parts.');
          const syncIds = new Set();
          let duration = 0;
          for (const part of manifest.parts) {
            if (!Array.isArray(part?.sync) || !part.sync.length) throw new Error('Missing sync entries.');
            for (const entry of part.sync) {
              if (!entry?.id || syncIds.has(entry.id)) throw new Error(`invalid/duplicate sync id: ${entry?.id}`);
              syncIds.add(entry.id);
            }
            const asset = part.audio?.hamed;
            if (!asset?.src) throw new Error('Missing Hamed asset.');
            const local = path.join('public', asset.src.replace(/^\//, ''));
            const info = await stat(local);
            if (!info.isFile() || info.size !== asset.bytes || info.size < 100) throw new Error(`size mismatch: ${asset.src}`);
            const bytes = await readFile(local);
            if (asset.sha256 && createHash('sha256').update(bytes).digest('hex') !== asset.sha256) throw new Error(`SHA mismatch: ${asset.src}`);
            const measured = mp3DurationSeconds(bytes);
            if (!(asset.durationSeconds > 0) || Math.abs(measured - asset.durationSeconds) > 0.1) throw new Error(`duration mismatch: ${asset.src}`);
            duration += asset.durationSeconds;
          }
          if (syncIds.size !== 81) throw new Error(`sync count mismatch: ${syncIds.size}`);
          console.log(`Validated temporary Azure Hamed audio: ${manifest.parts.length} MP3 part(s), 81 sync blocks, ${duration.toFixed(2)} seconds.`);
          NODE

      - name: Run Arabic speech QA with article published
        run: node scripts/check-arabic-speech.mjs

      - name: Run complete V4.21.5 production build without further synthesis
        env:
          BAREEQ_GEMINI_FREE_ROLLOUT: "0"
          BAREEQ_CLOUD_TTS_ACTIVATE: "0"
        run: npm run build

      - name: Confirm final temporary publication state
        run: |
          grep -q '^draft: false$' src/content/posts/why-some-passports-are-stronger.md
          test -f public/audio/articles/34e34b6f4633d928/manifest.json
          node scripts/check-v4215-release.mjs

      - name: Commit verified article and temporary audio
        shell: bash
        run: |
          git config user.name 'bareeq-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/content/posts/why-some-passports-are-stronger.md
          git add package-lock.json scripts/speech-review.json scripts/check-audio-dist.mjs
          git add -f public/audio/articles/34e34b6f4633d928/
          unexpected=$(git status --porcelain | awk '{print $2}' | grep -Ev '^(src/content/posts/why-some-passports-are-stronger\.md|package-lock\.json|scripts/speech-review\.json|scripts/check-audio-dist\.mjs|public/audio/articles/34e34b6f4633d928/)' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected changes after verified Azure publication:"
            echo "$unexpected"
            exit 1
          fi
          git diff --cached --quiet && { echo "::error::No verified publication changes to commit."; exit 1; }
          git commit -m 'release: publish passport article with temporary Azure Hamed audio'
          git push origin HEAD:release/v4.21.5-rc
