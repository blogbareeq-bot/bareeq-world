name: Bareeq audio PR dry-run

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: bareeq-audio-pr-dry-run-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BAREEQ_AUDIO_CAMPAIGN_ID: sadaltager-openrouter-20260901-v1
      BAREEQ_AUDIO_PUBLISHED_MARKER: docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json
      BAREEQ_AUDIO_COMPLETE_ARTIFACT_ID: '9812647428'
      BAREEQ_AUDIO_COMPLETE_ARTIFACT_SHA256: 13e207fd041669345a8ab841aab026ff3f25050d74c423f71297ddacb0ac3fdd
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Offline audio safety gates
        run: |
          node scripts/test-audio-lifecycle.mjs
          node scripts/test-audio-production-safety.mjs
          node scripts/test-audio-production-integration.mjs
          node scripts/test-speech-script-quality-gate.mjs
          node scripts/check-speech-scripts.mjs
          node scripts/test-audio-engine-final.mjs
          node scripts/test-audio-transition-normalization.mjs
          node scripts/test-audio-dual-asr-adjudicate.mjs
          node scripts/test-gemini-generate-content-tts.mjs
          node --check scripts/audio-openrouter-tts.mjs
          node --check scripts/audio-openrouter-campaign.mjs
          node scripts/audio-inventory.mjs

      - name: Detect already-published campaign tree
        id: campaign
        run: |
          if [ -f "${BAREEQ_AUDIO_PUBLISHED_MARKER}" ]; then
            echo 'published=yes' >> "$GITHUB_OUTPUT"
            echo 'PUBLISHED_TREE_MARKER=present'
          else
            echo 'published=no' >> "$GITHUB_OUTPUT"
            echo 'PUBLISHED_TREE_MARKER=absent'
          fi

      - name: Verify already-published tree marker
        if: steps.campaign.outputs.published == 'yes'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const marker = JSON.parse(fs.readFileSync(process.env.BAREEQ_AUDIO_PUBLISHED_MARKER, 'utf8'));
          if (marker.campaignId !== 'sadaltager-openrouter-20260901-v1') throw new Error('wrong campaign marker');
          if (marker.articleCount !== 15 || !Array.isArray(marker.articles) || marker.articles.length !== 15) throw new Error('published marker is not 15/15');
          for (const item of marker.articles) {
            if (!/^[a-f0-9]{64}$/.test(item.fingerprint || '')) throw new Error(`bad fingerprint ${item.articleId}`);
            if (!/^[a-f0-9]{64}$/.test(item.fullSha256 || '')) throw new Error(`bad full SHA ${item.articleId}`);
            const key = crypto.createHash('sha256').update(item.articleId).digest('hex').slice(0, 16);
            const manifest = path.join('public', 'audio', 'articles', key, 'manifest.json');
            if (!fs.existsSync(manifest)) throw new Error(`missing live manifest ${item.articleId}`);
            const payload = JSON.parse(fs.readFileSync(manifest, 'utf8'));
            if (payload.fingerprint !== item.fingerprint || payload.fullSha256 !== item.fullSha256) throw new Error(`live manifest mismatch ${item.articleId}`);
          }
          console.log('PUBLISHED_TREE_LOCAL_VERIFY=PASS articles=15');
          NODE

      - name: Verify provider credentials
        if: steps.campaign.outputs.published != 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo 'GEMINI_API_KEY_PRESENT=no'
            exit 78
          fi
          echo 'GEMINI_API_KEY_PRESENT=yes'
          echo 'OPENROUTER_TTS_REQUIRED=no_complete_15_of_15_artifact'

      - name: Restore OpenRouter campaign checkpoint
        id: cache
        if: steps.campaign.outputs.published != 'yes'
        uses: actions/cache/restore@v4
        with:
          path: audio-candidates
          key: bareeq-audio-openrouter-sadaltager-v1-${{ hashFiles('scripts/audio-openrouter-tts.mjs', 'scripts/audio-openrouter-campaign.mjs', 'scripts/audio-constants.mjs', 'scripts/audio-split.mjs', 'scripts/speech-scripts/**') }}-${{ github.run_id }}-${{ github.run_attempt }}-restore
          restore-keys: |
            bareeq-audio-openrouter-sadaltager-v1-${{ hashFiles('scripts/audio-openrouter-tts.mjs', 'scripts/audio-openrouter-campaign.mjs', 'scripts/audio-constants.mjs', 'scripts/audio-split.mjs', 'scripts/speech-scripts/**') }}-

      - name: Inspect restored campaign checkpoint
        id: restored
        if: steps.campaign.outputs.published != 'yes'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const statePath = path.join('audio-candidates', '_campaigns', process.env.BAREEQ_AUDIO_CAMPAIGN_ID, 'state.json');
          let complete = false;
          try {
            const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
            const articles = Object.entries(state.articles || {});
            complete = state.generationComplete === true
              && articles.length === 15
              && articles.every(([articleId, item]) => item.generation?.status === 'generated'
                && /^[a-f0-9]{64}$/.test(item.generation?.fingerprint || '')
                && fs.existsSync(path.join('audio-candidates', articleId, item.generation.fingerprint, 'generation-report.json')));
          } catch {}
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `complete=${complete ? 'yes' : 'no'}\n`);
          console.log(`RESTORED_GENERATION_15_OF_15=${complete ? 'yes' : 'no'}`);
          NODE

      - name: Restore pinned complete 15/15 campaign artifact
        if: steps.campaign.outputs.published != 'yes' && steps.restored.outputs.complete != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/bareeq-sadaltager-15-of-15.zip"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BAREEQ_AUDIO_COMPLETE_ARTIFACT_ID}/zip" > "${archive}"
          printf '%s  %s\n' "${BAREEQ_AUDIO_COMPLETE_ARTIFACT_SHA256}" "${archive}" | sha256sum --check --strict
          rm -rf audio-candidates
          mkdir -p audio-candidates
          unzip -q "${archive}" -d audio-candidates
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const statePath = path.join('audio-candidates', '_campaigns', process.env.BAREEQ_AUDIO_CAMPAIGN_ID, 'state.json');
          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          const articles = Object.entries(state.articles || {});
          if (state.generationComplete !== true || articles.length !== 15
            || articles.some(([articleId, item]) => item.generation?.status !== 'generated'
              || !/^[a-f0-9]{64}$/.test(item.generation?.fingerprint || '')
              || !fs.existsSync(path.join('audio-candidates', articleId, item.generation.fingerprint, 'generation-report.json')))) {
            throw new Error('Pinned artifact is not a complete 15/15 generated campaign.');
          }
          console.log('PINNED_GENERATION_ARTIFACT=PASS articles=15');
          NODE

      - name: Inspect targeted pronunciation correction
        id: pronunciation
        if: steps.campaign.outputs.published != 'yes'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const articleId = 'ai-agents-future-now';
          const statePath = path.join('audio-candidates', '_campaigns', process.env.BAREEQ_AUDIO_CAMPAIGN_ID, 'state.json');
          const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
          const fingerprint = state.articles?.[articleId]?.generation?.fingerprint;
          if (!/^[a-f0-9]{64}$/.test(fingerprint || '')) throw new Error('targeted correction candidate fingerprint is missing');
          const checkpointPath = path.join('audio-candidates', articleId, fingerprint, 'checkpoint.json');
          const checkpoint = JSON.parse(fs.readFileSync(checkpointPath, 'utf8'));
          const targets = [1, 6];
          const isCorrected = (part) => {
            const record = checkpoint.completedParts?.[String(part - 1)];
            return record?.targetedRegeneration === true
              && record?.correctionHintApplied === true
              && record?.transport === 'developer-generate-content';
          };
          const pending = targets.filter((part) => !isCorrected(part));
          const corrected = pending.length === 0;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `applied=${corrected ? 'yes' : 'no'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `parts=${pending.join(',')}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `count=${pending.length}\n`);
          console.log(`TARGETED_PRONUNCIATION_CORRECTION=${corrected ? 'present' : 'required'} pending=${pending.join(',') || 'none'}`);
          NODE

      - name: Regenerate only pending confirmed pronunciation parts
        if: steps.campaign.outputs.published != 'yes' && steps.pronunciation.outputs.applied != 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BAREEQ_AUDIO_PRODUCTION_LOCK: '1'
          BAREEQ_GEMINI_GENERATE_CONTENT: '1'
          BAREEQ_FORCE_TTS_PARTS: ${{ steps.pronunciation.outputs.parts }}
          EXPECTED_TTS_REQUESTS: ${{ steps.pronunciation.outputs.count }}
          BAREEQ_TTS_CORRECTION_HINTS_JSON: >-
            {"1":"At the phrase «والصلاحيات، لا الاسم المكتوب على المنتج», preserve «لا» and «الاسم» as two exact consecutive tokens with a brief natural boundary. Do not insert an extra «ل» and do not change «الاسم» to «للاسم» or «لاسم».","6":"At the phrase «الوكلاء الأذكياء ليسوا شاتًا أقوى فقط», pronounce the written fatḥ tanween in «شاتًا» clearly and completely. Do not drop the final /an/ and do not change it to «شات»."}
        run: |
          node scripts/audio-production.mjs --mode=generate-candidate --article=ai-agents-future-now
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const articleId = 'ai-agents-future-now';
          const state = JSON.parse(fs.readFileSync(path.join('audio-candidates', '_campaigns', process.env.BAREEQ_AUDIO_CAMPAIGN_ID, 'state.json'), 'utf8'));
          const fingerprint = state.articles[articleId].generation.fingerprint;
          const checkpoint = JSON.parse(fs.readFileSync(path.join('audio-candidates', articleId, fingerprint, 'checkpoint.json'), 'utf8'));
          const report = JSON.parse(fs.readFileSync(path.join('audio-candidates', articleId, fingerprint, 'generation-report.json'), 'utf8'));
          const corrected = [1, 6].every((part) => {
            const record = checkpoint.completedParts?.[String(part - 1)];
            return record?.targetedRegeneration === true
              && record?.correctionHintApplied === true
              && record?.transport === 'developer-generate-content';
          });
          if (!corrected) throw new Error('targeted pronunciation parts are not both corrected in the checkpoint');
          if (!(report.transportsUsed || []).includes('developer-generate-content')) throw new Error('targeted correction did not use direct Gemini generateContent');
          const expected = Number(process.env.EXPECTED_TTS_REQUESTS);
          if (report.ttsRequestsSent !== expected || report.providerAttempts !== expected) throw new Error('targeted correction sent an unexpected number of TTS requests');
          console.log(`TARGETED_PRONUNCIATION_REGENERATION=PASS requests=${expected} model=gemini-3.1-flash-tts-preview voice=Sadaltager`);
          NODE

      - name: Verify restored 15/15 generation without TTS calls
        if: steps.campaign.outputs.published != 'yes'
        run: |
          node scripts/audio-openrouter-campaign.mjs --mode=generate
          echo 'OPENROUTER_GENERATION_EXIT_STATUS=0'
          echo 'OPENROUTER_TTS_REQUESTS_SENT=0'

      - name: Save generation checkpoint
        if: always() && steps.campaign.outputs.published != 'yes'
        uses: actions/cache/save@v4
        with:
          path: audio-candidates
          key: bareeq-audio-openrouter-sadaltager-v1-${{ hashFiles('scripts/audio-openrouter-tts.mjs', 'scripts/audio-openrouter-campaign.mjs', 'scripts/audio-constants.mjs', 'scripts/audio-split.mjs', 'scripts/speech-scripts/**') }}-${{ github.run_id }}-${{ github.run_attempt }}-generated

      - name: Validate all candidates with technical QA and independent dual ASR
        if: steps.campaign.outputs.published != 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          node scripts/audio-openrouter-campaign.mjs --mode=validate
          status=$?
          set -e
          echo "OPENROUTER_VALIDATION_EXIT_STATUS=${status}"
          exit "$status"

      - name: Save validated checkpoint
        if: always() && steps.campaign.outputs.published != 'yes'
        uses: actions/cache/save@v4
        with:
          path: audio-candidates
          key: bareeq-audio-openrouter-sadaltager-v1-${{ hashFiles('scripts/audio-openrouter-tts.mjs', 'scripts/audio-openrouter-campaign.mjs', 'scripts/audio-constants.mjs', 'scripts/audio-split.mjs', 'scripts/speech-scripts/**') }}-${{ github.run_id }}-${{ github.run_attempt }}-validated

      - name: Publish validated candidates into PR tree
        if: steps.campaign.outputs.published != 'yes'
        run: |
          node scripts/audio-openrouter-campaign.mjs --mode=publish
          test -f "${BAREEQ_AUDIO_PUBLISHED_MARKER}"
          echo 'OPENROUTER_PUBLICATION_TREE=PASS'

      - name: Save publication checkpoint
        if: always() && steps.campaign.outputs.published != 'yes'
        uses: actions/cache/save@v4
        with:
          path: audio-candidates
          key: bareeq-audio-openrouter-sadaltager-v1-${{ hashFiles('scripts/audio-openrouter-tts.mjs', 'scripts/audio-openrouter-campaign.mjs', 'scripts/audio-constants.mjs', 'scripts/audio-split.mjs', 'scripts/speech-scripts/**') }}-${{ github.run_id }}-${{ github.run_attempt }}-published

      - name: Commit validated audio tree to PR branch
        if: steps.campaign.outputs.published != 'yes'
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'bareeq-audio'
          git config user.email 'audio@bareeq.local'
          git add -f public/audio docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json docs/audio/PUBLICATION-POLICY-20260901.json
          if git diff --cached --quiet; then
            echo 'PUBLISHED_AUDIO_COMMIT=no_changes'
          else
            git commit -m 'audio: publish validated Sadaltager corpus via OpenRouter'
            git push origin "HEAD:${PR_BRANCH}"
            echo 'PUBLISHED_AUDIO_COMMIT=pushed'
          fi

      - name: Upload all OpenRouter Sadaltager candidates
        if: always() && steps.campaign.outputs.published != 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: bareeq-openrouter-sadaltager-candidates
          path: audio-candidates/
          if-no-files-found: warn
          retention-days: 90
