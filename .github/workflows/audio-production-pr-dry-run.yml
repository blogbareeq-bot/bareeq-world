name: Bareeq audio PR dry-run

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bareeq-audio-pr-dry-run-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BAREEQ_CLOUD_TTS_ACTIVATE: '0'
      BAREEQ_GEMINI_FREE_ROLLOUT: '0'
      BAREEQ_AUDIO_MODE: dry-run
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Offline audio safety gates
        run: |
          node scripts/test-audio-lifecycle.mjs
          node scripts/test-audio-production-safety.mjs
          node scripts/test-audio-production-integration.mjs
          node scripts/test-speech-script-quality-gate.mjs
          node scripts/check-speech-scripts.mjs
          node scripts/test-audio-engine-final.mjs
          node scripts/test-audio-transition-normalization.mjs

      - name: Production dry-run (zero provider calls)
        run: |
          node scripts/audio-inventory.mjs
          node scripts/audio-production.mjs --mode=dry-run
          test -f docs/audio/DRY-RUN.json
          echo 'PASS: dry-run completed with synthesis disabled.'

      - name: Check Gemini production secret presence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${GEMINI_API_KEY}" ]; then
            echo 'GEMINI_API_KEY_PRESENT=yes'
          else
            echo 'GEMINI_API_KEY_PRESENT=no'
          fi

      - name: Restore first-candidate cache
        if: hashFiles('docs/audio/RUN-ALTADAKHOM-GENERATION') != ''
        uses: actions/cache/restore@v4
        with:
          path: audio-candidates
          key: bareeq-audio-candidate-altadakhom-${{ hashFiles('scripts/audio-constants.mjs', 'scripts/audio-split.mjs', 'scripts/speech-scripts/**') }}
          restore-keys: |
            bareeq-audio-candidate-altadakhom-

      - name: Generate first candidate only
        if: hashFiles('docs/audio/RUN-ALTADAKHOM-GENERATION') != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BAREEQ_AUDIO_PRODUCTION_LOCK: '1'
        run: |
          set +e
          node scripts/audio-production.mjs --mode=generate-candidate --article=altadakhom-explained-simply
          status=$?
          set -e
          echo "GENERATION_EXIT_STATUS=${status}"
          exit "$status"

      - name: Save first-candidate cache
        if: always() && hashFiles('docs/audio/RUN-ALTADAKHOM-GENERATION') != ''
        uses: actions/cache/save@v4
        with:
          path: audio-candidates
          key: bareeq-audio-candidate-altadakhom-${{ hashFiles('scripts/audio-constants.mjs', 'scripts/audio-split.mjs', 'scripts/speech-scripts/**') }}-${{ github.run_id }}

      - name: Upload first-candidate artifact
        if: always() && hashFiles('docs/audio/RUN-ALTADAKHOM-GENERATION') != ''
        uses: actions/upload-artifact@v4
        with:
          name: altadakhom-candidate-${{ github.run_id }}
          path: audio-candidates/
          if-no-files-found: warn

      - name: Restore generated candidate for validation
        if: hashFiles('docs/audio/RUN-ALTADAKHOM-VALIDATION') != ''
        uses: actions/cache/restore@v4
        with:
          path: audio-candidates
          key: bareeq-audio-candidate-altadakhom-${{ hashFiles('scripts/audio-constants.mjs', 'scripts/audio-split.mjs', 'scripts/speech-scripts/**') }}
          restore-keys: |
            bareeq-audio-candidate-altadakhom-

      - name: Validate first candidate only
        if: hashFiles('docs/audio/RUN-ALTADAKHOM-VALIDATION') != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/audio-production.mjs --mode=validate-candidate --article=altadakhom-explained-simply --fingerprint=ceed158f32e7db07f15f9c40c1248efe7bfed7627539d812033581f7d6baf5e4

      - name: Save validated candidate cache
        if: always() && hashFiles('docs/audio/RUN-ALTADAKHOM-VALIDATION') != ''
        uses: actions/cache/save@v4
        with:
          path: audio-candidates
          key: bareeq-audio-validated-altadakhom-${{ hashFiles('scripts/audio-constants.mjs', 'scripts/audio-split.mjs', 'scripts/speech-scripts/**') }}-${{ github.run_id }}

      - name: Upload validated candidate artifact
        if: always() && hashFiles('docs/audio/RUN-ALTADAKHOM-VALIDATION') != ''
        uses: actions/upload-artifact@v4
        with:
          name: altadakhom-validated-${{ github.run_id }}
          path: audio-candidates/
          if-no-files-found: error
