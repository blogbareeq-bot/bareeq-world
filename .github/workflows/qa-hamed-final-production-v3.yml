name: QA final Hamed production candidate v3
on:
  push:
    branches:
      - audio/fahed-v4220
    paths:
      - .github/workflows/qa-hamed-final-production-v3.yml
      - scripts/verify-hamed-final-production-v3.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/fahed-v4220
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Check resumable verifier syntax
        run: node --check scripts/verify-hamed-final-production-v3.mjs
      - name: Continue exact QA with Gemini 3.6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QA_MODELS: gemini-3.6-flash
          QA_MAX_NEW_LEXICAL_ATTEMPTS: '1'
        run: node scripts/verify-hamed-final-production-v3.mjs
      - name: Persist every QA checkpoint
        if: always()
        run: |
          git config user.name bareeq-audio-bot
          git config user.email actions@users.noreply.github.com
          test ! -f scripts/speech-transcript-evidence/how-touchscreens-work-hamed-final-production-v3.json || git add scripts/speech-transcript-evidence/how-touchscreens-work-hamed-final-production-v3.json
          test ! -f scripts/speech-test-evidence/how-touchscreens-work-hamed-final-production-v3.json || git add scripts/speech-test-evidence/how-touchscreens-work-hamed-final-production-v3.json
          test ! -f public/audio/articles/de93f3d9f91c8b8b/manifest.json || git add -f public/audio/articles/de93f3d9f91c8b8b/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'audio: checkpoint resumable Hamed exact QA'
            git pull --rebase origin audio/fahed-v4220
            git push origin HEAD:audio/fahed-v4220
          fi
      - name: Report exact checkpoint progress
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='scripts/speech-transcript-evidence/how-touchscreens-work-hamed-final-production-v3.json';
          if(!fs.existsSync(p)) throw new Error('QA checkpoint was not written');
          const r=JSON.parse(fs.readFileSync(p));
          console.log(`HAMED_QA_PROGRESS=${r.selectedExactPasses||0}/${r.requiredExactPasses||20} (${r.progressPercent||0}%) status=${r.status}`);
          if(r.status==='passed') console.log('HAMED_QA_ALL_EXACT=PASS');
          NODE
