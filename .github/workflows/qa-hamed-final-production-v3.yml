name: QA final Hamed production candidate v3
on:
  push:
    branches:
      - audio/fahed-v4220
    paths:
      - .github/workflows/qa-hamed-final-production-v3.yml
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/fahed-v4220
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify ten immutable parts with Gemini 3.5 and 3.6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/verify-hamed-final-production-v3.mjs
      - name: Persist QA report and seal when exact
        if: always()
        run: |
          git config user.name bareeq-audio-bot
          git config user.email actions@users.noreply.github.com
          test ! -f scripts/speech-transcript-evidence/how-touchscreens-work-hamed-final-production-v3.json || git add scripts/speech-transcript-evidence/how-touchscreens-work-hamed-final-production-v3.json
          git add public/audio/articles/de93f3d9f91c8b8b/manifest.json
          git add scripts/speech-test-evidence/how-touchscreens-work-hamed-final-production-v3.json
          if ! git diff --cached --quiet; then
            git commit -m 'audio: persist final Hamed cross-model QA'
            git pull --rebase origin audio/fahed-v4220
            git push origin HEAD:audio/fahed-v4220
          fi
      - name: Enforce cross-model zero-error gate
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('scripts/speech-transcript-evidence/how-touchscreens-work-hamed-final-production-v3.json'));
          if(r.status!=='passed'||r.partCount!==10||r.selectedExactPasses!==20||r.selectedWordErrorCount!==0||r.selectedSubstitutions!==0||r.selectedDeletions!==0||r.selectedInsertions!==0||r.failedModelParts.length!==0) throw new Error(`Final cross-model gate rejected: ${r.status}`);
          const m=JSON.parse(fs.readFileSync('public/audio/articles/de93f3d9f91c8b8b/manifest.json'));
          if(m.verifiedStaticAudio!==true||m.automatedTranscriptReview?.status!=='passed'||m.automatedTranscriptReview?.exactModelPassesPerPart!==2||m.automatedTranscriptReview?.partCount!==10) throw new Error('Sealed production manifest is missing.');
          console.log(`FINAL_HAMED_ZERO_ERROR_GATE=PASS words=${r.expectedWordCount} sha=${r.audioSha256}`);
          NODE
