name: Probe audio provider credentials safely

on:
  push:
    branches: [audio/fahed-v4220]
    paths: [.github/workflows/probe-audio-provider-credentials.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report credential presence only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_ACCESS_TOKEN: ${{ secrets.GOOGLE_CLOUD_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: |
          node - <<'NODE'
          for (const name of ['GEMINI_API_KEY','GOOGLE_SERVICE_ACCOUNT_JSON','GOOGLE_CLOUD_ACCESS_TOKEN','OPENAI_API_KEY','AZURE_SPEECH_KEY']) {
            console.log(`${name}=${process.env[name] ? 'PRESENT' : 'ABSENT'}`)
          }
          NODE
