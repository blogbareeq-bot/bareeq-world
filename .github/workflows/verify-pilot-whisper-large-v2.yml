name: Verify pilot with Whisper large-v2

on:
  push:
    branches: [audio/fahed-v4220]
    paths: [.github/workflows/verify-pilot-whisper-large-v2.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install 'faster-whisper==1.2.0' 'requests>=2.32,<3'
      - name: Extract immutable silence-safe chunks
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const a=fs.readFileSync('scripts/speech-test-evidence/how-touchscreens-work-gemini-pilot-v1.mp3');
          if(crypto.createHash('sha256').update(a).digest('hex')!=='e04466b4824db92821488b1fd2ee848e3312fded968a89ff91fdb97f1b15550e') throw new Error('Pilot SHA changed.');
          NODE
          mkdir -p /tmp/w
          FFMPEG_PATH="$(node -p "require('@ffmpeg-installer/ffmpeg').path")"
          for spec in '1 0 29.298' '2 29.298 53.971' '3 53.971 83.173' '4 83.173 93.744'; do set -- $spec; "$FFMPEG_PATH" -hide_banner -loglevel error -ss "$2" -to "$3" -i scripts/speech-test-evidence/how-touchscreens-work-gemini-pilot-v1.mp3 -vn -ac 1 -ar 16000 -c:a pcm_s16le "/tmp/w/$1.wav"; done
      - name: Audio-only transcription
        run: |
          cat >/tmp/w/t.py <<'PY'
          from faster_whisper import WhisperModel
          m=WhisperModel('large-v2',device='cpu',compute_type='int8',cpu_threads=4)
          out=[]
          for i in range(1,5):
              seg,_=m.transcribe(f'/tmp/w/{i}.wav',language='ar',beam_size=5,best_of=5,temperature=0.0,condition_on_previous_text=False,vad_filter=False)
              t=' '.join(x.text.strip() for x in seg).strip(); print(f'CHUNK_{i}={t}'); out.append(t)
          open('/tmp/w/transcript.txt','w',encoding='utf8').write(' '.join(out).strip())
          PY
          python /tmp/w/t.py
      - name: Exact comparator
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import {compareArabicTranscripts} from './scripts/arabic-transcript-match.mjs';
          const s=JSON.parse(fs.readFileSync('scripts/speech-scripts/how-touchscreens-work.json','utf8')); const m=JSON.parse(fs.readFileSync('scripts/speech-test-evidence/how-touchscreens-work-gemini-pilot-v1.json','utf8')); const map=new Map(s.segments.map(x=>[x.segmentId,x]));
          const e=m.selectedSegmentIds.map(id=>map.get(id).spokenText).join('\n\n'); const a=fs.readFileSync('/tmp/w/transcript.txt','utf8'); const c=compareArabicTranscripts(e,a);
          fs.writeFileSync('/tmp/w/report.json',JSON.stringify({schema:'bareeq.local-whisper-verification.v1',model:'large-v2',audioSha256:m.sha256,expectedWordCount:c.expectedWordCount,actualWordCount:c.actualWordCount,exact:c.exact,wordErrorCount:c.wordErrorCount,substitutions:c.substitutions,deletions:c.deletions,insertions:c.insertions,differences:c.operations,transcript:a},null,2));
          console.log(JSON.stringify({expected:c.expectedWordCount,actual:c.actualWordCount,errors:c.wordErrorCount,differences:c.operations.slice(0,20)}));
          if(!c.exact||c.expectedWordCount!==160) process.exit(1); console.log('WHISPER_LARGE_V2_EXACT_160_OF_160=PASS');
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisper-large-v2-pilot-${{ github.run_id }}
          path: /tmp/w/report.json
          if-no-files-found: ignore
          retention-days: 14
