name: Generate Gemini pronunciation sample

on:
  push:
    branches:
      - audio/fahed-v4220
    paths:
      - .github/workflows/generate-gemini-pronunciation-sample.yml
      - scripts/generate-gemini-pronunciation-sample.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemini-pronunciation-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify generator and approved Speech Script
        run: |
          node --check scripts/generate-gemini-pronunciation-sample.mjs
          node scripts/check-speech-scripts.mjs

      - name: Require encrypted Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY repository secret is unavailable."
            exit 2
          fi

      - name: Generate Sadaltager pronunciation sample
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-gemini-pronunciation-sample.mjs

      - name: Commit immutable Gemini listening evidence
        run: |
          git config user.name 'bareeq-audio-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f scripts/speech-test-evidence/how-touchscreens-work-gemini-bibasaata-v1.mp3 scripts/speech-test-evidence/how-touchscreens-work-gemini-bibasaata-v1.json
          git diff --cached --quiet && { echo 'Gemini pronunciation evidence is already current.'; exit 0; }
          git commit -m 'audio: generate Gemini pronunciation sample'
          git push origin HEAD:${{ github.ref_name }}
