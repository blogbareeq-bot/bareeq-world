name: Verify hardened Gemini 2.5 Flash TTS pilot v2

on:
  push:
    branches: [audio/fahed-v4220]
    paths: [.github/workflows/verify-gemini-25flash-pilot-v2-exact.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Lock speech contracts
        run: |
          node scripts/test-arabic-transcript-match.mjs
          node scripts/check-speech-scripts.mjs
          node scripts/verify-cross-model-pilot-evidence.mjs
      - name: Generate isolated hardened 2.5 Flash pilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY"
          cp scripts/generate-gemini-pronunciation-sample.mjs scripts/.generate-25flash-v2.mjs
          node - <<'NODE'
          const fs=require('node:fs');const p='scripts/.generate-25flash-v2.mjs';let s=fs.readFileSync(p,'utf8');
          const once=(a,b,l)=>{const n=s.split(a).length-1;if(n!==1)throw new Error(`${l}: expected 1, got ${n}`);s=s.replace(a,b)};
          once("const MODEL = 'gemini-3.1-flash-tts-preview';","const MODEL = 'gemini-2.5-flash-preview-tts';",'model');
          once("? `${ARTICLE_ID}-gemini-pilot-v1`","? `${ARTICLE_ID}-gemini-25flash-pilot-v2`",'basename');
          once('const MAX_RETRIES = 5;','const MAX_RETRIES = 1;','retries');
          once('Preserve every Arabic word and diacritic; add, omit, paraphrase, and reorder nothing.', 'When the transcript reaches لَيْسَ, pronounce it exactly as “laysa”, with no final t sound. Never change it to لَيْسَتْ or لَيْسَت.\nPreserve every Arabic word and diacritic; add, omit, paraphrase, and reorder nothing.', 'laysa pronunciation guard');
          fs.writeFileSync(p,s);
          NODE
          node --check scripts/.generate-25flash-v2.mjs
          node scripts/.generate-25flash-v2.mjs --pilot
          rm -f scripts/.generate-25flash-v2.mjs
      - name: Run both independent ASR models and require both exact
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';import {readFile,writeFile} from 'node:fs/promises';import {compareArabicTranscripts,ARABIC_TRANSCRIPT_COMPARISON_PROFILE} from './scripts/arabic-transcript-match.mjs';
          const sha=v=>createHash('sha256').update(v).digest('hex');const base='how-touchscreens-work-gemini-25flash-pilot-v2';const meta=JSON.parse(await readFile(`scripts/speech-test-evidence/${base}.json`,'utf8'));const audio=await readFile(`scripts/speech-test-evidence/${base}.mp3`);const script=JSON.parse(await readFile('scripts/speech-scripts/how-touchscreens-work.json','utf8'));if(meta.model!=='gemini-2.5-flash-preview-tts'||meta.sha256!==sha(audio))throw new Error('v2 identity mismatch');const map=new Map(script.segments.map(x=>[x.segmentId,x]));const expected=meta.selectedSegmentIds.map(id=>map.get(id)?.spokenText||'').join('\n\n');if(sha(expected)!==meta.transcriptHash)throw new Error('transcript hash mismatch');
          const tests=[['gemini-3.5-flash','استمع إلى التسجيل المرفق وحوّل الكلام المسموع إلى نص عربي حرفي كامل. اكتب فقط ما تسمعه وبالترتيب نفسه. لا تصحح ولا تضف ولا تعتمد على أي نص خارجي. لا حاجة إلى التشكيل أو الترقيم. أعد transcript فقط وفق JSON.'],['gemini-3.6-flash','Produce a verbatim Arabic transcript of the attached audio, using audio as the only source. Include every audible word once and in order. Do not repair, infer, paraphrase, summarize, or add commentary. Diacritics and punctuation are optional. Return transcript only in the requested JSON schema.']];
          const extract=p=>{if(typeof p?.output_text==='string')return p.output_text;if(typeof p?.outputText==='string')return p.outputText;const o=[];for(const c of [p?.steps,p?.outputs].filter(Array.isArray))for(const i of c)for(const b of (Array.isArray(i?.content)?i.content:[]))if(b?.type==='text'&&typeof b.text==='string')o.push(b.text);return o.join('')};const passes=[];
          for(const [model,prompt] of tests){let pass={model,promptSha256:sha(prompt),available:false,exact:false};try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{method:'POST',headers:{'x-goog-api-key':process.env.GEMINI_API_KEY,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({model,input:[{type:'text',text:prompt},{type:'audio',data:audio.toString('base64'),mime_type:'audio/mp3'}],response_format:{type:'text',mime_type:'application/json',schema:{type:'object',properties:{transcript:{type:'string'}},required:['transcript']}},store:false})});const body=await r.text();if(!r.ok){pass.httpStatus=r.status;pass.error=body.slice(0,700);passes.push(pass);console.log(`${model} unavailable HTTP ${r.status}`);continue}const tr=JSON.parse(extract(JSON.parse(body)).trim()).transcript?.trim();const c=compareArabicTranscripts(expected,tr);pass={...pass,available:true,transcript:tr,transcriptSha256:sha(tr),normalizedTranscript:c.actualNormalized,normalizedTranscriptSha256:sha(c.actualNormalized),exact:c.exact,expectedWordCount:c.expectedWordCount,actualWordCount:c.actualWordCount,wordErrorCount:c.wordErrorCount,substitutions:c.substitutions,deletions:c.deletions,insertions:c.insertions,differences:c.operations.slice(0,50)};passes.push(pass);console.log(`${model}: expected=${c.expectedWordCount} actual=${c.actualWordCount} errors=${c.wordErrorCount} ${JSON.stringify(c.operations.slice(0,5))}`)}catch(e){pass.error=String(e?.message||e).slice(0,700);passes.push(pass)}}
          const exact=passes.filter(p=>p.available&&p.exact&&p.expectedWordCount===160&&p.wordErrorCount===0);const report={schema:'bareeq.cross-model-tts-pilot-verification.v1',status:exact.length===2?'passed':'failed',articleId:'how-touchscreens-work',ttsProvider:'Google Gemini API',ttsModel:'gemini-2.5-flash-preview-tts',ttsVoice:'Sadaltager',audioFile:`scripts/speech-test-evidence/${base}.mp3`,audioSha256:sha(audio),audioBytes:audio.length,expectedTranscriptSha256:sha(expected),expectedWordCount:160,successfulIndependentPasses:exact.length,wordErrorCountAcrossSelectedPasses:exact.reduce((s,p)=>s+p.wordErrorCount,0),expectedTextDisclosure:'ASR received audio and generic transcription instructions only; pronunciation guards were used only during TTS generation.',comparisonProfile:ARABIC_TRANSCRIPT_COMPARISON_PROFILE,passes,verifiedAt:new Date().toISOString()};await writeFile('scripts/speech-transcript-evidence/how-touchscreens-work-gemini-25flash-pilot-v2-cross-model.json',JSON.stringify(report,null,2)+'\n');if(exact.length!==2)throw new Error(`2.5 Flash v2 rejected: only ${exact.length}/2 independent exact pass(es)`);console.log('GEMINI_25FLASH_V2_EXACT_TWO_MODEL=PASS');
          NODE
      - name: Upload all v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-25flash-v2-${{ github.run_id }}
          path: |
            scripts/speech-test-evidence/how-touchscreens-work-gemini-25flash-pilot-v2.mp3
            scripts/speech-test-evidence/how-touchscreens-work-gemini-25flash-pilot-v2.json
            scripts/speech-transcript-evidence/how-touchscreens-work-gemini-25flash-pilot-v2-cross-model.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit only on two-model exact pass
        if: success()
        run: |
          git config user.name 'bareeq-audio-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f scripts/speech-test-evidence/how-touchscreens-work-gemini-25flash-pilot-v2.mp3
          git add scripts/speech-test-evidence/how-touchscreens-work-gemini-25flash-pilot-v2.json scripts/speech-transcript-evidence/how-touchscreens-work-gemini-25flash-pilot-v2-cross-model.json
          git commit -m 'audio: approve hardened Gemini 2.5 Flash pilot at zero errors'
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
