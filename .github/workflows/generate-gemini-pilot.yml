name: Generate reviewed Gemini pilot clip

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemini-pilot-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify generator and approved Speech Script
        run: |
          node --check scripts/generate-gemini-pronunciation-sample.mjs
          node scripts/check-speech-scripts.mjs

      - name: Require encrypted Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY repository secret is unavailable."
            exit 2
          fi

      - name: Generate six-segment Sadaltager pilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-gemini-pronunciation-sample.mjs --pilot

      - name: Commit immutable Gemini pilot evidence
        run: |
          git config user.name 'bareeq-audio-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f scripts/speech-test-evidence/how-touchscreens-work-gemini-pilot-v1.mp3 scripts/speech-test-evidence/how-touchscreens-work-gemini-pilot-v1.json
          git diff --cached --quiet && { echo 'Gemini pilot evidence is already current.'; exit 0; }
          git commit -m 'audio: generate reviewed Gemini pilot clip'
          git push origin HEAD:${{ github.ref_name }}
