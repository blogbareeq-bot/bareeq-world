name: Verify corrected Hamed pilot with Gemini 3.6

on:
  push:
    branches: [audio/fahed-v4220]
    paths: [.github/workflows/verify-hamed-case-pilot-36.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/fahed-v4220
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Generate corrected Hamed pilot
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
        run: |
          cp scripts/generate-fahed-test-clip.mjs scripts/.hamed-case-pilot36.mjs
          node - <<'NODE'
          const fs=require('node:fs');const p='scripts/.hamed-case-pilot36.mjs';let s=fs.readFileSync(p,'utf8');
          const once=(a,b,l)=>{const n=s.split(a).length-1;if(n!==1)throw new Error(`${l}:${n}`);s=s.replace(a,b)};
          once("const VOICE = 'ar-KW-FahedNeural';","const VOICE = 'ar-SA-HamedNeural';",'voice');
          once("const LANGUAGE = 'ar-KW';","const LANGUAGE = 'ar-SA';",'lang');
          once("const RATE = process.env.AZURE_SPEECH_SYNTHESIS_RATE?.trim() || '-2%';","const RATE = process.env.AZURE_SPEECH_SYNTHESIS_RATE?.trim() || '0%';",'rate');
          once("const basename = `${ARTICLE_ID}-fahed-v1`;","const basename = `${ARTICLE_ID}-hamed-case36-pilot-v1`;",'basename');
          once("return { type: record.type, text: record.spokenText, segmentId };",`let text=record.spokenText;
            const fixes=[
              ['بِبَسَاطَة:', 'بِبَسَاطَةٍ:'],
              ['أَقْطَابِ الشَّبَكَة.', 'أَقْطَابِ الشَّبَكَةِ.'],
              ['عَلَى الشَّاشَة.', 'عَلَى الشَّاشَةِ.'],
              ['عَادَةً «الشَّاشَة» لَيْسَ طَبَقَةً وَاحِدَة.', 'عَادَةً «الشَّاشَةَ» لَيْسَ طَبَقَةً وَاحِدَةً.'],
              ['عَلَى الشَّاشَة،', 'عَلَى الشَّاشَةِ،'],
              ['مِنَ الشَّبَكَة.', 'مِنَ الشَّبَكَةِ.'],
              ['تَكْبِيرَ الصُّورَة،', 'تَكْبِيرَ الصُّورَةِ،'],
              ['تَحْرِيكَ خَرِيطَة.', 'تَحْرِيكَ خَرِيطَةٍ.']
            ];
            for(const [a,b] of fixes) text=text.split(a).join(b);
            return { type: record.type, text, segmentId };`,'case fixes');
          fs.writeFileSync(p,s);
          NODE
          node scripts/.hamed-case-pilot36.mjs --article=how-touchscreens-work
          rm scripts/.hamed-case-pilot36.mjs
      - name: Verify exact transcript with Gemini 3.6
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';import {compareArabicTranscripts} from './scripts/arabic-transcript-match.mjs';
          const audio=await readFile('scripts/speech-test-evidence/how-touchscreens-work-hamed-case36-pilot-v1.mp3');
          const meta=JSON.parse(await readFile('scripts/speech-test-evidence/how-touchscreens-work-hamed-case36-pilot-v1.json','utf8'));
          const script=JSON.parse(await readFile('scripts/speech-scripts/how-touchscreens-work.json','utf8'));const map=new Map(script.segments.map(x=>[x.segmentId,x]));const expected=meta.selectedSegmentIds.map(id=>map.get(id)?.spokenText||'').join('\n\n');
          const prompt='Produce a verbatim Arabic transcript of the attached audio using audio as the only source. Write every audible word exactly once and in order. Do not infer, repair, summarize, paraphrase, omit, or add commentary. Diacritics and punctuation are optional. Return only transcript in the requested JSON schema.';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));let r,body='';for(let a=0;a<6;a++){r=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{method:'POST',headers:{'x-goog-api-key':process.env.GEMINI_API_KEY,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({model:'gemini-3.6-flash',input:[{type:'text',text:prompt},{type:'audio',data:audio.toString('base64'),mime_type:'audio/mp3'}],response_format:{type:'text',mime_type:'application/json',schema:{type:'object',properties:{transcript:{type:'string'}},required:['transcript']}},store:false})});body=await r.text();if(r.ok)break;if(r.status!==429)throw new Error(`ASR ${r.status}: ${body.slice(0,800)}`);const sec=Number(body.match(/retry in ([0-9.]+)s/i)?.[1]||45);console.log(`ASR36_WAIT=${Math.ceil(sec)+2}s`);await sleep((Math.ceil(sec)+2)*1000);}if(!r?.ok)throw new Error(`ASR36 retries exhausted: ${body.slice(0,800)}`);
          const p=JSON.parse(body);const text=typeof p.output_text==='string'?p.output_text:(p.steps||p.outputs||[]).flatMap(x=>x.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');const transcript=JSON.parse(text.trim()).transcript.trim();const c=compareArabicTranscripts(expected,transcript);console.log(`HAMED_CASE_36 expected=${c.expectedWordCount} actual=${c.actualWordCount} errors=${c.wordErrorCount}`);console.log('HAMED_CASE_36_DIFF='+JSON.stringify(c.operations));console.log('HAMED_CASE_36_TRANSCRIPT='+transcript);if(!c.exact)throw new Error('Corrected Hamed pilot is not exact under Gemini 3.6');console.log('HAMED_CASE_36_EXACT=PASS');
          NODE
