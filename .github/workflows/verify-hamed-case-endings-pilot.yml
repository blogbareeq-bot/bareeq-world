name: Verify Hamed pilot with grammatical case endings

on:
  push:
    branches: [audio/fahed-v4220]
    paths: [.github/workflows/verify-hamed-case-endings-pilot.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/fahed-v4220
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Generate Hamed pilot with grammar-preserving audible endings
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
        run: |
          cp scripts/generate-fahed-test-clip.mjs scripts/.hamed-case-pilot.mjs
          node - <<'NODE'
          const fs=require('node:fs');const p='scripts/.hamed-case-pilot.mjs';let s=fs.readFileSync(p,'utf8');
          const once=(a,b,l)=>{const n=s.split(a).length-1;if(n!==1)throw new Error(`${l}:${n}`);s=s.replace(a,b)};
          once("const VOICE = 'ar-KW-FahedNeural';","const VOICE = 'ar-SA-HamedNeural';",'voice');once("const LANGUAGE = 'ar-KW';","const LANGUAGE = 'ar-SA';",'lang');once("const RATE = process.env.AZURE_SPEECH_SYNTHESIS_RATE?.trim() || '-2%';","const RATE = process.env.AZURE_SPEECH_SYNTHESIS_RATE?.trim() || '0%';",'rate');once("const basename = `${ARTICLE_ID}-fahed-v1`;","const basename = `${ARTICLE_ID}-hamed-case-pilot-v1`;",'basename');
          once("return { type: record.type, text: record.spokenText, segmentId };",`let text=record.spokenText;\n  const fixes=[\n    ['بِبَسَاطَة:', 'بِبَسَاطَةٍ:'],\n    ['أَقْطَابِ الشَّبَكَة.', 'أَقْطَابِ الشَّبَكَةِ.'],\n    ['عَلَى الشَّاشَة.', 'عَلَى الشَّاشَةِ.'],\n    ['عَادَةً «الشَّاشَة» لَيْسَ طَبَقَةً وَاحِدَة.', 'عَادَةً «الشَّاشَةَ» لَيْسَ طَبَقَةً وَاحِدَةً.'],\n    ['عَلَى الشَّاشَة،', 'عَلَى الشَّاشَةِ،'],\n    ['مِنَ الشَّبَكَة.', 'مِنَ الشَّبَكَةِ.'],\n    ['تَكْبِيرَ الصُّورَة،', 'تَكْبِيرَ الصُّورَةِ،'],\n    ['تَحْرِيكَ خَرِيطَة.', 'تَحْرِيكَ خَرِيطَةٍ.']\n  ];\n  for(const [a,b] of fixes) text=text.split(a).join(b);\n  return { type: record.type, text, segmentId };`,'case fixes');fs.writeFileSync(p,s);
          NODE
          node scripts/.hamed-case-pilot.mjs --article=how-touchscreens-work
          rm scripts/.hamed-case-pilot.mjs
      - name: Require two exact audio-only ASR passes with quota-aware retry
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';import {createHash} from 'node:crypto';import {compareArabicTranscripts} from './scripts/arabic-transcript-match.mjs';const sha=v=>createHash('sha256').update(v).digest('hex'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const audio=await readFile('scripts/speech-test-evidence/how-touchscreens-work-hamed-case-pilot-v1.mp3');const meta=JSON.parse(await readFile('scripts/speech-test-evidence/how-touchscreens-work-hamed-case-pilot-v1.json','utf8'));const script=JSON.parse(await readFile('scripts/speech-scripts/how-touchscreens-work.json','utf8'));const map=new Map(script.segments.map(x=>[x.segmentId,x]));const expected=meta.selectedSegmentIds.map(id=>map.get(id)?.spokenText||'').join('\n\n');const prompts=['استمع إلى التسجيل المرفق وحوّل الكلام المسموع إلى نص عربي حرفي كامل. اكتب الكلمات التي تسمعها فقط وبالترتيب نفسه. لا تلخص ولا تصحح ولا تضف شيئًا ولا تعتمد على نص خارجي. أعد transcript فقط.','Produce a verbatim Arabic transcript of the attached audio using audio as the only source. Write every audible word once and in order. Do not infer, repair, summarize, paraphrase, omit, or add commentary. Return transcript only.'];
          async function tx(prompt){let r,body='';for(let a=0;a<6;a++){r=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{method:'POST',headers:{'x-goog-api-key':process.env.GEMINI_API_KEY,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({model:'gemini-3.5-flash',input:[{type:'text',text:prompt},{type:'audio',data:audio.toString('base64'),mime_type:'audio/mp3'}],response_format:{type:'text',mime_type:'application/json',schema:{type:'object',properties:{transcript:{type:'string'}},required:['transcript']}},store:false})});body=await r.text();if(r.ok)break;if(r.status!==429)throw new Error(`ASR ${r.status}:${body.slice(0,700)}`);const sec=Number(body.match(/retry in ([0-9.]+)s/i)?.[1]||45);console.log(`ASR_WAIT=${Math.ceil(sec)+2}s`);await sleep((Math.ceil(sec)+2)*1000);}if(!r?.ok)throw new Error('ASR quota retries exhausted');const p=JSON.parse(body),text=typeof p.output_text==='string'?p.output_text:(p.steps||p.outputs||[]).flatMap(x=>x.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');return JSON.parse(text.trim()).transcript.trim();}
          const passes=[];for(let i=0;i<2;i++){const transcript=await tx(prompts[i]);const c=compareArabicTranscripts(expected,transcript);console.log(`HAMED_CASE_PASS_${i+1}: expected=${c.expectedWordCount} actual=${c.actualWordCount} errors=${c.wordErrorCount}`);console.log(`DIFF_${i+1}=${JSON.stringify(c.operations)}`);passes.push({pass:i+1,transcript,exact:c.exact,expectedWordCount:c.expectedWordCount,actualWordCount:c.actualWordCount,wordErrorCount:c.wordErrorCount,substitutions:c.substitutions,deletions:c.deletions,insertions:c.insertions,differences:c.operations});}
          const passed=passes.every(p=>p.exact&&p.wordErrorCount===0);const report={status:passed?'passed':'failed',articleId:'how-touchscreens-work',ttsProvider:'Microsoft Azure AI Speech',ttsVoice:'ar-SA-HamedNeural',audioFile:'scripts/speech-test-evidence/how-touchscreens-work-hamed-case-pilot-v1.mp3',audioSha256:sha(audio),expectedWordCount:160,passes};await writeFile('scripts/speech-transcript-evidence/how-touchscreens-work-hamed-case-pilot-v1.json',JSON.stringify(report,null,2)+'\n');if(!passed)throw new Error('Hamed case-ending pilot did not reach exact zero errors');console.log('HAMED_CASE_PILOT_ZERO_ERROR=PASS');
          NODE
      - name: Commit passing Hamed case-ending pilot
        if: success()
        run: |
          git config user.name 'bareeq-audio-bot';git config user.email 'actions@users.noreply.github.com'
          git add scripts/speech-test-evidence/how-touchscreens-work-hamed-case-pilot-v1.* scripts/speech-transcript-evidence/how-touchscreens-work-hamed-case-pilot-v1.json
          git commit -m 'audio: approve Hamed case-ending pilot at zero errors'
          git pull --rebase origin audio/fahed-v4220
          git push origin HEAD:audio/fahed-v4220
