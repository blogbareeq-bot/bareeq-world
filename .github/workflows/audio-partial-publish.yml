name: Bareeq daily progressive exact publish

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audio-partial-publish.yml'
      - 'scripts/audio-progressive-repair.mjs'
      - 'scripts/audio-segment-repair.mjs'
      - 'scripts/audio-normalize-parts.mjs'
      - 'scripts/audio-dual-asr-adjudicate.mjs'
      - 'scripts/audio-gemini-tts.mjs'
      - 'scripts/audio-progressive-status.mjs'
      - 'scripts/test-audio-daily-progressive.mjs'
      - 'scripts/test-audio-segment-repair.mjs'
      - 'scripts/test-audio-dual-asr-adjudicate.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-partial-publish.yml'
      - 'scripts/audio-progressive-repair.mjs'
      - 'scripts/audio-segment-repair.mjs'
      - 'scripts/audio-normalize-parts.mjs'
      - 'scripts/audio-dual-asr-adjudicate.mjs'
      - 'scripts/audio-gemini-tts.mjs'
      - 'scripts/audio-progressive-status.mjs'
      - 'scripts/test-audio-daily-progressive.mjs'
      - 'scripts/test-audio-segment-repair.mjs'
      - 'scripts/test-audio-dual-asr-adjudicate.mjs'
  # Gemini RPD resets at midnight Pacific. 08:20 UTC is safely after the
  # reset in both daylight-saving and standard time.
  schedule:
    - cron: '20 8 * * *'
    # GitHub may drop a scheduled event; an off-peak backup keeps the campaign
    # moving. The schedule gate below skips it when today's primary ran.
    - cron: '47 10 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: bareeq-daily-progressive-audio
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then
            echo 'should-run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const filename = 'docs/audio/PROGRESSIVE-STATUS.json';
          const status = fs.existsSync(filename) ? JSON.parse(fs.readFileSync(filename, 'utf8')) : {};
          // Primary and backup share a UTC date. A complete production run
          // writes a fresh status before pushing, including quota-only pauses.
          const today = new Date().toISOString().slice(0, 10);
          const alreadyRan = typeof status.generatedAt === 'string'
            && status.generatedAt.slice(0, 10) === today;
          process.stdout.write(`should-run=${!alreadyRan}\n`);
          console.error(`SCHEDULE_GATE date=${today} already-ran=${alreadyRan}`);
          NODE

  offline-gates:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify the daily coordinator without provider calls
        run: |
          node scripts/test-audio-daily-progressive.mjs
          node scripts/test-audio-dual-asr-adjudicate.mjs
          node scripts/test-audio-segment-repair.mjs
          node --check scripts/audio-progressive-repair.mjs
          node --check scripts/audio-gemini-tts.mjs

  repair-publish:
    needs: schedule-gate
    if: github.event_name != 'pull_request' && needs.schedule-gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BAREEQ_AUDIO_CAMPAIGN_ID: sadaltager-openrouter-20260901-v1
      # One-time bootstrap only. Every successful run restores the newest v2
      # cache instead of returning to this historical artifact.
      BAREEQ_BOOTSTRAP_RUN_ID: '33962242086'
      BAREEQ_BOOTSTRAP_ARTIFACT: bareeq-progressive-validation-33962242086
      BAREEQ_PARTIAL_MARKER: docs/audio/PUBLISHED-SADALTAGER-PARTIAL-20260903.json
      BAREEQ_STATUS_FILE: docs/audio/PROGRESSIVE-STATUS.json
      BAREEQ_REPAIR_MAX_REQUESTS: '10'
      BAREEQ_REPAIR_MAX_429_RETRIES: '2'
      # Finish the closest article before moving on. A rejected stochastic
      # trial restores the preserved baseline and may retry the same part.
      BAREEQ_REPAIR_MAX_ROUNDS_PER_ARTICLE: '2'
      BAREEQ_REPAIR_MAX_TRIALS_PER_PART: '2'
      # Temporarily leave this failed article on its existing live fallback;
      # do not classify, regenerate or spend TTS/ASR quota on it.
      BAREEQ_PROGRESSIVE_SKIP_ARTICLES: 'اعط-الصباح-فرصة-قراءة-في-كتاب-عبد-الوهاب-مطاوع'
      BAREEQ_AUDIO_PRODUCTION_LOCK: '1'
    steps:
      - name: Checkout current production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Offline safety gates
        run: |
          node scripts/test-audio-daily-progressive.mjs
          node scripts/test-audio-dual-asr-adjudicate.mjs
          node scripts/test-audio-segment-repair.mjs
          node --check scripts/audio-progressive-repair.mjs
          node --check scripts/audio-openrouter-campaign.mjs

      - name: Verify Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "${GEMINI_API_KEY}"
          echo 'GEMINI_CREDENTIAL=present'

      - name: Restore newest durable checkpoint
        id: checkpoint
        uses: actions/cache/restore@v4
        with:
          path: audio-candidates
          key: bareeq-audio-progressive-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bareeq-audio-progressive-v3-

      - name: Bootstrap from the latest preserved artifact once
        if: steps.checkpoint.outputs.cache-matched-key == ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BAREEQ_BOOTSTRAP_ARTIFACT }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BAREEQ_BOOTSTRAP_RUN_ID }}

      - name: Verify checkpoint and report resume source
        env:
          CACHE_KEY: ${{ steps.checkpoint.outputs.cache-matched-key }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const p = path.join('audio-candidates','_campaigns',process.env.BAREEQ_AUDIO_CAMPAIGN_ID,'state.json');
          const s = JSON.parse(fs.readFileSync(p,'utf8'));
          const rows = Object.values(s.articles || {});
          if (s.generationComplete !== true || rows.length !== 15 || rows.some((x) => x.generation?.status !== 'generated')) {
            throw new Error('checkpoint is not generation-complete 15/15');
          }
          const exact = rows.filter((x) => x.validation?.status === 'validated'
            && x.validation?.fingerprint === x.generation?.fingerprint
            && ['substitutions','deletions','insertions','unresolved'].every((k) => Number(x.validation?.consensus?.[k]) === 0));
          if (exact.length < 5) throw new Error(`checkpoint regressed below 5 exact articles: ${exact.length}`);
          console.log(`PROGRESSIVE_CHECKPOINT=PASS source=${process.env.CACHE_KEY || process.env.BAREEQ_BOOTSTRAP_RUN_ID} exact_before=${exact.length}/15`);
          NODE

      - name: Classify all pending audio, then repair the easiest failed parts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/audio-progressive-repair.mjs --max-articles=10 "--skip=${BAREEQ_PROGRESSIVE_SKIP_ARTICLES}"

      - name: Publish every newly exact article immediately
        run: |
          node scripts/audio-rebind-validated-metadata.mjs
          EXACT=$(node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const s = JSON.parse(fs.readFileSync(path.join('audio-candidates','_campaigns',process.env.BAREEQ_AUDIO_CAMPAIGN_ID,'state.json'),'utf8'));
          const exact = Object.values(s.articles || {}).filter((x) => x.validation?.status === 'validated'
            && x.validation?.fingerprint === x.generation?.fingerprint
            && ['substitutions','deletions','insertions','unresolved'].every((k) => Number(x.validation?.consensus?.[k]) === 0));
          process.stdout.write(String(exact.length));
          NODE
          )
          if [ "${EXACT}" -eq 15 ]; then
            node scripts/audio-openrouter-campaign.mjs --mode=publish
          else
            node scripts/audio-openrouter-campaign.mjs --mode=publish-current
          fi
          echo "PROGRESSIVE_PUBLICATION_GATE=PASS exact=${EXACT}/15"

      - name: Write durable per-article status
        env:
          BAREEQ_SOURCE_RUN_ID: ${{ github.run_id }}
          BAREEQ_SOURCE_ARTIFACT: bareeq-progressive-validation-${{ github.run_id }}
        run: node scripts/audio-progressive-status.mjs

      - name: Save newest checkpoint before git publication
        if: always()
        uses: actions/cache/save@v4
        with:
          path: audio-candidates
          key: bareeq-audio-progressive-v3-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload recovery evidence before git publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bareeq-progressive-validation-${{ github.run_id }}
          path: |
            audio-candidates/
            docs/audio/PUBLISHED-SADALTAGER-PARTIAL-20260903.json
            docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json
            docs/audio/PROGRESSIVE-STATUS.json
            public/audio/manifest.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit and publish progress to production
        run: |
          set -euo pipefail
          COUNT=$(node -p "JSON.parse(require('fs').readFileSync('docs/audio/PROGRESSIVE-STATUS.json','utf8')).exactCount")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/audio
          git add docs/audio/PUBLISHED-SADALTAGER-PARTIAL-20260903.json docs/audio/PROGRESSIVE-STATUS.json
          test ! -f docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json || git add docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json
          if git diff --cached --quiet; then
            echo "PROGRESSIVE_PUBLICATION_TREE=already-current exact=${COUNT}/15"
            exit 0
          fi
          git commit -m "audio: publish ${COUNT}/15 exact Sadaltager articles"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "PROGRESSIVE_PUBLICATION_TREE=pushed exact=${COUNT}/15"
