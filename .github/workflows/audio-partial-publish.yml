name: Bareeq daily progressive exact publish

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audio-partial-publish.yml'
      - 'scripts/audio-progressive-repair.mjs'
      - 'scripts/audio-segment-repair.mjs'
      - 'scripts/audio-micro-repair-preflight.mjs'
      - 'scripts/test-audio-micro-repair-preflight.mjs'
      - 'scripts/audio-normalize-parts.mjs'
      - 'scripts/audio-dual-asr-adjudicate.mjs'
      - 'scripts/audio-gemini-tts.mjs'
      - 'scripts/audio-progressive-status.mjs'
      - 'scripts/audio-repair-session-report.mjs'
      - 'scripts/audio-engine-strategy-guard.mjs'
      - 'scripts/audio-tts-freeze-guard.mjs'
      - 'scripts/audio-state-consistency.mjs'
      - 'scripts/test-audio-tts-freeze-guard.mjs'
      - 'scripts/test-audio-state-consistency.mjs'
      - 'docs/audio/TTS-FREEZE.json'
      - 'docs/audio/BAREEQ-AUDIO-RECOVERY-DECISION-v1.md'
      - 'scripts/test-audio-daily-progressive.mjs'
      - 'scripts/test-audio-segment-repair.mjs'
      - 'scripts/test-audio-dual-asr-adjudicate.mjs'
      - 'scripts/test-audio-engine-strategy-guard.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-partial-publish.yml'
      - 'scripts/audio-progressive-repair.mjs'
      - 'scripts/audio-segment-repair.mjs'
      - 'scripts/audio-micro-repair-preflight.mjs'
      - 'scripts/test-audio-micro-repair-preflight.mjs'
      - 'scripts/audio-normalize-parts.mjs'
      - 'scripts/audio-dual-asr-adjudicate.mjs'
      - 'scripts/audio-gemini-tts.mjs'
      - 'scripts/audio-progressive-status.mjs'
      - 'scripts/audio-repair-session-report.mjs'
      - 'scripts/audio-engine-strategy-guard.mjs'
      - 'scripts/audio-tts-freeze-guard.mjs'
      - 'scripts/audio-state-consistency.mjs'
      - 'scripts/test-audio-tts-freeze-guard.mjs'
      - 'scripts/test-audio-state-consistency.mjs'
      - 'docs/audio/TTS-FREEZE.json'
      - 'docs/audio/BAREEQ-AUDIO-RECOVERY-DECISION-v1.md'
      - 'scripts/test-audio-daily-progressive.mjs'
      - 'scripts/test-audio-segment-repair.mjs'
      - 'scripts/test-audio-dual-asr-adjudicate.mjs'
      - 'scripts/test-audio-engine-strategy-guard.mjs'
  # The dedicated dispatcher starts at 00:01 UTC after the observed Gemini
  # Free Tier reset. These are later direct fallbacks if that dispatch is lost.
  schedule:
    - cron: '31 0 * * *'
    - cron: '1 1 * * *'
  workflow_dispatch:
    inputs:
      only_article:
        description: 'Optional single article id for targeted post-reset recovery'
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: bareeq-daily-progressive-audio
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      target-article: ${{ steps.check.outputs.target-article }}
      verified-micro: ${{ steps.check.outputs.verified-micro }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: check
        env:
          BAREEQ_PROGRESSIVE_ONLY_ARTICLE: ${{ inputs.only_article || '' }}
        run: |
          if [ "${{ github.event_name }}" != schedule ] && [ "${{ github.event_name }}" != workflow_dispatch ]; then
            echo 'should-run=false' >> "$GITHUB_OUTPUT"
            echo 'target-article=' >> "$GITHUB_OUTPUT"
            echo 'verified-micro=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/audio-engine-strategy-guard.mjs --workflow-gate >> "$GITHUB_OUTPUT"

  offline-gates:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify the daily coordinator without provider calls
        run: |
          node scripts/test-audio-daily-progressive.mjs
          node scripts/test-audio-dual-asr-adjudicate.mjs
          node scripts/test-audio-segment-repair.mjs
          node scripts/test-audio-micro-repair-preflight.mjs
          node scripts/test-audio-engine-strategy-guard.mjs
          node scripts/test-audio-tts-freeze-guard.mjs
          node scripts/test-audio-state-consistency.mjs
          node scripts/audio-tts-freeze-guard.mjs --expect-frozen
          node scripts/audio-state-consistency.mjs
          node --check scripts/audio-progressive-repair.mjs
          node --check scripts/audio-gemini-tts.mjs
          node --check scripts/audio-repair-session-report.mjs
          node --check scripts/audio-engine-strategy-guard.mjs

  repair-publish:
    needs: schedule-gate
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.schedule-gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BAREEQ_AUDIO_CAMPAIGN_ID: sadaltager-openrouter-20260901-v1
      BAREEQ_BOOTSTRAP_RUN_ID: '33962242086'
      BAREEQ_BOOTSTRAP_ARTIFACT: bareeq-progressive-validation-33962242086
      BAREEQ_PARTIAL_MARKER: docs/audio/PUBLISHED-SADALTAGER-PARTIAL-20260903.json
      BAREEQ_STATUS_FILE: docs/audio/PROGRESSIVE-STATUS.json
      BAREEQ_REPAIR_MAX_REQUESTS: ${{ needs.schedule-gate.outputs.verified-micro == 'true' && '1' || '10' }}
      BAREEQ_REPAIR_MAX_429_RETRIES: '2'
      BAREEQ_REPAIR_MAX_ROUNDS_PER_ARTICLE: '1'
      BAREEQ_REPAIR_MAX_TRIALS_PER_PART: '1'
      BAREEQ_PROGRESSIVE_SKIP_ARTICLES: 'اعط-الصباح-فرصة-قراءة-في-كتاب-عبد-الوهاب-مطاوع'
      BAREEQ_PROGRESSIVE_ONLY_ARTICLE: ${{ needs.schedule-gate.outputs.target-article }}
      BAREEQ_REPAIR_REQUIRE_VERIFIED_MICRO: ${{ needs.schedule-gate.outputs.verified-micro == 'true' && '1' || '0' }}
      BAREEQ_AUDIO_PRODUCTION_LOCK: '1'
    steps:
      - name: Checkout current production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Offline safety gates
        run: |
          node scripts/test-audio-daily-progressive.mjs
          node scripts/test-audio-dual-asr-adjudicate.mjs
          node scripts/test-audio-segment-repair.mjs
          node scripts/test-audio-micro-repair-preflight.mjs
          node scripts/test-audio-engine-strategy-guard.mjs
          node --check scripts/audio-progressive-repair.mjs
          node --check scripts/audio-openrouter-campaign.mjs
          node --check scripts/audio-repair-session-report.mjs
          node --check scripts/audio-engine-strategy-guard.mjs

      - name: Verify Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "${GEMINI_API_KEY}"
          echo 'GEMINI_CREDENTIAL=present'
          echo 'BAREEQ_PROVIDER_CREDENTIAL_VERIFIED=1' >> "$GITHUB_ENV"

      - name: Restore newest durable checkpoint
        id: checkpoint
        uses: actions/cache/restore@v4
        with:
          path: audio-candidates
          key: bareeq-audio-progressive-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bareeq-audio-progressive-v3-

      - name: Bootstrap from the latest preserved artifact once
        if: steps.checkpoint.outputs.cache-matched-key == ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BAREEQ_BOOTSTRAP_ARTIFACT }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BAREEQ_BOOTSTRAP_RUN_ID }}

      - name: Verify checkpoint and report resume source
        env:
          CACHE_KEY: ${{ steps.checkpoint.outputs.cache-matched-key }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const p = path.join('audio-candidates','_campaigns',process.env.BAREEQ_AUDIO_CAMPAIGN_ID,'state.json');
          const s = JSON.parse(fs.readFileSync(p,'utf8'));
          const rows = Object.values(s.articles || {});
          if (s.generationComplete !== true || rows.length !== 15 || rows.some((x) => x.generation?.status !== 'generated')) {
            throw new Error('checkpoint is not generation-complete 15/15');
          }
          const exact = rows.filter((x) => x.validation?.status === 'validated'
            && x.validation?.fingerprint === x.generation?.fingerprint
            && ['substitutions','deletions','insertions','unresolved'].every((k) => Number(x.validation?.consensus?.[k]) === 0));
          if (exact.length < 5) throw new Error(`checkpoint regressed below 5 exact articles: ${exact.length}`);
          console.log(`PROGRESSIVE_CHECKPOINT=PASS source=${process.env.CACHE_KEY || process.env.BAREEQ_BOOTSTRAP_RUN_ID} exact_before=${exact.length}/15`);
          NODE

      - name: Mark repair session start
        run: echo "BAREEQ_REPAIR_SESSION_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Apply Gemini-only strategy guard
        run: |
          set -euo pipefail
          REMAINING=$(node scripts/audio-engine-strategy-guard.mjs --remaining)
          if [ "${REMAINING}" -le 0 ]; then
            EFFECTIVE=0
            echo 'GEMINI_STRATEGY_KILL_SWITCH=PAUSED'
          elif [ "${REMAINING}" -lt "${BAREEQ_REPAIR_MAX_REQUESTS}" ]; then
            EFFECTIVE="${REMAINING}"
          else
            EFFECTIVE="${BAREEQ_REPAIR_MAX_REQUESTS}"
          fi
          echo "BAREEQ_REPAIR_EFFECTIVE_MAX_REQUESTS=${EFFECTIVE}" >> "$GITHUB_ENV"
          echo "GEMINI_STRATEGY_ALLOWANCE remaining=${REMAINING} effectiveRunCap=${EFFECTIVE}"

      - name: Classify pending audio, then repair the selected safest target
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          ONLY_ARGS=()
          if [ -n "${BAREEQ_PROGRESSIVE_ONLY_ARTICLE:-}" ]; then
            ONLY_ARGS+=("--only=${BAREEQ_PROGRESSIVE_ONLY_ARTICLE}")
            echo "PROGRESSIVE_TARGETED_RECOVERY=${BAREEQ_PROGRESSIVE_ONLY_ARTICLE}"
          fi
          BAREEQ_REPAIR_MAX_REQUESTS="${BAREEQ_REPAIR_EFFECTIVE_MAX_REQUESTS}" \
            node scripts/audio-progressive-repair.mjs --max-articles=10 "--skip=${BAREEQ_PROGRESSIVE_SKIP_ARTICLES}" "${ONLY_ARGS[@]}" \
            | tee "$RUNNER_TEMP/bareeq-progressive-repair.log"

      - name: Publish every newly exact article immediately
        run: |
          node scripts/audio-rebind-validated-metadata.mjs
          EXACT=$(node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const s = JSON.parse(fs.readFileSync(path.join('audio-candidates','_campaigns',process.env.BAREEQ_AUDIO_CAMPAIGN_ID,'state.json'),'utf8'));
          const exact = Object.values(s.articles || {}).filter((x) => x.validation?.status === 'validated'
            && x.validation?.fingerprint === x.generation?.fingerprint
            && ['substitutions','deletions','insertions','unresolved'].every((k) => Number(x.validation?.consensus?.[k]) === 0));
          process.stdout.write(String(exact.length));
          NODE
          )
          if [ "${EXACT}" -eq 15 ]; then
            node scripts/audio-openrouter-campaign.mjs --mode=publish
          else
            node scripts/audio-openrouter-campaign.mjs --mode=publish-current
          fi
          echo "PROGRESSIVE_PUBLICATION_GATE=PASS exact=${EXACT}/15"

      - name: Write durable per-article status
        env:
          BAREEQ_SOURCE_RUN_ID: ${{ github.run_id }}
          BAREEQ_SOURCE_ARTIFACT: bareeq-progressive-validation-${{ github.run_id }}
        run: node scripts/audio-progressive-status.mjs

      - name: Update Gemini-only strategy state
        run: node scripts/audio-engine-strategy-guard.mjs --record "--log=$RUNNER_TEMP/bareeq-progressive-repair.log"

      - name: Write classification, repair log, and session report
        env:
          BAREEQ_SOURCE_RUN_ID: ${{ github.run_id }}
          BAREEQ_REPAIR_SESSION_LOG: ${{ runner.temp }}/bareeq-progressive-repair.log
        run: node scripts/audio-repair-session-report.mjs

      - name: Save newest checkpoint before git publication
        if: always()
        uses: actions/cache/save@v4
        with:
          path: audio-candidates
          key: bareeq-audio-progressive-v3-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload recovery evidence before git publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bareeq-progressive-validation-${{ github.run_id }}
          path: |
            audio-candidates/
            docs/audio/PUBLISHED-SADALTAGER-PARTIAL-20260903.json
            docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json
            docs/audio/PROGRESSIVE-STATUS.json
            docs/audio/PHASE-0-READINESS.md
            docs/audio/PHASE-1-CLASSIFICATION.json
            docs/audio/REPAIR-LOG.json
            docs/audio/REPAIR-SESSION-LATEST.md
            docs/audio/ENGINE-STRATEGY-STATE.json
            docs/audio/FINAL-COMPLETION-REPORT.md
            public/audio/manifest.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit and publish progress to production
        run: |
          set -euo pipefail
          COUNT=$(node -p "JSON.parse(require('fs').readFileSync('docs/audio/PROGRESSIVE-STATUS.json','utf8')).exactCount")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/audio
          git add docs/audio/PUBLISHED-SADALTAGER-PARTIAL-20260903.json docs/audio/PROGRESSIVE-STATUS.json docs/audio/ENGINE-STRATEGY-STATE.json
          git add docs/audio/PHASE-0-READINESS.md docs/audio/PHASE-1-CLASSIFICATION.json docs/audio/REPAIR-LOG.json docs/audio/REPAIR-SESSION-LATEST.md
          test ! -f docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json || git add docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json
          test ! -f docs/audio/FINAL-COMPLETION-REPORT.md || git add docs/audio/FINAL-COMPLETION-REPORT.md
          if git diff --cached --quiet; then
            echo "PROGRESSIVE_PUBLICATION_TREE=already-current exact=${COUNT}/15"
            exit 0
          fi
          git commit -m "audio: publish ${COUNT}/15 exact Sadaltager articles"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "PROGRESSIVE_PUBLICATION_TREE=pushed exact=${COUNT}/15"
