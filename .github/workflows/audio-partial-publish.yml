name: Bareeq progressive exact publish

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/audio-openrouter-dual-asr-final.yml'
      - '.github/workflows/audio-partial-publish.yml'
      - 'scripts/audio-progressive-orchestrator.mjs'
      - 'scripts/audio-progressive-publish-router.mjs'
      - 'scripts/audio-repair-progress-recover.mjs'
      - 'scripts/audio-progressive-validate.mjs'
      - 'scripts/audio-progressive-repair.mjs'
      - 'scripts/audio-generate-candidate.mjs'
      - 'scripts/audio-gemini-tts.mjs'
      - 'scripts/audio-validate-consensus.mjs'
      - 'scripts/audio-openrouter-campaign.mjs'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

# Never cancel provider work because of a self-push or a duplicate manual run.
# A cancelled run can lose the newest partial TTS checkpoint before it is saved.
concurrency:
  group: bareeq-progressive-publish-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-publish-current:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BAREEQ_AUDIO_CAMPAIGN_ID: sadaltager-openrouter-20260901-v1
      BAREEQ_BASELINE_RUN_ID: '33962242086'
      BAREEQ_BASELINE_ARTIFACT: bareeq-progressive-validation-33962242086
      BAREEQ_PARTIAL_MARKER: docs/audio/PUBLISHED-SADALTAGER-PARTIAL-20260903.json
      BAREEQ_FINAL_MARKER: docs/audio/PUBLISHED-SADALTAGER-OPENROUTER-20260901.json
      BAREEQ_STATUS_FILE: docs/audio/PROGRESSIVE-STATUS.json
      BAREEQ_REPAIR_MAX_REQUESTS: '10'
      BAREEQ_REPAIR_MIN_SPACING_MS: '9000'
      BAREEQ_REPAIR_TRANSIENT_RETRIES: '2'

    steps:
      - name: Resolve branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.event.pull_request.head.ref }}"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi
          echo "BRANCH=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "BRANCH=${BRANCH}"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.BRANCH }}
          fetch-depth: 0

      - name: Detect progressive runner self-push
        id: self_guard
        run: |
          SUBJECT=$(git log -1 --format=%s)
          echo "HEAD_SUBJECT=${SUBJECT}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'self_push=false' >> "$GITHUB_OUTPUT"
          elif [[ "${SUBJECT}" == audio:\ progressively\ publish* || "${SUBJECT}" == audio:\ progressive\ status* ]]; then
            echo 'self_push=true' >> "$GITHUB_OUTPUT"
            echo 'PROGRESSIVE_SELF_PUSH=yes; provider work skipped'
          else
            echo 'self_push=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.self_guard.outputs.self_push != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: steps.self_guard.outputs.self_push != 'true'
        run: npm ci

      - name: Apply deterministic safety checks
        if: steps.self_guard.outputs.self_push != 'true'
        run: |
          node scripts/audio-final-runtime-repair.mjs
          node scripts/test-audio-dual-asr-adjudicate.mjs
          node --check scripts/audio-progressive-orchestrator.mjs
          node --check scripts/audio-progressive-publish-router.mjs
          node --check scripts/audio-repair-progress-recover.mjs
          node --check scripts/audio-openrouter-campaign.mjs
          node --check scripts/audio-generate-candidate.mjs
          node --check scripts/audio-validate-consensus.mjs

      - name: Verify Gemini credential
        if: steps.self_guard.outputs.self_push != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "${GEMINI_API_KEY}"
          echo 'GEMINI_CREDENTIAL=present'

      - name: Restore newest progressive checkpoint cache
        if: steps.self_guard.outputs.self_push != 'true'
        id: checkpoint_cache
        uses: actions/cache/restore@v4
        with:
          path: audio-candidates
          key: bareeq-audio-progressive-pr21-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bareeq-audio-progressive-pr21-
            bareeq-audio-progressive-

      - name: Restore baseline artifact only when no progressive cache exists
        if: steps.self_guard.outputs.self_push != 'true' && steps.checkpoint_cache.outputs.cache-matched-key == ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BAREEQ_BASELINE_ARTIFACT }}
          path: .checkpoint-baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BAREEQ_BASELINE_RUN_ID }}

      - name: Install baseline audio-candidates only
        if: steps.self_guard.outputs.self_push != 'true' && steps.checkpoint_cache.outputs.cache-matched-key == ''
        run: |
          test -d .checkpoint-baseline/audio-candidates
          rm -rf audio-candidates
          cp -a .checkpoint-baseline/audio-candidates ./audio-candidates

      - name: Record checkpoint source
        if: steps.self_guard.outputs.self_push != 'true'
        run: |
          MATCHED='${{ steps.checkpoint_cache.outputs.cache-matched-key }}'
          if [ -n "${MATCHED}" ]; then
            echo "BAREEQ_CHECKPOINT_SOURCE=cache:${MATCHED}" >> "$GITHUB_ENV"
            echo "CHECKPOINT_SOURCE=cache:${MATCHED}"
          else
            echo "BAREEQ_CHECKPOINT_SOURCE=artifact:${BAREEQ_BASELINE_RUN_ID}/${BAREEQ_BASELINE_ARTIFACT}" >> "$GITHUB_ENV"
            echo "CHECKPOINT_SOURCE=artifact:${BAREEQ_BASELINE_RUN_ID}/${BAREEQ_BASELINE_ARTIFACT}"
          fi

      - name: Verify monotonic generation-complete checkpoint
        if: steps.self_guard.outputs.self_push != 'true'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const p = path.join('audio-candidates','_campaigns',process.env.BAREEQ_AUDIO_CAMPAIGN_ID,'state.json');
          const s = JSON.parse(fs.readFileSync(p,'utf8'));
          const rows = Object.values(s.articles || {});
          if (s.campaignId !== process.env.BAREEQ_AUDIO_CAMPAIGN_ID) throw new Error('checkpoint campaign mismatch');
          if (s.generationComplete !== true || rows.length !== 15 || rows.some((x) => x.generation?.status !== 'generated' || !x.generation?.fingerprint)) {
            throw new Error('checkpoint is not generation-complete 15/15');
          }
          const exact = rows.filter((x) => x.validation?.status === 'validated'
            && x.validation?.fingerprint === x.generation?.fingerprint
            && ['substitutions','deletions','insertions','unresolved'].every((k) => Number(x.validation?.consensus?.[k]) === 0));
          if (exact.length < 5) throw new Error(`checkpoint regressed below 5 exact articles: ${exact.length}`);
          console.log(`PROGRESSIVE_CHECKPOINT=PASS exact_before=${exact.length}/15 source=${process.env.BAREEQ_CHECKPOINT_SOURCE}`);
          NODE

      - name: Recover successful partial targeted repairs
        if: steps.self_guard.outputs.self_push != 'true'
        run: node scripts/audio-repair-progress-recover.mjs

      - name: Run quota-efficient progressive orchestrator
        if: steps.self_guard.outputs.self_push != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/audio-progressive-orchestrator.mjs

      - name: Publish every exact article or finalize 15/15
        if: steps.self_guard.outputs.self_push != 'true'
        run: node scripts/audio-progressive-publish-router.mjs

      - name: Verify publication inventory and immutable exact gates
        if: steps.self_guard.outputs.self_push != 'true'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const state = JSON.parse(fs.readFileSync(path.join('audio-candidates','_campaigns',process.env.BAREEQ_AUDIO_CAMPAIGN_ID,'state.json'),'utf8'));
          const snapshot = JSON.parse(fs.readFileSync('docs/audio/AUDIO-TRUTH-SNAPSHOT.json','utf8'));
          const keys = ['substitutions','deletions','insertions','unresolved'];
          const exact = snapshot.articles.filter((item) => {
            const r = state.articles?.[item.articleId] || {};
            return r.validation?.status === 'validated'
              && r.validation?.fingerprint === r.generation?.fingerprint
              && keys.every((k) => Number(r.validation?.consensus?.[k]) === 0);
          });
          const final = exact.length === 15;
          const markerPath = final ? process.env.BAREEQ_FINAL_MARKER : process.env.BAREEQ_PARTIAL_MARKER;
          const marker = JSON.parse(fs.readFileSync(markerPath,'utf8'));
          const articles = marker.articles || [];
          const publishedCount = final ? Number(marker.articleCount) : Number(marker.publishedCount);
          const fallbackCount = final ? 0 : Number(marker.fallbackCount);
          if (publishedCount !== exact.length) throw new Error(`published count ${publishedCount} != exact ${exact.length}`);
          if (publishedCount + fallbackCount !== 15) throw new Error('publication inventory must total 15');
          if (final && marker.schema !== 'bareeq.audio-openrouter-published-tree.v1') throw new Error('final marker schema mismatch');
          if (!final && (marker.schema !== 'bareeq.audio-openrouter-partial-published-tree.v1' || marker.publicationComplete !== false)) throw new Error('partial marker contract mismatch');
          for (const item of articles) {
            const row = state.articles?.[item.articleId];
            const c = row?.validation?.consensus || {};
            if (row?.validation?.status !== 'validated' || row.validation.fingerprint !== row.generation?.fingerprint) throw new Error(`published article lacks matching validation: ${item.articleId}`);
            if (!keys.every((k) => Number(c[k]) === 0)) throw new Error(`published article is not exact 0/0/0/0: ${item.articleId}`);
            if (!item.fullSha256 || item.fullSha256 !== row.publication?.fullSha256 || item.fullSha256 !== row.validation?.fullSha256) throw new Error(`published digest mismatch: ${item.articleId}`);
          }
          console.log(`PROGRESSIVE_PUBLICATION_GATE=PASS published=${publishedCount}/15 fallback=${fallbackCount} final=${final}`);
          NODE

      - name: Write progressive per-article status summary
        if: steps.self_guard.outputs.self_push != 'true'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const state = JSON.parse(fs.readFileSync(path.join('audio-candidates','_campaigns',process.env.BAREEQ_AUDIO_CAMPAIGN_ID,'state.json'),'utf8'));
          const snapshot = JSON.parse(fs.readFileSync('docs/audio/AUDIO-TRUTH-SNAPSHOT.json','utf8'));
          const keys = ['substitutions','deletions','insertions','unresolved'];
          const exactRows = snapshot.articles.filter((item) => {
            const r = state.articles?.[item.articleId] || {};
            return r.validation?.status === 'validated' && r.validation?.fingerprint === r.generation?.fingerprint
              && keys.every((k) => Number(r.validation?.consensus?.[k]) === 0);
          });
          const final = exactRows.length === 15;
          const marker = JSON.parse(fs.readFileSync(final ? process.env.BAREEQ_FINAL_MARKER : process.env.BAREEQ_PARTIAL_MARKER,'utf8'));
          const publishedIds = new Set((marker.articles || []).map((a) => a.articleId));
          const rows = snapshot.articles.map((item) => {
            const row = state.articles?.[item.articleId] || {};
            const gen = row.generation || {};
            const val = row.validation || {};
            const consensus = val.consensus || {};
            return {
              articleId: item.articleId,
              title: item.title,
              audioKey: item.audioKey,
              fingerprint: gen.fingerprint || null,
              generationStatus: gen.status || 'missing',
              validationStatus: val.status || 'not-run',
              substitutions: Number.isFinite(Number(consensus.substitutions)) ? Number(consensus.substitutions) : null,
              deletions: Number.isFinite(Number(consensus.deletions)) ? Number(consensus.deletions) : null,
              insertions: Number.isFinite(Number(consensus.insertions)) ? Number(consensus.insertions) : null,
              unresolved: Number.isFinite(Number(consensus.unresolved)) ? Number(consensus.unresolved) : null,
              exact: gen.fingerprint && val.status === 'validated' && val.fingerprint === gen.fingerprint && keys.every((k) => Number(consensus[k]) === 0),
              publishedExact: publishedIds.has(item.articleId),
              fullSha256: val.fullSha256 || null,
              repairProgress: val.repairProgress || null,
              error: val.error || null,
            };
          });
          const summary = {
            schema: 'bareeq.audio-progressive-status.v2',
            campaignId: process.env.BAREEQ_AUDIO_CAMPAIGN_ID,
            checkpointSource: process.env.BAREEQ_CHECKPOINT_SOURCE,
            generatedAt: new Date().toISOString(),
            publishedCount: final ? 15 : Number(marker.publishedCount),
            fallbackCount: final ? 0 : Number(marker.fallbackCount),
            exactCount: rows.filter((r) => r.exact).length,
            publicationComplete: final,
            orchestrator: state.progressiveOrchestrator || null,
            rows,
          };
          fs.mkdirSync(path.dirname(process.env.BAREEQ_STATUS_FILE), { recursive: true });
          fs.writeFileSync(process.env.BAREEQ_STATUS_FILE, JSON.stringify(summary, null, 2) + '\n');
          console.log(`PROGRESSIVE_STATUS_SUMMARY published=${summary.publishedCount} exact=${summary.exactCount} fallback=${summary.fallbackCount} final=${summary.publicationComplete}`);
          NODE

      - name: Save newest progressive checkpoint before any self-push
        if: ${{ always() && steps.self_guard.outputs.self_push != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: audio-candidates
          key: bareeq-audio-progressive-pr21-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload progressive evidence before any self-push
        if: ${{ always() && steps.self_guard.outputs.self_push != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: bareeq-progressive-validation-${{ github.run_id }}
          path: |
            audio-candidates/
            ${{ env.BAREEQ_PARTIAL_MARKER }}
            ${{ env.BAREEQ_FINAL_MARKER }}
            ${{ env.BAREEQ_STATUS_FILE }}
            public/audio/manifest.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Commit all newly publishable audio and status to branch
        if: steps.self_guard.outputs.self_push != 'true'
        env:
          PR_BRANCH: ${{ steps.branch.outputs.BRANCH }}
        run: |
          set -euo pipefail
          COUNT=$(node -p "JSON.parse(require('fs').readFileSync(process.env.BAREEQ_STATUS_FILE,'utf8')).publishedCount")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/audio
          git add "${BAREEQ_STATUS_FILE}"
          test ! -f "${BAREEQ_PARTIAL_MARKER}" || git add "${BAREEQ_PARTIAL_MARKER}"
          test ! -f "${BAREEQ_FINAL_MARKER}" || git add "${BAREEQ_FINAL_MARKER}"
          if git diff --cached --quiet; then
            echo "PROGRESSIVE_PUBLICATION_TREE=already-current count=${COUNT}"
          else
            git commit -m "audio: progressively publish ${COUNT} exact Sadaltager articles"
            git push origin "HEAD:${PR_BRANCH}"
            echo "PROGRESSIVE_PUBLICATION_TREE=pushed count=${COUNT}"
          fi
