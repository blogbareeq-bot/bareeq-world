<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>نافذة بريق — كيف تعرف شاشة هاتفك أين وضعت إصبعك؟</title>
<meta name="description" content="نافذة بريق: رحلة قصيرة تحت زجاج شاشتك." />
<meta name="color-scheme" content="light dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles/atlas.css" />
</head>
<body>
<a class="skip" href="#atlas">تخطَّ إلى المحتوى</a>

<!-- ═══ الغلاف الثابت: الهوية + مقياس العمق ═══ -->
<header class="chrome" data-chrome>
  <a class="chrome__brand" href="../../" aria-label="بريق — نافذتك إلى المعرفة">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 14 24 8v30L8 42V14Zm18-6 14 6v28l-14-4V8Z"/><path d="M24 8v30"/></svg>
    <span><b>نافذة بريق</b><small data-chrome-sub>نافذتك إلى المعرفة</small></span>
  </a>
  <div class="chrome__actions">
    <button class="chrome__btn" type="button" data-motion-toggle aria-pressed="false" title="تهدئة الحركة">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h5l3-6 3 12 3-6h2"/></svg>
      <span class="sr">تهدئة الحركة</span>
    </button>
    <a class="chrome__btn chrome__btn--text" data-article-link href="#">المقال الكامل</a>
  </div>
</header>

<!-- مقياس العمق: يعمل كتقدّم وكخريطة للمشاهد -->
<nav class="gauge" data-gauge aria-label="مشاهد نافذة بريق">
  <span class="gauge__rail" aria-hidden="true"><i data-gauge-fill></i></span>
  <ol data-gauge-list></ol>
</nav>

<main id="atlas" class="atlas" data-atlas></main>

<script src="./scripts/scenes.js"></script>
<script src="./scripts/atlas.js"></script>
</body>
</html>
