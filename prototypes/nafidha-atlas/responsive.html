<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />

<title>فحص Responsive — نافذة بريق Atlas</title>
<style>
  body{margin:0;padding:22px;background:#0b1622;color:#e9f0eb;font:14px/1.7 system-ui,'Segoe UI',Tahoma,sans-serif}
  h1{font-size:1rem;font-weight:700;margin:0 0 4px}
  p{margin:0 0 20px;opacity:.6;font-size:.8rem}
  .rack{display:flex;gap:26px;align-items:flex-start;overflow-x:auto;padding-bottom:20px}

  figcaption{font-size:.72rem;opacity:.7;padding:8px 2px;font-variant-numeric:tabular-nums}
  iframe{border:1px solid rgba(233,240,235,.2);border-radius:10px;background:#f6f8f4;display:block}

<body>
<h1>فحص Responsive — نافذة بريق Atlas</h1>

<div class="rack">
  <figure><iframe src="./index.html" width="390"  height="844" title="390×844"></iframe><figcaption>390 × 844 — هاتف</figcaption></figure>
  <figure><iframe src="./index.html" width="430"  height="932" title="430×932"></iframe><figcaption>430 × 932 — هاتف كبير</figcaption></figure>
  <figure><iframe src="./index.html" width="812"  height="375" title="812×375"></iframe><figcaption>812 × 375 — أفقي</figcaption></figure>
  <figure><iframe src="./index.html" width="1280" height="800" title="1280×800"></iframe><figcaption>1280 × 800 — سطح المكتب</figcaption></figure>
</div>

</html>
