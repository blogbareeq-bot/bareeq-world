<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بريق — سطور · صدى · نافذة</title><style>
:root{--navy:#1e295d;--deep:#0c2c4a;--teal:#0c5b5d;--turq:#1dd3b0;--ivory:#f8f6f0;--gold:#d4af37;--ink:#18233b;--muted:#69748b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f8f6f0,#eef3f1);font-family:"Cairo","Noto Sans Arabic",system-ui,sans-serif;color:var(--ink)}button{font:inherit}.wrap{max-width:1080px;margin:auto;padding:30px 18px}.brand{text-align:center;color:var(--navy);margin-bottom:22px}.brand b{font-size:22px}.brand small{display:block;color:var(--muted);margin-top:3px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.mode{min-height:125px;border:1px solid rgba(30,41,93,.1);border-radius:22px;background:rgba(255,255,255,.86);box-shadow:0 12px 30px #1e295d10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--navy);cursor:pointer;transition:.25s}.mode:hover{transform:translateY(-2px);border-color:#d4af3755}.mode .ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#faf8f3;border:1px solid #d4af3725;color:var(--gold);font-size:23px}.mode strong{font-size:19px}.mode small{color:var(--muted);font-size:12px}.mode.window{background:radial-gradient(circle at 85% 18%,#d4af3720,transparent 32%),linear-gradient(145deg,var(--deep),#0d3d50 60%,var(--teal));border-color:#d4af3790;color:white}.window small{color:#ffffffb8}.pill{position:absolute;top:10px;left:10px;background:var(--gold);color:#14243a;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.mode.window{position:relative}.intro{margin:24px auto 0;max-width:820px;padding:18px 22px;border-right:3px solid var(--gold);background:#ffffff8a;border-radius:16px;color:#46516a;line-height:1.9}.modal{position:fixed;inset:0;background:#091525d9;display:none;place-items:center;padding:18px;z-index:5}.modal.open{display:grid}.story{width:min(920px,100%);height:min(760px,92vh);border-radius:28px;overflow:hidden;background:var(--ivory);position:relative;box-shadow:0 30px 80px #0006}.bar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#ffffffd9;border-bottom:1px solid #1e295d12}.counter{font-weight:800;color:var(--navy)}.close,.nav{border:0;background:transparent;cursor:pointer;color:var(--navy);border-radius:12px}.close{font-size:25px;padding:4px 10px}.progress{height:3px;background:#dfe6e4}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--turq),var(--gold));transition:.35s}.card{height:calc(100% - 61px);display:grid;grid-template-rows:1fr auto;position:relative;overflow:hidden}.visual{display:grid;place-items:center;padding:35px 40px 10px;min-height:0}.symbol{width:min(300px,58vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:110px;background:radial-gradient(circle,#fff7d8,#d4af371c 45%,transparent 70%);filter:drop-shadow(0 18px 25px #1e295d18);animation:float 5s ease-in-out infinite}.copy{text-align:center;padding:10px 34px 38px}.copy h2{margin:0 auto 10px;color:var(--navy);font-size:clamp(24px,4vw,38px)}.copy p{margin:auto;max-width:700px;font-size:clamp(15px,2vw,19px);line-height:2;color:#3f4a61}.navs{position:absolute;inset:auto 18px 18px;display:flex;justify-content:space-between;pointer-events:none}.nav{pointer-events:auto;width:44px;height:44px;background:#ffffffd9;box-shadow:0 8px 20px #1e295d15;font-size:24px}.dark .story{background:linear-gradient(145deg,#0c2c4a,#0d3d50 62%,#0c5b5d);color:white}.dark .bar{background:#071c2ed9;border-color:#fff2}.dark .counter,.dark .close,.dark .copy h2{color:white}.dark .copy p{color:#ffffffbd}.dark .visual{color:white}.dark .nav{background:#ffffff18;color:white;border:1px solid #ffffff18}@keyframes float{50%{transform:translateY(-7px)}}@media(max-width:650px){.wrap{padding:20px 10px}.modes{gap:8px}.mode{min-height:108px;border-radius:18px}.mode .ico{width:42px;height:42px}.mode strong{font-size:16px}.mode small{font-size:10px}.story{height:94vh;border-radius:20px}.visual{padding:25px 15px 0}.copy{padding:5px 22px 34px}.navs{inset:auto 10px 10px}.nav{width:40px;height:40px}}
</style></head><body><main class="wrap"><header class="brand"><b>بريق</b><small>نافذتك إلى المعرفة</small></header><section class="modes" aria-label="طرق قراءة المقال"><button class="mode"><span class="ico">✒</span><strong>سطور</strong><small>النص الكامل للمقال</small></button><button class="mode"><span class="ico">◖◗</span><strong>صدى</strong><small>استمع إلى المقال مع النص</small></button><button class="mode window" onclick="openStory()"><span class="pill" id="pill" hidden>استكمال</span><span class="ico">⌑</span><strong>نافذة</strong><small id="sub">تجربة بصرية تفاعلية</small></button></section><p class="intro">نموذج مرجعي لتجربة «نافذة» في مقال «أعطِ الصباح فرصة». المطلوب تطويره جذريًا مع الحفاظ على روح بريق.</p></main><div class="modal" id="modal"><section class="story" id="story"><div class="bar"><button class="close" onclick="closeStory()" aria-label="إغلاق">×</button><span class="counter" id="counter"></span></div><div class="progress"><i id="prog"></i></div><div class="card"><div class="visual"><div class="symbol" id="symbol">☀</div></div><div class="copy"><h2 id="title"></h2><p id="text"></p></div><div class="navs"><button class="nav" id="next" onclick="next()">←</button><button class="nav" id="prev" onclick="prev()">→</button></div></div></section></div><script>
const cards=[
['cover','☀','أعطِ الصباح فرصة','قراءة بصرية في أدب الأمل الإنساني لـ عبدالوهاب مطاوع',1],
['morning','◒','الصباح ليس مجرد وقت','الصباح في أدب عبدالوهاب مطاوع ليس مجرد بداية ساعات يومية، بل هو آلية متجددة لاستعادة التوازن النفسي، وفرصة دائمًا لغسل الأحزان والبدء من جديد.',1],
['balm','❈','بلسم للروح المتعبة','تكمن قيمة الكلمة في لغتها الدافئة التي تداوي النفوس؛ فهي تستخرج من التجارب البسيطة معاني تعيد للإنسان أمله وكرامته.',0],
['youth','◌','الشباب ليس عُمرًا','الشباب حالة روحية ونفسية؛ أنت شابّ ما دمت تتعامل مع الحياة بحماس وإخلاص، وتشيخ الروح حين تفقد إيمانها بالخير وتستسلم لليأس.',0],
['dignity','◇','الكرامة.. خط الدفاع الأخير','الكرامة هي السور الداخلي لحماية إنسانية الفرد، والرفض الواعي للإهانة والظلم، حتى في أشد الظروف قسوة.',1],
['giving','∞','العطاء الصامت يصنع المعنى','خلف كل صمود حقيقي طاقة دعم غير مرئية؛ العطاء الصامت يتحمل المشقة ويصنع السكينة والنجاح بعيدًا عن الأضواء.',1],
['faces','◐','ما وراء الوجوه','خلف الوجوه الصارمة والصور المثالية تتوارى هشاشة وأسئلة إنسانية عميقة. فهم هذه الهشاشة يمنحنا رؤية أكثر رحمة وتعاطفًا.',0],
['hope','↗','الأمل ليس سذاجة','الأمل الواعي لا يعني الهروب من الواقع أو إنكار الألم، بل هو اختيار شجاع لمواجهة الصعاب وفتح مسار للضوء.',0],
['end','✦','أعطِ الصباح فرصة','مهما طال الليل، هناك دائمًا متسع للبدء من جديد. احتفظ بكرامتك، وارحم ضعف الآخرين، وتسلّح بإيمان لا يتزعزع.',1]
];let i=0;const modal=document.getElementById('modal');
function render(){const c=cards[i];document.getElementById('symbol').textContent=c[1];document.getElementById('title').textContent=c[2];document.getElementById('text').textContent=c[3];document.getElementById('counter').textContent=`${i+1} / ${cards.length}`;document.getElementById('prog').style.width=((i+1)/cards.length*100)+'%';document.getElementById('next').disabled=i===cards.length-1;document.getElementById('prev').disabled=i===0;document.getElementById('story').classList.toggle('dark',!!c[4]);document.getElementById('modal').classList.toggle('dark',!!c[4]);}
function openStory(){const saved=+localStorage.getItem('bareeq-window-demo')||0;i=saved>0&&saved<cards.length?saved:0;modal.classList.add('open');render();document.getElementById('sub').textContent=saved?'تابع نافذتك من حيث توقفت':'تجربة بصرية تفاعلية';}
function closeStory(){modal.classList.remove('open')}function next(){if(i<cards.length-1){i++;localStorage.setItem('bareeq-window-demo',i);render()}}function prev(){if(i>0){i--;localStorage.setItem('bareeq-window-demo',i);render()}}
addEventListener('keydown',e=>{if(!modal.classList.contains('open'))return;if(e.key==='Escape')closeStory();if(e.key==='ArrowLeft')next();if(e.key==='ArrowRight')prev()});modal.addEventListener('click',e=>{if(e.target===modal)closeStory()});
</script></body></html>
